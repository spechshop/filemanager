rules:
  - id: filemanager-http-guard-required
    languages: [php]
    message: Every HTTP api must start with the shared fail-closed authorization guard.
    severity: ERROR
    paths:
      include: ['**/plugins/Request/apps/**']
    patterns:
      - pattern: public static function api(...) { ... }
      # __CLASS__ is context-dependent in PHP; an AST-only negative pattern
      # can constant-fold it against the rule's synthetic class. Check source
      # spelling at the first statement, with independent direct-handler tests.
      - pattern-not-regex: '(?s)\bpublic\s+static\s+function\s+api\s*\([^)]*\)(?:\s*:\s*[?\\\w]+)?\s*\{\s*if\s*\(\s*!\s*security::authorize\s*\(\s*\$request\s*,\s*\$response\s*,\s*__CLASS__\s*\)\s*\)\s*return\s+true\s*;'
  - id: filemanager-auth-fallthrough
    languages: [php]
    message: Responding to an authentication failure does not stop execution. Return immediately.
    severity: ERROR
    pattern-regex: '(?i)\bsecurity::verifyToken\s*\([^;]*?\)\s*\?:\s*security::invalidToken\s*\('
  - id: filemanager-browser-html-data
    languages: [generic]
    message: Use textContent or the context-specific FMUI encoder for untrusted data.
    severity: ERROR
    paths:
      include: ['**/plugins/Request/**/*.html', '**/js/**']
    pattern-regex: '\.innerHTML\s*=\s*(suggestionText|originalText|path)\b'
  - id: filemanager-javascript-eval
    languages: [javascript]
    message: Do not evaluate strings as JavaScript.
    severity: ERROR
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
  - id: filemanager-insecure-tls-options
    languages: [php]
    message: TLS peers and hostnames must be verified, including options passed as arrays.
    severity: ERROR
    pattern-regex: '(?i)CURLOPT_SSL_VERIFY(?:PEER|HOST)\s*(?:=>|,)\s*(?:false|0)\b'
