                                    <script>
                                        async function findLocationAddress(path) {
                                            const timeout = 30000;
                                            const interval = 300;
                                            const start = Date.now();

                                            const waitUntil = async (conditionFn) => {
                                                return new Promise((resolve, reject) => {
                                                    const timer = setInterval(() => {
                                                        if (conditionFn()) {
                                                            clearInterval(timer);
                                                            resolve(true);
                                                        } else if (Date.now() - start > timeout) {
                                                            clearInterval(timer);
                                                            reject("Tempo limite ao localizar: " + path);
                                                        }
                                                    }, interval);
                                                });
                                            };

                                            // Caminhos intermediários (pastas)
                                            const segments = path.split('/').filter(Boolean);
                                            let current = '';

                                            for (let i = 0; i < segments.length - 1; i++) {
                                                current += '/' + segments[i];

                                                const selector = `.folder[data-path="${current}/"]`;
                                                const folderElement = document.querySelector(selector);

                                                if (!folderElement) {
                                                    console.log(`Aguardando pasta: ${current}/`);
                                                    try {
                                                        await waitUntil(() => document.querySelector(selector));
                                                    } catch (e) {
                                                        return console.warn(e);
                                                    }
                                                }

                                                const folder = document.querySelector(selector);
                                                const subUl = folder?.nextElementSibling;
                                                const isHidden = subUl?.classList.contains('hidden');

                                                if (isHidden) {
                                                    folder.click(); // simula clique pra abrir a pasta
                                                    await new Promise(r => setTimeout(r, 300)); // aguarda animação abrir
                                                }
                                            }

                                            // Finalmente, tenta localizar o arquivo
                                            const fileSelector = `.file[file-path="${path}"]`;

                                            try {
                                                await waitUntil(() => document.querySelector(fileSelector));
                                                const fileElement = document.querySelector(fileSelector);
                                                fileElement.scrollIntoView({behavior: "smooth", block: "center"});

                                                // aplica um fundo amarelo temporário para destacar
                                                fileElement.style.backgroundColor = "#ffe082";
                                                fileElement.style.color = 'black';
                                                setTimeout(() => {
                                                    fileElement.style.transition = "background-color 1s";
                                                    fileElement.style.backgroundColor = "";
                                                    fileElement.style.color = '';
                                                }, 2000);

                                                // Opcional: clicar automaticamente
                                                // fileElement.click();

                                                console.log('Localizado:', path);
                                            } catch (e) {
                                                console.warn(e);
                                            }
                                        }

                                        function closeAllTabs() {
                                            const tabs = document.querySelectorAll('.tab-header-item');
                                            tabs.forEach(tab => {
                                                tab.remove();
                                            });
                                            models = {}; // Limpa os modelos
                                            editor.setModel(null); // Limpa o modelo do editor
                                            tabsCache = {}; // Limpa o cache de abas
                                        }

                                    </script>

                <script>
                    let terminals = {};

                    // ---- Token helper ----
                    function getToken() {
                        return localStorage.tokenBrowser || document.getElementById('fp')?.innerText?.trim() || '';
                    }

                    async function waitForToken() {
                        return new Promise((resolve) => {
                            const check = setInterval(() => {
                                const t = getToken();
                                if (t && t.length > 3) {
                                    clearInterval(check);
                                    resolve(t);
                                }
                            }, 100);
                        });
                    }

                    // ---- API helpers ----
                    async function apiSaveTerminal(session) {
                        const token = getToken();
                        return fetch(`/saveTerminal?tokenBrowser=${token}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                id: session.id,
                                name: session.name,
                            }),
                        }).then(r => r.json()).catch(() => ({}));
                    }

                    async function apiDeleteTerminal(terminalId) {
                        const token = getToken();
                        return fetch(`/deleteTerminal?tokenBrowser=${token}&id=${terminalId}`)
                            .then(r => r.json()).catch(() => ({}));
                    }

                    async function apiGetTerminals() {
                        const token = getToken();
                        return fetch(`/getTerminals?tokenBrowser=${token}`)
                            .then(r => r.json()).catch(() => []);
                    }

                    // ---- LocalStorage helpers ----
                    function getStoredTerminals() {
                        try {
                            const raw = localStorage.getItem('storageTerminals');
                            return raw ? JSON.parse(raw) : [];
                        } catch { return []; }
                    }

                    function setStoredTerminals(sessions) {
                        localStorage.setItem('storageTerminals', JSON.stringify(sessions));
                    }

                    function getXtermDimensions() {
                        try {
                            const raw = localStorage.getItem('xtermDimensions');
                            return raw ? JSON.parse(raw) : null;
                        } catch { return null; }
                    }

                    // ---- Tab & terminal creation ----
                    function createTerminalTab(options) {
                        const { id: terminalId, name } = options;

                        let container = document.getElementById(terminalId);
                        if (!container) {
                            container = document.createElement('div');
                            container.id = terminalId;
                            container.className = 'xterm-container';
                            container.style.display = 'none';
                            document.getElementById('terms').appendChild(container);
                        }

                        const li = document.createElement('li');
                        li.classList.add('nav-item');
                        li.dataset.terminalId = terminalId;

                        const link = document.createElement('a');
                        link.classList.add('nav-link');
                        link.href = '#';

                        const icon = document.createElement('i');
                        icon.className = 'fa-duotone fa-solid fa-terminal me-1';

                        const label = document.createElement('span');
                        label.className = 'terminal-tab-label';
                        label.textContent = name;
                        label.title = 'Clique duplo para renomear';

                        const closeBtn = document.createElement('span');
                        closeBtn.className = 'close-tab';
                        closeBtn.innerHTML = '&times;';

                        link.appendChild(icon);
                        link.appendChild(label);
                        link.appendChild(closeBtn);
                        li.appendChild(link);
                        document.getElementById('new-terminal').before(li);

                        label.addEventListener('dblclick', (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            startRename(label, options);
                        });

                        link.addEventListener('click', (e) => {
                            if (e.target === closeBtn || e.target.closest('.close-tab')) return;
                            selectTerminalTab(terminalId);
                        });

                        closeBtn.addEventListener('click', (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            closeTerminalTab(terminalId);
                        });

                        link.addEventListener('contextmenu', (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            showTerminalCtxMenu(e.clientX, e.clientY, terminalId, label, options);
                        });

                        const dims = getXtermDimensions();
                        const term = new window.Terminal({
                            cursorBlink: true,
                            cols: dims?.cols ?? 100,
                            rows: dims?.rows ?? 30,
                            scrollback: 5000,
                            allowProposedApi: true,
                            theme: {
                                background: '#000000',
                                foreground: '#f0f0f0',
                                cursor: '#00bfff',
                            },
                        });
                        term.open(container);
                        terminals[terminalId] = { terminal: term, socket: null, options };

                        term.onResize((size) => {
                            const sock = terminals[terminalId]?.socket;
                            if (sock?.readyState === WebSocket.OPEN) {
                                sock.send(JSON.stringify({
                                    command: 'resizeXtermHandlerCommand',
                                    token: sock.url.split('/').pop(),
                                    cols: size.cols,
                                    rows: size.rows,
                                    isCodex: true,
                                }));
                            }
                        });

                        // Ctrl+C inteligente (copia se houver seleção) e Ctrl+V com
                        // bracketed paste — roda ANTES do xterm processar a tecla,
                        // evitando que o browser/atalho nativo interfira na seleção.
                        term.attachCustomKeyEventHandler((event) => {
                            if (event.type !== 'keydown') return true;
                            if (!event.ctrlKey || event.altKey || event.metaKey) return true;

                            const key = event.key.toLowerCase();

                            if (key === 'c' && !event.shiftKey) {
                                const sel = term.getSelection();
                                if (sel) {
                                    navigator.clipboard.writeText(sel).catch(() => {});
                                    term.clearSelection();
                                    event.preventDefault();
                                    return false;
                                }
                                return true;
                            }

                            if (key === 'v' && !event.shiftKey) {
                                navigator.clipboard.readText().then((text) => {
                                    if (text) term.paste(text);
                                }).catch(() => {});
                                event.preventDefault();
                                return false;
                            }

                            return true;
                        });

                        // onData captura teclado + sequências de mouse geradas pelo xterm
                        // quando apps como htop habilitam mouse reporting (ex: \x1b[?1000h)
                        term.onData((data) => {
                            const sock = terminals[terminalId]?.socket;
                            if (!sock || sock.readyState !== WebSocket.OPEN) return;
                            try {
                                runCommand(sock, data);
                            } catch (e) {
                                console.error('Erro ao processar entrada:', e);
                            }
                        });

                        initWebSocket(term, options);
                        selectTerminalTab(terminalId);
                        return { term, container };
                    }

                    // ---- Context menu ----
                    (function () {
                        const ctxMenu = document.getElementById('terminal-ctx-menu');
                        let ctxTarget = null; // { terminalId, labelEl, options }

                        function hideCtxMenu() {
                            ctxMenu.style.display = 'none';
                            ctxTarget = null;
                        }

                        window.showTerminalCtxMenu = function (x, y, terminalId, labelEl, options) {
                            ctxTarget = { terminalId, labelEl, options };
                            // Keep menu inside the viewport
                            const menuW = 180, menuH = 180;
                            const left = Math.min(x, window.innerWidth - menuW - 8);
                            const top = Math.min(y, window.innerHeight - menuH - 8);
                            ctxMenu.style.left = left + 'px';
                            ctxMenu.style.top = top + 'px';
                            ctxMenu.style.display = 'block';
                        };

                        ctxMenu.addEventListener('click', async (e) => {
                            const item = e.target.closest('[data-action]');
                            if (!item || !ctxTarget) return;
                            const { terminalId, labelEl, options } = ctxTarget;
                            hideCtxMenu();

                            switch (item.dataset.action) {
                                case 'rename':
                                    startRename(labelEl, options);
                                    break;

                                case 'duplicate': {
                                    const sessions = getStoredTerminals();
                                    const newId = Math.random().toString(36).substring(2, 15)
                                               + Math.random().toString(36).substring(2, 15);
                                    const srcName = options.name || 'Terminal';
                                    const newName = srcName + ' (cópia)';
                                    const token = await waitForToken();
                                    sessions.push({ id: newId, name: newName });
                                    setStoredTerminals(sessions);
                                    createTerminalTab({ id: newId, name: newName, token });
                                    await apiSaveTerminal({ id: newId, name: newName });
                                    break;
                                }

                                case 'new':
                                    document.getElementById('new-terminal').click();
                                    break;

                                case 'close-others': {
                                    const allIds = [...document.querySelectorAll('#tabsTerm li[data-terminal-id]')]
                                        .map(li => li.dataset.terminalId)
                                        .filter(id => id !== terminalId);
                                    for (const id of allIds) await closeTerminalTab(id);
                                    selectTerminalTab(terminalId);
                                    break;
                                }

                                case 'close':
                                    await closeTerminalTab(terminalId);
                                    break;
                            }
                        });

                        // Close on outside click or Escape
                        document.addEventListener('click', (e) => {
                            if (!ctxMenu.contains(e.target)) hideCtxMenu();
                        });
                        document.addEventListener('keydown', (e) => {
                            if (e.key === 'Escape') hideCtxMenu();
                        });
                    })();

                    // ---- Rename (double-click on tab label) ----
                    function startRename(labelEl, options) {
                        const terminalId = options.id;
                        const currentName = labelEl.textContent;
                        labelEl.classList.add('editing');

                        const input = document.createElement('input');
                        input.type = 'text';
                        input.value = currentName;
                        input.className = 'terminal-rename-input';
                        labelEl.textContent = '';
                        labelEl.appendChild(input);
                        input.focus();
                        input.select();

                        const finishRename = async () => {
                            const newName = input.value.trim() || currentName;
                            labelEl.classList.remove('editing');
                            labelEl.textContent = newName;
                            options.name = newName;

                            const sessions = getStoredTerminals();
                            const idx = sessions.findIndex(s => s.id === terminalId);
                            if (idx !== -1) sessions[idx].name = newName;
                            setStoredTerminals(sessions);
                            await apiSaveTerminal({ id: terminalId, name: newName });
                        };

                        input.addEventListener('blur', finishRename);
                        input.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter') input.blur();
                            if (e.key === 'Escape') { input.value = currentName; input.blur(); }
                        });

                    // ---- Select/show tab ----
                    function selectTerminalTab(terminalId) {
                        document.querySelectorAll('#tabsTerm .nav-link').forEach(l => l.classList.remove('active'));
                        document.querySelectorAll('#terms .xterm-container').forEach(c => { c.style.display = 'none'; });
                        const li = document.querySelector(`#tabsTerm [data-terminal-id="${terminalId}"]`);
                        if (li) li.querySelector('.nav-link').classList.add('active');
                        const container = document.getElementById(terminalId);
                        if (container) container.style.display = 'block';
                        adjustTerminalSizeFromStorage(terminalId);
                    }

                    // ---- Close tab ----
                    async function closeTerminalTab(terminalId) {
                        const termInfo = terminals[terminalId];
                        if (termInfo?.socket?.readyState === WebSocket.OPEN) {
                            try {
                                termInfo.socket.send(JSON.stringify({
                                    command: 'closeXtermHandlerCommand',
                                    token: termInfo.socket.url.split('/').pop(),
                                    isCodex: true,
                                }));
                            } catch {}
                            termInfo.socket.onclose = null;
                            termInfo.socket.close();
                        }

                        document.querySelector(`#tabsTerm [data-terminal-id="${terminalId}"]`)?.remove();
                        document.getElementById(terminalId)?.remove();
                        delete terminals[terminalId];

                        const sessions = getStoredTerminals().filter(s => s.id !== terminalId);
                        setStoredTerminals(sessions);
                        await apiDeleteTerminal(terminalId);

                        const remaining = document.querySelectorAll('#tabsTerm li[data-terminal-id]');
                        if (remaining.length > 0) {
                            selectTerminalTab(remaining[remaining.length - 1].dataset.terminalId);
                        }
                    }

                    document.getElementById('resizer').addEventListener('mousedown', (e) => {

                        window.addEventListener('mousemove', onResizerMove);
                        window.addEventListener('mouseup', () => window.removeEventListener('mousemove', onResizerMove));
                    });

                    function onResizerMove(e) {
                        const footerTerminal = document.getElementById('footer-terminal');
                        const editorEl = document.getElementById('editor');
                        const fArch = document.getElementById('fArch');
                        const filesArchitecture = document.getElementById('filesArchitecture');
                        const newWidth = document.getElementById('terms').clientWidth;
                        const newHeight = window.innerHeight - e.clientY;

                        const editorHeight = footerTerminal.getBoundingClientRect().top;
                        if (editorEl) editorEl.style.height = `${editorHeight - 80}px`;
                        if (fArch) fArch.style.height = `${editorHeight - 70}px`;
                        if (filesArchitecture) filesArchitecture.style.height = `${editorHeight - 130}px`;

                        const calcCols = Math.floor(newWidth / 9) - 2;
                        const calcRows = Math.floor(document.getElementById('terms').getBoundingClientRect().height / 17);

                        Object.keys(terminals).forEach((id) => {
                            const el = document.getElementById(id);
                            if (el) {
                                el.style.width = `${newWidth}px`;
                                el.style.height = `${newHeight - 42}px`;

                            if (info?.terminal) info.terminal.resize(calcCols, calcRows);
                        });

                            rows: calcRows,
                            width: newWidth,
                            height: newHeight - 42,

                    }

                        if (!dims) return;
                        el.style.width = `${dims.width}px`;
                        el.style.height = `${dims.height}px`;
                        const info = terminals[terminalId];
                        if (info?.terminal) {
                            const calcCols = Math.floor(dims.width / 9) - 2;
                            const calcRows = Math.floor(dims.height / 17);
                            info.terminal.resize(calcCols, calcRows);
                        }
                    }

                    // ---- WebSocket ----
                    async function initWebSocket(terminal, options) {
                        const token = await waitForToken();
                        options.token = token;

                        const terminalId = options.id;
                        const hostname = window.location.port
                            ? `${window.location.hostname}:${window.location.port}`
                            : window.location.hostname;
                        const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
                        const wsToken = `${token}-${terminalId}`;
                        const socket = new WebSocket(`${protocol}://${hostname}/${wsToken}`);

                        if (terminals[terminalId]) terminals[terminalId].socket = socket;

                        socket.onopen = () => {
                            socket.send(JSON.stringify({
                                command: 'startXtermHandlerCommand',
                                token: wsToken,
                                isCodex: true,
                            }));
                        };

                        socket.onmessage = (event) => {
                            if (event.data) {
                                if (event.data.includes('\x1b[H') && event.data.includes('\x1b[2J')) {
                                    terminal.clear();
                                }
                                terminal.write(event.data);
                            }
                        };

                        socket.onclose = () => {
                            if (terminals[terminalId]) {
                                console.warn(`Terminal "${terminalId}" desconectado, reconectando em 3s...`);
                                setTimeout(() => initWebSocket(terminal, options), 3000);
                            }
                        };

                        socket.onerror = (err) => {
                            console.error(`Erro no WebSocket do terminal "${terminalId}":`, err);
                        };
                    }

                    window.runCommand = (socket, command) => {
                        if (socket?.readyState === WebSocket.OPEN) {
                            try {
                                socket.send(JSON.stringify({
                                    command,
                                    token: socket.url.split('/').pop(),
                                    isCodex: true,
                                }));
                            } catch (e) {
                                console.error('Erro ao enviar comando:', e);
                            }
                        }
                    };

                    document.getElementById('new-terminal').addEventListener('click', async () => {
                        const sessions = getStoredTerminals();
                        const id = Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
                        const name = `Terminal ${sessions.length + 1}`;
                        const token = await waitForToken();
                        const session = { id, name, token };
                        sessions.push({ id, name });
                        setStoredTerminals(sessions);
                        createTerminalTab(session);
                        await apiSaveTerminal({ id, name });
                    });

                    // Legacy alias
                    window.createTabTerminal = async () => document.getElementById('new-terminal').click();

                    // ---- Page load: restore saved terminals ----
                    document.onreadystatechange = async function () {
                        if (document.readyState !== 'complete') return;

                        const dims = getXtermDimensions();
                        const editorEl = document.getElementById('editor');
                        const filesArchitecture = document.getElementById('filesArchitecture');
                        if (editorEl && dims?.editor?.height) editorEl.style.height = `${dims.editor.height}px`;
                        if (filesArchitecture && dims?.filesArchitecture?.height) filesArchitecture.style.height = `${dims.filesArchitecture.height}px`;

                        const token = await waitForToken();
                        const serverSessions = await apiGetTerminals();
                        if (Array.isArray(serverSessions) && serverSessions.length > 0) {
                            setStoredTerminals(serverSessions);
                            for (const session of serverSessions) {
                                createTerminalTab({ ...session, token });
                            }
                        }
                    };
                </script>

    function applyBackendKeywords(keywords) {

        keywords.forEach((k) => {

    // Ranking das sugestões: match exato > prefixo > contém.

    function completionRank(label, word, isKeyword) {
        const l = (label || "").toLowerCase();
        const w = (word || "").toLowerCase();
        const short = l.split("::").pop();
        const base = isKeyword ? "0" : "1";
        if (!w) return base + "5" + label;
        if (l === w || short === w) return base + "0" + label;
        if (l.startsWith(w) || short.startsWith(w)) return base + "1" + label;
        return base + "2" + label;
    }

            if (wl && !kwl.startsWith(wl) && !kwl.includes(wl)) {

            const snippet = phpKeywordSnippetsRuntime[kw];
            items.push({
                label: kw,
                kind: monaco.languages.CompletionItemKind.Keyword,
                insertText: snippet !== undefined ? snippet : kw,
                insertTextRules: snippet !== undefined

                detail: "PHP keyword",
                documentation: "Palavra-chave do PHP",
                range: range,
                filterText: kw,
                sortText: completionRank(kw, w, true),
            });
        });
