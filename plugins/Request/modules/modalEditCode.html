        function formatParameters(parameters) {
            return parameters.map((param, index) => {
                return param.type === "callable" ? "function(){}" : `$${"${" + (index + 1) + ":" + param.name + "}"}`;
            }).join(", ");
        }


        function createCompletionItem(item, insertText, kind) {
            const paramList = Array.isArray(item.parameters) ? item.parameters : [];
            const returnType = item.returnType || "mixed";

            const signature = `${item.name}(\n${paramList.map(param => {
                const type = param.type || 'mixed';
                const name = param.name || 'arg';
                return `    ${type} $${name}, \n`;
            }).join('')})`;

            const markdownDoc = {
                value:
                    '```php\n' +
                    `${item.static ? 'static ' : ''}function ${signature}\n` +
                    '```\n' +
                    (paramList.length > 0
                        ? '\n**Parameters:**\n' +
                        paramList
                            .map(param => `- \`$${param.name}: ${param.type || 'mixed'}\``)
                            .join('\n') +
                        '\n'
                        : '') +
                    `\n**Returns:** \`${returnType}\``
            };



            return {
                label: kind === "Class"
                    ? item.class
                    : `${item.class}::${item.name}`,
                kind: kind === "Class"
                    ? monaco.languages.CompletionItemKind.Class
                    : monaco.languages.CompletionItemKind.Method,
                insertText: insertText,
                insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                documentation: markdownDoc,
                detail: item.class,
                parameters: paramList,
            };
        }


        async function updateProviders() {
            await updateImports(editor.getModel());
            await updateMarkersImport();

            let provider = await fetch(
                "/codeGenerate?tokenBrowser=" + $("#fp").text(),
                {
                    method: "POST",
                    body: JSON.stringify({
                        search: "",
                        lastDid: "",
                        lineContent: "",
                        nameFile: "",
                    }),
                    headers: {
                        "Content-Type": "application/json",
                    },
                    mode: "cors",
                },
            )
                .then(async (response) => await response.text())
                .then((data) => JSON.parse(data).list);
            sug = [];
            functionSignatures = {};
            codeInfo = {};
            hints = [];
            if (!provider || !provider["functions"]) {
                provider = {
                    functions: [],
                    classes: [],
                    constants: [],
                };
            }

            // Keywords/snippets vindos do backend (stubs-generated.json).
            applyBackendKeywords(provider["keywords"]);

            for (let i = 0; i < provider["functions"].length; i++) {
                const item = provider["functions"][i];
                const paramList = Array.isArray(item.parameters) ? item.parameters : [];
                const returnType = item.returnType || "void";

                let insertText = item.name;
                let docParams = [];
                let snippetParams = [];

                if (paramList.length > 0) {
                    paramList.forEach((param, index) => {
                        if (param.type === "callable") {
                            snippetParams.push("function(){}");
                            docParams.push(`function`);
                        } else {
                            snippetParams.push('$${' + (index + 1) + `:${param.name}` + '}');
                            docParams.push(`$${param.name}`);
                        }
                    });
                }
                let argsInsert = snippetParams.join(", ");
                insertText = insertText + '(' + argsInsert + ')';
                const functionItem = {
                    label: item.name,
                    kind: monaco.languages.CompletionItemKind.Function,
                    insertText: insertText,
                    insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                    parameters: item.parameters,
                    return: returnType,
                    type: "function",
                    documentation: (docParams.length > 0 ? `Parameters: ${docParams.join(', ')}\n` : '') + `Return: ${returnType}`,
                    detail: item.name,
                };


                if (!sug.some(s => s.label === functionItem.label)) {
                    sug.push(functionItem);
                }
            }
            updateImports(editor.getModel());
            for (let x = 0; x < sug.length; x++) {
                const params = sug[x].parameters;
                functionSignatures[sug[x].label] = Array.isArray(params)
                    ? params.map((param, index) => param.name)
                    : [];
            }
            // filter empty signatures
            for (let [key, value] of Object.entries(functionSignatures)) {
                if (value.length === 0) {
                    delete functionSignatures[key];
                }
            }

            let classNamesSet = new Set();  // Usado para verificar duplicatas

            for (let i = 0; i < provider["classes"].length; i++) {
                let item = provider["classes"][i];
                let insertText = item["class"];

                if (item["name"] === "__construct") {
                    if (item["parameters"].length > 0) {
                        insertText += "(" + formatParameters(item.parameters) + ")";
                    } else {
                        insertText += "()";
                    }

                    if (!classNamesSet.has(insertText)) {
                        sug.push(createCompletionItem(item, insertText, "Class"));
                        classNamesSet.add(insertText);
                    }
                } else {

                    if (item['type'] !== 'property') {

                        insertText += "::" + item["name"];
                        if (item["parameters"].length > 0) {
                            insertText += "(" + formatParameters(item.parameters) + ")";
                        } else {
                            insertText += "()";
                        }


                        if (!classNamesSet.has(insertText)) {
                            sug.push(createCompletionItem(item, insertText, "Method"));
                            classNamesSet.add(insertText);
                        }
                    } else {


                        let propertyItem = {
                            label: item["class"] + "::" + item["name"],
                            kind: monaco.languages.CompletionItemKind.Property,
                            insertText: item["name"],
                            insertTextRules:
                            monaco.languages.CompletionItemInsertTextRule
                                .InsertAsSnippet,
                            documentation: '$' + item["name"] + ': ' + item['returnType'],

                            detail: item["class"],
                        };
                        if (!sug.some(s => s.label === propertyItem.label)) {
                            sug.push(propertyItem);
                        }

                    }
                }
            }


            for (let i = 0; i < provider["constants"].length; i++) {
                let item = provider["constants"][i];
                let constantItem = {
                    label: item["name"],
                    kind: monaco.languages.CompletionItemKind.Constant,
                    insertText: item["name"],
                    insertTextRules:
                    monaco.languages.CompletionItemInsertTextRule
                        .InsertAsSnippet,
                    documentation: "",
                    detail: item["name"],
                };
                let check = false;
                for (let x = 0; x < sug.length; x++) {
                    if (sug[x].label === constantItem.label) {
                        check = true;
                    }
                }
                if (!check) sug.push(constantItem);
            }


            for (let x = 0; x < sug.length; x++) {
                for (let [key, value] of Object.entries(importedClasses)) {
                    if (sug[x].label.split("\\").pop().includes(key)) {
                        try {
                            functionSignatures[sug[x].label.split("\\").pop()] =
                                sug[x].parameters.map(
                                    (param, index) => param.name,
                                );
                        } catch (e) {
                        }
                    }
                }

                if (importedClasses[sug[x].label.split("\\").pop()]) {
                    try {
                        functionSignatures[sug[x].label.split("\\").pop()] =
                            sug[x].parameters.map((param, index) => param.name);
                    } catch (e) {
                    }
                }
                try {
                    functionSignatures[sug[x].label] = sug[x].parameters.map(
                        (param, index) => param.name,
                    );
                } catch (e) {
                }
            }

            for (let [key, value] of Object.entries(functionSignatures)) {
                if (value.length === 0) {
                    delete functionSignatures[key];
                }
            }
            codeInfo = {};
            try {
                codeInfo = await fetch(
                    "/phpParser?tokenBrowser=" + $("#fp").text(),
                    {
                        method: "POST",
                        body: JSON.stringify({
                            search: "all",
                            lineContent: "",
                            nameFile: $("#hiddenFileEdit").text(),
                        }),
                    },
                ).then(async (response) => await response.json());
            } catch (e) {
                console.log(e);
                sug = [];
                functionSignatures = {};
                codeInfo = {};
                hints = [];
                return;
            }
            let classKeys = Object.keys(codeInfo);
            for (let i = 0; i < classKeys.length; i++) {
                let classKey = classKeys[i];
                let className = codeInfo[classKey]["class"];
                if (className === "") continue;
                let filter = sug.filter((item) => {
                    if (item.detail)
                        if (item.detail.includes(className)) return true;
                });
                if (filter.length > 0) {
                    filter.map((item) => {
                        functionSignatures[
                            `$${classKey}->${item.label.split("::").pop()}`
                            ] = Array.isArray(item.parameters)
                            ? item.parameters.map((param, index) => param.name)
                            : [];
                    });
                }
            }
        }

        function debounce(func, wait) {
            return function (...args) {
                clearTimeout(debounceTimeout);
                debounceTimeout = setTimeout(
                    () => func.apply(this, args),
                    wait,
                );
            };
        }

        function getHtmlElementFromLine(lineNumber) {
            const marginViewOverlays = document.querySelectorAll(
                ".monaco-editor .margin-view-overlays .line-numbers",
            );
            const viewLines = document.querySelectorAll(
                ".monaco-editor .view-lines .view-line",
            );
            for (let i = 0; i < marginViewOverlays.length; i++) {
                const lineNumberElement = marginViewOverlays[i];
                if (parseInt(lineNumberElement.textContent) === lineNumber) {
                    return viewLines[i];
                }
            }
            return null;
        }

        async function handleContentChange(e) {
            let model = editor.getModel();
            let currentText = model.getValue();
            let nameFile = $("#nameFileForEdit").text();
            let currentCursorPosition = editor.getPosition();
            positions[nameFile] = {lineNumber: currentCursorPosition.lineNumber, column: currentCursorPosition.column};


            let position = editor.getPosition();
            let word;
            try {
                word = editor
                    .getModel()
                    .getWordAtPosition(editor.getPosition()).word;
            } catch (e) {
                word = "";
            }
            let content = model.getValue();
            clearSuggestions();

            if (
                e.changes[0].rangeLength === 0 &&
                e.changes[0].text.length > 0
            ) {
                let textBeforeCursor = content.substring(
                    0,
                    model.getOffsetAt(position),
                );
                let textAfterCursor = content.substring(
                    model.getOffsetAt(position),
                );
                let stopChars = ['";', "';", ")", "]", "}"];
                let stopChar = "";
                for (let i = 0; i < stopChars.length; i++) {
                    if (textAfterCursor.startsWith(stopChars[i])) {
                        stopChar = stopChars[i];
                        break;
                    }
                }

                // Limita o textBeforeCursor a 100 caracteres

                // apenas as ultimas
                contextMain = {
                    namefile: nameFile,
                    textBeforeCursor: textBeforeCursor,
                    textAfterCursor: textAfterCursor,
                    stopChar: stopChar,
                };

                await showSuggestion(contextMain);
            }
        }


        const target = document.getElementById("namefilemodaledit");
        const observer = new MutationObserver(async function (mutations) {
            if (window.blockingMonitor) return; // Evita que o monitoramento seja acionado durante a abertura do modal
            for (const mutation of mutations) {
                if (
                    mutation.type === "childList" &&
                    mutation.addedNodes.length > 0
                ) {
                    let file = mutation.addedNodes[0].textContent;
                    let nameFile = "";
                    try {
                        nameFile =
                            document.getElementById(
                                "hiddenFileEdit",
                            ).textContent;
                    } catch (e) {
                        return;
                    }
                    $("#fullAddressFile").text(nameFile);
                    let language = nameFile.split(".").pop();
                    if (isCompressedExtension(language)) {
                        $("#edit-code").modal("hide");
                        return showCompressFile(
                            nameFile,
                            document.getElementById("hiddenFileEdit")
                                .textContent,
                        );
                    } else if (isImageExtension(language)) {
                        $("#edit-code").modal("hide");
                        return showImage(
                            document.getElementById("hiddenFileEdit")
                                .textContent,
                            false,
                        );
                    } else {
                        language = getLanguageByExtension(language);
                    }
                    let fileContent = (
                        await asyncGet(
                            `/getFile?tokenBrowser=${$("#fp").text()}&path=${encodeURIComponent(nameFile)}`,
                        )
                    );
                    try {
                        if (fileContent['encoded']) {
                            // Decode base64 com suporte a caracteres especiais
                            const binaryString = atob(fileContent["information"]);
                            const bytes = new Uint8Array(binaryString.length);
                            for (let i = 0; i < binaryString.length; i++) {
                                bytes[i] = binaryString.charCodeAt(i);
                            }
                            fileContent = new TextDecoder('utf-8').decode(bytes);
                        } else {
                            fileContent = fileContent["information"];
                        }
                    } catch (e) {
                        // Se falhar o decode, mostra o conteúdo original
                        fileContent = fileContent["information"];
                    }
                    if (!models[nameFile]) {
                        positions[nameFile] = {
                            lineNumber: 1,
                            column: 1,
                        }; // Inicializa a posição do cursor


                        models[nameFile] = monaco.editor.createModel(
                            fileContent,
                            language,
                        );
                        cleanModelVersions[nameFile] = models[nameFile].getAlternativeVersionId();

                        // Registra o documento no Language Server (autocomplete,
                        // hover/documentação, assinatura e diagnósticos de verdade).
                        try {
                            window.PhpLSP && window.PhpLSP.openModel(models[nameFile], nameFile);
                        } catch (e) { /* LSP indisponível: segue com fallback */ }


                        let newTab = document.createElement("div");
                        newTab.classList.add("tab-header-item", "mt-2");

                        // Determinar ícone por extensão
                        let ext = nameFile.split('.').pop().toLowerCase();
                        let iconClass = "fa-code";
                        let colorClass = "default";
                        let isBrand = false;
                        
                        if (ext === 'php') { iconClass = "fa-php"; colorClass = "php"; isBrand = true; }
                        else if (ext === 'html') { iconClass = "fa-html5"; colorClass = "html"; isBrand = true; }
                        else if (ext === 'css') { iconClass = "fa-css3-alt"; colorClass = "css"; isBrand = true; }
                        else if (ext === 'js') { iconClass = "fa-js"; colorClass = "js"; isBrand = true; }
                        else if (ext === 'json') { iconClass = "fa-brackets-curly"; colorClass = "json"; }
                        else if (ext === 'md') { iconClass = "fa-markdown"; colorClass = "md"; isBrand = true; }

                        let iconEl = document.createElement("i");
                        iconEl.className = `${isBrand ? 'fa-brands' : 'fa-duotone'} ${iconClass} tab-icon ${colorClass}`;

                        newTab.appendChild(iconEl);

                        let fileNameSpan = document.createElement("span");
                        fileNameSpan.innerText = getFilename(nameFile);
                        newTab.appendChild(fileNameSpan);

// cria botão de fechar
                        let closeBtn = document.createElement("span");
                        //closeBtn.classList.add("close-tab");
                        closeBtn.innerHTML = "&times;";

                        closeBtn.onclick = function (e) {
                            e.stopPropagation(); // impede o clique de ativar a aba
                            newTab.remove(); // remove a aba
                            // Aqui você pode adicionar lógica para fechar o conteúdo relacionado, se quiser
                            if (models[nameFile]) {
                                models[nameFile].dispose(); // libera o modelo do editor
                                delete models[nameFile]; // remove o modelo do cache
                                delete cleanModelVersions[nameFile];
                            }
                            if (tabsCache[nameFile]) {
                                delete tabsCache[nameFile]; // remove a aba do cache
                            }
                            if (positions[nameFile]) {
                                delete positions[nameFile]; // remove a posição do cursor do cache
                            }
                        };

                        newTab.appendChild(closeBtn);

// ação ao clicar na aba
                        newTab.onclick = function () {
                            $('#nameFileForEdit').text(nameFile);
                            $('#hiddenFileEdit').text(nameFile);
                            $('#namefilemodaledit').text(nameFile);

                            let tabs = document.getElementsByClassName("tab-header-item");
                            for (let i = 0; i < tabs.length; i++) {
                                tabs[i].classList.remove("active");
                            }
                            newTab.classList.add("active");
                            $('#searchFiles').text(nameFile);
                            
                            // Atualizar título do modal com o nome do arquivo atual (estilo PhpStorm)
                            document.querySelector('.modal-title').innerHTML = `Editor - <span style="color: #A1A8B3">${getFilename(nameFile)}</span>`;

                            if (positions[nameFile]) {
                                editor.setPosition(positions[nameFile]);
                                editor.revealPosition(positions[nameFile]);
                            } else {
                                editor.setPosition({lineNumber: 1, column: 1});
                            }
                        };

                        document.getElementById('tabsFilesEditor').appendChild(newTab);

                        let tabs = document.getElementsByClassName("tab-header-item");
                        for (let i = 0; i < tabs.length; i++) {
                            tabs[i].classList.remove("active");
                        }

                        tabsForFiles.before(newTab);
                        tabsCache[nameFile] = newTab;
                        window.blockingMonitor = true;
                        newTab.click(); // Selecionar a nova aba automaticamente
                        // O click acima reescreve #namefilemodaledit, o que gera
                        // uma nova mutação. O callback do MutationObserver roda
                        // como microtask; se resetássemos o guard de forma
                        // SÍNCRONA aqui, ele já estaria "false" quando essa
                        // mutação redundante fosse processada, e o observer
                        // buscaria /getFile de novo (arquivo carregado 2x ao
                        // abrir). Adiamos o reset para uma microtask posterior à
                        // do observer, mantendo o guard ativo durante o click.
                        Promise.resolve().then(() => {
                            window.blockingMonitor = false;
                        });
                        // posicionar o cursor na posição salva
                        if (positions[nameFile]) {
                            editor.setPosition(positions[nameFile]);
                            editor.revealPosition(positions[nameFile]);
                        } else {
                            editor.setPosition({lineNumber: 1, column: 1});
                        }

                    }


                    //else models[nameFile].setValue(fileContent);
                    editor.setModel(models[nameFile]);
                    try {
                        window.PhpLSP && window.PhpLSP.openModel(models[nameFile], nameFile);
                    } catch (e) { /* noop */ }
                    editor.focus();
                    if (positions[nameFile]) {
                        editor.setPosition(positions[nameFile]);
                        editor.revealPosition(positions[nameFile]);
                    } else {
                        editor.setPosition({lineNumber: 1, column: 1});
                    }

                    // tabsCache[nameFile].click();

                    refreshLegacyProviders();


                    /** <div class="tab-header-item active">
                     utilsFunction.php
                     <span class="close-tab" onclick="closeTab(this)">×</span>
                     </div>
                     <div class="tab-header-item">
                     modalEditCode.html
                     <span class="close-tab" onclick="closeTab(this)">×</span>
                     </div>*/


                }
            }
        });

        window.FileManagerEditorBridge = {
            async openFileAt(filePath, line = 1, column = 1) {
                const normalizedPath = String(filePath || '').replaceAll('\\', '/').trim();
                if (!normalizedPath || normalizedPath.includes('\0')) {
                    throw new Error('Caminho de arquivo inválido.');
                }

                const requestedLine = Math.max(1, Number.parseInt(line, 10) || 1);
                const requestedColumn = Math.max(1, Number.parseInt(column, 10) || 1);
                const activateModel = () => {
                    const model = models[normalizedPath];
                    if (!model || model.isDisposed() || !editor) return false;
                    const lineNumber = Math.min(requestedLine, model.getLineCount());
                    const columnNumber = Math.min(requestedColumn, model.getLineMaxColumn(lineNumber));
                    const position = {lineNumber, column: columnNumber};

                    if (tabsCache[normalizedPath]) tabsCache[normalizedPath].click();
                    editor.setModel(model);
                    positions[normalizedPath] = position;
                    const focusPosition = () => {
                        if (editor.getModel() !== model) return;
                        editor.layout();
                        editor.setPosition(position);
                        editor.revealPositionInCenter(position);
                        editor.focus();
                    };
                    focusPosition();
                    window.setTimeout(focusPosition, 250);
                    return true;
                };

                $('#edit-code').modal('show');
                if (activateModel()) return {path: normalizedPath, line: requestedLine, column: requestedColumn};

                $('#nameFileForEdit').text(getFilename(normalizedPath));
                $('#hiddenFileEdit').text(normalizedPath);
                window.blockingMonitor = false;
                const trigger = document.getElementById('namefilemodaledit');
                trigger.textContent = '';
                trigger.textContent = normalizedPath;

                await new Promise((resolve, reject) => {
                    const startedAt = Date.now();
                    const timer = window.setInterval(() => {
                        if (activateModel()) {
                            window.clearInterval(timer);
                            resolve();
                        } else if (Date.now() - startedAt >= 15000) {
                            window.clearInterval(timer);
                            reject(new Error('O editor não conseguiu carregar o arquivo a tempo.'));
                        }
                    }, 50);
                });
                return {path: normalizedPath, line: requestedLine, column: requestedColumn};
            },
            async refreshChangedFiles(paths) {
                const normalizedPaths = [...new Set((Array.isArray(paths) ? paths : [])
                    .filter((entry) => typeof entry === 'string')
                    .map((entry) => '/' + entry.replaceAll('\\', '/').replace(/^\/+/, ''))
                    .map((entry) => entry.replace(/\/{2,}/g, '/')))];
                const conflicts = [];
                const refreshed = [];

                for (const changedPath of normalizedPaths) {
                    const modelPath = Object.keys(models).find((entry) => {
                        const normalized = '/' + entry.replaceAll('\\', '/').replace(/^\/+/, '');
                        return normalized.replace(/\/{2,}/g, '/') === changedPath;
                    });
                    if (!modelPath || !models[modelPath] || models[modelPath].isDisposed()) {
                        continue;
                    }

                    const model = models[modelPath];
                    const cleanVersion = cleanModelVersions[modelPath];
                    if (cleanVersion !== undefined && model.getAlternativeVersionId() !== cleanVersion) {
                        conflicts.push(changedPath);
                        continue;
                    }

                    try {
                        let response = await asyncGet(
                            `/getFile?tokenBrowser=${encodeURIComponent($("#fp").text())}&path=${encodeURIComponent(modelPath)}`,
                        );
                        let contents;
                        if (response && response.encoded) {
                            const binary = atob(response.information);
                            const bytes = new Uint8Array(binary.length);
                            for (let index = 0; index < binary.length; index++) {
                                bytes[index] = binary.charCodeAt(index);
                            }
                            contents = new TextDecoder('utf-8').decode(bytes);
                        } else {
                            contents = response?.information;
                        }
                        if (typeof contents !== 'string') {
                            continue;
                        }
                        model.setValue(contents);
                        cleanModelVersions[modelPath] = model.getAlternativeVersionId();
                        refreshed.push(changedPath);
                        try {
                            window.PhpLSP && window.PhpLSP.openModel(model, modelPath);
                        } catch (e) { /* LSP indisponível: o editor continua funcional. */ }
                    } catch (error) {
                        console.warn(`Não foi possível recarregar ${changedPath}:`, error);
                    }
                }

                return {conflicts, refreshed};
            },
        };

        const config = {attributes: false, childList: true, subtree: false};
        observer.observe(target, config);
    });
</script>
