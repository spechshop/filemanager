            ],
            surroundingPairs: [
                {open: "{", close: "}"},
                {open: "[", close: "]"},
                {open: "(", close: ")"},
                {open: '"', close: '"'},
                {open: "'", close: "'"},
                {open: "`", close: "`"},
            ],
            folding: {
                offSide: true,
                markers: {
                    start: new RegExp("^\\s*//\\s*#?region\\b"),
                    end: new RegExp("^\\s*//\\s*#?endregion\\b"),
                },
            },
        });

        // ============================================================
        // Cliente LSP (Language Server Protocol) para PHP.
        //
        // Conversa com o Intelephense através do proxy seguro do servidor
        // (wss://host/<token>-lsp -> plugins\server::message -> lsp.js:3057).
        // É a fonte "de verdade" de inteligência do editor — autocomplete,
        // documentação (hover), assinatura de parâmetros (signature help),
        // ir-para-definição e diagnósticos — substituindo o antigo
        // stubs-generated.json. Se o LSP estiver indisponível, o editor cai
        // de volta no comportamento anterior automaticamente.
        // ============================================================
        window.PhpLSP = (function () {
            const KIND = monaco.languages.CompletionItemKind;
            const kindMap = {
                1: KIND.Text, 2: KIND.Method, 3: KIND.Function, 4: KIND.Constructor,
                5: KIND.Field, 6: KIND.Variable, 7: KIND.Class, 8: KIND.Interface,
                9: KIND.Module, 10: KIND.Property, 11: KIND.Unit, 12: KIND.Value,
                13: KIND.Enum, 14: KIND.Keyword, 15: KIND.Snippet, 16: KIND.Color,
                17: KIND.File, 18: KIND.Reference, 19: KIND.Folder, 20: KIND.EnumMember,
                21: KIND.Constant, 22: KIND.Struct, 23: KIND.Event, 24: KIND.Operator,
                25: KIND.TypeParameter,
            };
            const sevMap = {
                1: monaco.MarkerSeverity.Error,
                2: monaco.MarkerSeverity.Warning,
                3: monaco.MarkerSeverity.Info,
                4: monaco.MarkerSeverity.Hint,
            };

            let socket = null;
            let ready = false;
            let wsToken = null;
            let msgId = 0;
            const pending = new Map();
            const openDocs = new Map();     // uri -> { version, model }
            const modelUri = new WeakMap(); // model -> uri
            let reconnectTimer = null;
            // Coalescência de requisições de completion idênticas em voo.
            // O Monaco pode chamar provideCompletionItems duas vezes para o
            // mesmo evento (o caractere de gatilho ">" dispara o suggest e a
            // mudança de conteúdo dispara os quickSuggestions), fazendo o
            // cliente enviar DOIS "textDocument/completion" idênticos pelo
            // websocket. Reaproveitamos a promessa em voo (mesma uri+posição)
            // para que o comando seja enviado só uma vez.
            const completionInFlight = new Map(); // "uri:line:char" -> Promise

            function isReady() { return ready; }

            function rawSend(obj) {
                if (!socket || socket.readyState !== WebSocket.OPEN) return;
                socket.send(JSON.stringify({
                    token: wsToken,
                    lsp: true,
                    payload: JSON.stringify(obj),
                }));
            }

            function request(method, params, timeoutMs) {
                const id = ++msgId;
                rawSend({ jsonrpc: "2.0", id, method, params });
                return new Promise((resolve) => {
                    const t = setTimeout(() => {
                        pending.delete(id);
                        resolve(null);
                    }, timeoutMs || 8000);
                    pending.set(id, (res) => { clearTimeout(t); resolve(res); });
                });
            }

            function notify(method, params) {
                rawSend({ jsonrpc: "2.0", method, params });
            }

            function docToMonaco(doc) {
                if (!doc) return undefined;
                // Mesma deduplicação usada no hover: o Intelephense concatena
                // (separadas por "---") todas as definições encontradas para um
                // símbolo. Se a classe/método existe em mais de um lugar
                // indexado (ex.: trunkController do subprojeto em files/), a
                // documentação do completion vinha com a descrição repetida
                // ("duas caixinhas"). Colapsamos para uma só, como no PhpStorm.
                if (typeof doc === "string") return { value: dedupeHoverMarkdown(doc) };
                return { value: dedupeHoverMarkdown(doc.value || "") };
            }

            function lspRangeToMonaco(r) {
                return new monaco.Range(
                    r.start.line + 1, r.start.character + 1,
                    r.end.line + 1, r.end.character + 1,
                );
            }

            // Remove seções duplicadas de um hover em markdown. O Intelephense
            // concatena, num único conteúdo separado por "---", todas as
            // definições encontradas para um símbolo. Quando o mesmo símbolo
            // existe em mais de um stub (ex.: "Co\run" em swoole/ide-helper,
            // presente em alias_ns.php e no core), aparecem duas "caixinhas"
            // idênticas. Colapsamos por cabeçalho do símbolo (case-insensitive),
            // mantendo apenas a primeira ocorrência — como no PhpStorm.
            function dedupeHoverMarkdown(value) {
                if (typeof value !== "string" || !/\n-{3,}\n/.test(value)) {
                    return value;
                }
                const sections = value.split(/\n-{3,}\n/);
                const seen = new Set();
                const kept = [];
                for (const section of sections) {
                    const header = section.match(/__(.+?)__/);
                    const key = (header ? header[1] : section).trim().toLowerCase();
                    if (seen.has(key)) continue;
                    seen.add(key);
                    kept.push(section.trim());
                }
                return kept.join("\n\n---\n\n");
            }

            function normalizeHoverContents(contents) {
                if (!contents) return [];
                if (typeof contents === "string") return [{ value: dedupeHoverMarkdown(contents) }];
                if (Array.isArray(contents)) {
                    return contents.map((c) =>
                        typeof c === "string"
                            ? { value: dedupeHoverMarkdown(c) }
                            : { value: dedupeHoverMarkdown(c.value || "") });
                }
                return [{ value: dedupeHoverMarkdown(contents.value || "") }];
            }

            function lspToMonacoCompletion(item, defaultRange) {
                let range = defaultRange;
                let insertText = item.insertText || item.label;
                if (item.textEdit) {
                    const te = item.textEdit;
                    const teRange = te.range || (te.replace || te.insert);
                    if (teRange) range = lspRangeToMonaco(teRange);
                    insertText = te.newText;
                }
                // ATENÇÃO: no Monaco, CompletionItemKind.Method === 0 (valor
                // "falsy"). Usar "kindMap[item.kind] || KIND.Text" convertia
                // TODO método (kind LSP 2 -> Monaco 0) em Text, pois "0 || X"
                // resulta em X. Como o editor esconde itens do tipo Text
                // ("suggest.showWords: false"), os métodos sumiam e só as
                // PROPRIEDADES apareciam. Mapeamos preservando o 0.
                const mappedKind = kindMap[item.kind];
                const result = {
                    label: item.label,
                    kind: mappedKind === undefined ? KIND.Text : mappedKind,
                    insertText: insertText,
                    range: range,
                    detail: item.detail,
                    documentation: docToMonaco(item.documentation),
                    sortText: item.sortText,
                    filterText: item.filterText || item.label,
                    preselect: !!item.preselect,
                    commitCharacters: item.commitCharacters,
                    __lspData: item.data !== undefined ? item : null,
                };
                if (item.insertTextFormat === 2) {
                    result.insertTextRules =
                        monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet;
                }
                if (Array.isArray(item.additionalTextEdits)) {
                    result.additionalTextEdits = item.additionalTextEdits.map((e) => ({
                        range: lspRangeToMonaco(e.range),
                        text: e.newText,
                    }));
                }
                return result;
            }

            function handleDiagnostics(params) {
                const doc = openDocs.get(params.uri);
                if (!doc || !doc.model || doc.model.isDisposed()) return;
                const markers = (params.diagnostics || []).map((d) => ({
                    startLineNumber: d.range.start.line + 1,
                    startColumn: d.range.start.character + 1,
                    endLineNumber: d.range.end.line + 1,
                    endColumn: d.range.end.character + 1,
                    message: d.message,
                    severity: sevMap[d.severity] || monaco.MarkerSeverity.Info,
                    source: d.source || "intelephense",
                }));
                monaco.editor.setModelMarkers(doc.model, "php-lsp", markers);
            }

            function handleServerMethod(msg) {
                const respond = (result) => {
                    if (msg.id !== undefined && msg.id !== null) {
                        rawSend({ jsonrpc: "2.0", id: msg.id, result });
                    }
                };
                switch (msg.method) {
                    case "textDocument/publishDiagnostics":
                        handleDiagnostics(msg.params);
                        break;
                    case "workspace/configuration": {
                        const items = (msg.params && msg.params.items) || [];
                        respond(items.map((item) => {
                            if (item && item.section === "intelephense") {
                                return {
                                    completion: {
                                        maxItems: 3000,
                                        insertUseDeclaration: true,
                                        fullyQualifyGlobalConstantsAndFunctions: false,
                                        triggerParameterHints: true,
                                        snippets: true
                                    },
                                    format: {
                                        enable: true
                                    },
                                    files: {
                                        maxSize: 5000000
                                    }
                                };
                            }
                            return {};
                        }));
                        break;
                    }
                    case "client/registerCapability":
                    case "client/unregisterCapability":
                    case "window/workDoneProgress/create":
                        respond(null);
                        break;
                    case "window/logMessage":
                    case "window/showMessage":
                    case "$/progress":
                    case "telemetry/event":
                        break;
                    default:
                        if (msg.id !== undefined && msg.id !== null) respond(null);
                        break;
                }
            }

            function onFrame(data) {
                let frame;
                try { frame = JSON.parse(data); } catch (e) { return; }
                if (!frame || !frame.lsp) return; // ignora stats/broadcast
                let msg;
                try { msg = JSON.parse(frame.payload); } catch (e) { return; }
                // Roteamento JSON-RPC correto: uma mensagem é REQUISIÇÃO/
                // NOTIFICAÇÃO do servidor quando tem "method"; é RESPOSTA a uma
                // requisição nossa quando NÃO tem "method" (só id + result/error).
                //
                // Antes checávamos "pending.has(msg.id)" PRIMEIRO. Como os ids de
                // requisição do servidor (ex.: "workspace/configuration") vivem
                // num espaço INDEPENDENTE dos nossos, eles colidem com ids de
                // requisições nossas ainda pendentes (ex.: um "completion" em
                // voo). Nesse caso a requisição do servidor era confundida com a
                // RESPOSTA da nossa e DESCARTADA — o servidor nunca recebia a
                // configuração (intelephense.completion.maxItems) e ficava preso
                // no default (100 itens), que devolve só PROPRIEDADES e nenhum
                // MÉTODO. Tratando "method" primeiro, a config sempre é
                // respondida e os métodos voltam a ser sugeridos.
                if (msg.method) { handleServerMethod(msg); return; }
                if (msg.id !== undefined && msg.id !== null && pending.has(msg.id)) {
                    const cb = pending.get(msg.id);
                    pending.delete(msg.id);
                    cb(msg.result);
                    return;
                }
            }

            function sendDidOpen(model, uri) {
                if (!model || model.isDisposed()) return;
                let entry = openDocs.get(uri) || { version: 1, model };
                entry.model = model;
                openDocs.set(uri, entry);
                modelUri.set(model, uri);
                notify("textDocument/didOpen", {
                    textDocument: {
                        uri, languageId: "php", version: entry.version,
                        text: model.getValue(),
                    },
                });
                if (!model.__lspBound) {
                    model.__lspBound = true;
                    model.onDidChangeContent(() => {
                        const d = openDocs.get(uri);
                        if (!d) return;
                        d.version++;
                        notify("textDocument/didChange", {
                            textDocument: { uri, version: d.version },
                            contentChanges: [{ text: model.getValue() }],
                        });
                    });
                }
            }

            function ownsModel(model) {
                // Verdadeiro só quando o LSP está pronto E este modelo já foi
                // rastreado (didOpen enviado). Usado pelo provider legado para
                // decidir se cede o autocomplete ao LSP ou entra como fallback.
                return ready && !!model && modelUri.has(model);
            }

            function openModel(model, nameFile) {
                if (!model || model.isDisposed()) return;
                // O nome vem de textContent de um elemento e pode carregar
                // espaços/quebra de linha nas pontas. Sem o trim, "arquivo.php\n"
                // falha em /\.php$/i (o "$" não casa antes do "\n" sem flag "m"),
                // o modelo NUNCA é registrado no LSP e o autocomplete de membros
                // ($obj->) fica sem nenhuma sugestão. Normalizamos aqui.
                const name = (nameFile || "").trim();
                if (name && !/\.php$/i.test(name)) return; // só PHP
                const uri = monaco.Uri.file(name || ("untitled-" + Date.now() + ".php")).toString();
                if (!ready) {
                    // guarda para (re)abrir quando o LSP ficar pronto
                    const entry = openDocs.get(uri) || { version: 1, model };
                    entry.model = model;
                    openDocs.set(uri, entry);
                    modelUri.set(model, uri);
                    return;
                }
                if (modelUri.get(model) === uri && openDocs.has(uri) && openDocs.get(uri).__opened) {
                    return;
                }
                sendDidOpen(model, uri);
                openDocs.get(uri).__opened = true;
            }

            async function doInitialize() {
                const res = await request("initialize", {
                    processId: null,
                    rootUri: null,
                    capabilities: {
                        textDocument: {
                            synchronization: { didSave: false, dynamicRegistration: false },
                            completion: {
                                dynamicRegistration: false,
                                contextSupport: true,
                                completionItem: {
                                    snippetSupport: true,
                                    documentationFormat: ["markdown", "plaintext"],
                                    resolveSupport: { properties: ["documentation", "detail", "additionalTextEdits"] },
                                },
                            },
                            hover: { contentFormat: ["markdown", "plaintext"] },
                            signatureHelp: {
                                signatureInformation: {
                                    documentationFormat: ["markdown", "plaintext"],
                                    parameterInformation: { labelOffsetSupport: true },
                                },
                            },
                            definition: { dynamicRegistration: false },
                            publishDiagnostics: { relatedInformation: false },
                        },
                        workspace: { configuration: true, workspaceFolders: false },
                    },
                    initializationOptions: {
                        storagePath: "/tmp/intelephense",
                        globalStoragePath: "/tmp/intelephense",
                        clearCache: false,
                    },
                }, 20000);
                if (!res) return; // timeout: mantém fallback
                notify("initialized", {});
                ready = true;
                // (re)abre tudo que já estava rastreado
                openDocs.forEach((entry, uri) => {
                    entry.__opened = true;
                    sendDidOpen(entry.model, uri);
                });
                // garante o modelo ativo aberto
                try {
                    const active = editor.getModel();
                    const name = $("#hiddenFileEdit").text() || $("#fullAddressFile").text();
                    if (active && name) openModel(active, name);
                } catch (e) { /* noop */ }
            }

            function scheduleReconnect() {
                if (reconnectTimer) return;
                reconnectTimer = setTimeout(() => {
                    reconnectTimer = null;
                    connect();
                }, 3000);
            }

            function connect() {
                const token = $("#fp").text();
                if (!token) { setTimeout(connect, 800); return; }
                wsToken = token + "-lsp";
                const proto = window.location.protocol === "https:" ? "wss" : "ws";
                const hostname = window.location.port
                    ? `${window.location.hostname}:${window.location.port}`
                    : window.location.hostname;
                try {
                    socket = new WebSocket(`${proto}://${hostname}/${wsToken}`);
                } catch (e) { scheduleReconnect(); return; }
                socket.onopen = () => { doInitialize(); };
                socket.onmessage = (ev) => { onFrame(ev.data); };
                socket.onclose = () => {
                    ready = false;
                    // marca docs como não-abertos para reabrir na reconexão
                    openDocs.forEach((e) => { e.__opened = false; });
                    scheduleReconnect();
                };
                socket.onerror = () => { try { socket.close(); } catch (e) {} };
            }

            // ---- Providers Monaco alimentados pelo LSP -----------------
            monaco.languages.registerCompletionItemProvider("php", {
                triggerCharacters: ["$", ">", ":", "\\", "(", ",", '"', "'", ".", "<"],
                provideCompletionItems: async function (model, position) {
                    if (!ready) return { suggestions: [] };
                    let uri = modelUri.get(model);
                    if (!uri) {
                        // Registro tardio: se por algum motivo o modelo ativo
                        // ainda não foi rastreado (ex.: abriu antes do LSP ficar
                        // pronto, ou o nome do arquivo veio com espaços/quebra),
                        // registramos agora usando o caminho do arquivo em edição.
                        // Assim o autocomplete de membros ($obj->) volta a
                        // funcionar em vez de não sugerir nada.
                        try {
                            const name = ($("#hiddenFileEdit").text() ||
                                $("#fullAddressFile").text() || "").trim();
                            if (name) {
                                openModel(model, name);
                                uri = modelUri.get(model);
                            }
                        } catch (e) { /* noop */ }
                    }
                    if (!uri) return { suggestions: [] };
                    // Coalesce chamadas idênticas em voo: se o Monaco disparar
                    // provideCompletionItems duas vezes para o mesmo evento
                    // (ex.: ao digitar ">"), reaproveitamos a mesma requisição
                    // em vez de mandar o comando duplicado pelo websocket.
                    const inFlightKey = uri + ":" + (position.lineNumber - 1) + ":" + (position.column - 1);
                    let resPromise = completionInFlight.get(inFlightKey);
                    if (!resPromise) {
                        resPromise = request("textDocument/completion", {
                            textDocument: { uri },
                            position: { line: position.lineNumber - 1, character: position.column - 1 },
                        });
                        completionInFlight.set(inFlightKey, resPromise);
                        resPromise.finally(() => completionInFlight.delete(inFlightKey));
                    }
                    const res = await resPromise;
                    if (!res) return { suggestions: [] };
                    const items = Array.isArray(res) ? res : (res.items || []);
                    const word = model.getWordUntilPosition(position);
                    const range = new monaco.Range(
                        position.lineNumber, word.startColumn,
                        position.lineNumber, word.endColumn,
                    );
                    return {
                        suggestions: items.map((it) => lspToMonacoCompletion(it, range)),
                        incomplete: !!(res && res.isIncomplete),
                    };
                },
                resolveCompletionItem: async function (item) {
                    if (!ready || !item.__lspData) return item;
                    const resolved = await request("completionItem/resolve", item.__lspData, 4000);
                    if (resolved) {
                        if (resolved.documentation) item.documentation = docToMonaco(resolved.documentation);
                        if (resolved.detail) item.detail = resolved.detail;
                        if (Array.isArray(resolved.additionalTextEdits)) {
                            item.additionalTextEdits = resolved.additionalTextEdits.map((e) => ({
                                range: lspRangeToMonaco(e.range),
                                text: e.newText,
                            }));
                        }
                    }
                    return item;
                },
            });

            monaco.languages.registerHoverProvider("php", {
                provideHover: async function (model, position) {
                    if (!ready) return null;
                    const uri = modelUri.get(model);
                    if (!uri) return null;
                    const res = await request("textDocument/hover", {
                        textDocument: { uri },
                        position: { line: position.lineNumber - 1, character: position.column - 1 },
                    });
                    if (!res || !res.contents) return null;
                    return {
                        range: res.range ? lspRangeToMonaco(res.range) : undefined,
                        contents: normalizeHoverContents(res.contents),
                    };
                },
            });

            monaco.languages.registerSignatureHelpProvider("php", {
                signatureHelpTriggerCharacters: ["(", ","],
                signatureHelpRetriggerCharacters: [","],
                provideSignatureHelp: async function (model, position) {
                    if (!ready) return null;
                    const uri = modelUri.get(model);
                    if (!uri) return null;
                    const res = await request("textDocument/signatureHelp", {
                        textDocument: { uri },
                        position: { line: position.lineNumber - 1, character: position.column - 1 },
                    });
                    if (!res || !res.signatures || !res.signatures.length) return null;
                    return {
                        value: {
                            signatures: res.signatures.map((s) => ({
                                label: s.label,
                                documentation: s.documentation ? docToMonaco(s.documentation) : undefined,
                                parameters: (s.parameters || []).map((p) => ({
                                    label: p.label,
                                    documentation: p.documentation ? docToMonaco(p.documentation) : undefined,
                                })),
                            })),
                            activeSignature: res.activeSignature || 0,
                            activeParameter: res.activeParameter || 0,
                        },
                        dispose: function () {},
                    };
                },
            });

            monaco.languages.registerDefinitionProvider("php", {
                provideDefinition: async function (model, position) {
                    if (!ready) return null;
                    const uri = modelUri.get(model);
                    if (!uri) return null;
                    const res = await request("textDocument/definition", {
                        textDocument: { uri },
                        position: { line: position.lineNumber - 1, character: position.column - 1 },
                    });
                    if (!res) return null;
                    const arr = Array.isArray(res) ? res : [res];
                    return arr
                        .filter((loc) => loc && loc.uri === uri)
                        .map((loc) => ({
                            uri: monaco.Uri.parse(loc.uri),
                            range: lspRangeToMonaco(loc.range),
                        }));
                },
            });

            connect();

            return { isReady, openModel, ownsModel };
        })();

        registerInlayHints().then(async () => {
            await updateImports(editor.getModel());
            await registerCodeActions();
            await registerCompletionProvider();
            await updateProviders();
            inlayHintsProvider.dispose();
            await registerInlayHints();
        });


        async function registerInlayHints() {
            inlayHintsProvider = await monaco.languages.registerInlayHintsProvider(language, {
                async provideInlayHints(model, range) {
                    let hints = [];
                    const code = editor.getValue();

                    // Otimização: em vez de varrer o arquivo inteiro para CADA
                    // assinatura conhecida (1200+ do catálogo) a cada render —
                    // o que bloqueava a main thread e congelava a barra de
                    // progresso do toast — processamos apenas as assinaturas
                    // cujo nome realmente aparece no código atual. Assim as
                    // dicas de parâmetro (inlay hints) voltam a funcionar de
                    // forma leve, tanto com o Language Server quanto no
                    // fallback baseado em stubs.
                    const relevantSignatures = Object.entries(functionSignatures).filter(
                        ([functionName]) => code.includes(functionName.replaceAll("$", "")),
                    );

                    for (let [functionName, args] of relevantSignatures) {
                        const regex = new RegExp(
                                `\\b${functionName.replaceAll("\\", "\\\\").replaceAll("$", "")}\\((.*?)\\)`,
                            "gs"
                        );
                        let match;
                        while ((match = regex.exec(code)) !== null) {
                            let functionArgs = match[1]
                                .split(",")
                                .map((arg) => arg.trim());
                            let startIndex = match.index + match[0].indexOf("(") + 1;

                            functionArgs.forEach((arg, i) => {
                                if (i < args.length) {
                                    let argStartIndex = code.indexOf(arg, startIndex);
                                    let argPosition = model.getPositionAt(argStartIndex);

                                    // Verifica se o argumento está dentro do range visível
                                    if (
                                        argPosition.lineNumber >= range.startLineNumber &&
                                        argPosition.lineNumber <= range.endLineNumber
                                    ) {
                                        if (
                                            !hints.some(
                                                (hint) =>
                                                    hint.position.lineNumber === argPosition.lineNumber &&
                                                    hint.position.column === argPosition.column
                                            )
                                        ) {
                                            hints.push({
                                                label: `${args[i]}: `,
                                                position: argPosition,
                                            });
                                        }
                                    }

                                    startIndex = argStartIndex + arg.length;
                                } else {
                                    let argStartIndex = code.indexOf(arg, startIndex);
                                    let argPosition = model.getPositionAt(argStartIndex);

                                    // Remove dicas que não estão no range visível
                                    hints = hints.filter(
                                        (hint) =>
                                            !(
                                                hint.position.lineNumber === argPosition.lineNumber &&
                                                hint.position.column === argPosition.column
                                            )
                                    );
                                }
                            });
                        }
                    }

                    // Filtra duplicações
                    hints = hints
                        .filter(
                            (hint, index, self) =>
                                index ===
                                self.findIndex(
                                    (t) =>
                                        t.position.lineNumber === hint.position.lineNumber &&
                                        t.position.column === hint.position.column
                                )
                        )
                        // Filtra linhas que começam com comentário "//"
                        .filter(
                            (hint) =>
                                !model
                                    .getLineContent(hint.position.lineNumber)
                                    .trim()
                                    .startsWith("//")
                        );

                    return {
                        dispose: () => {
                        },
                        hints,
                    };
                },
            });
        }


        window.registerCodeActions = async () => {
            codeActionsProvider = monaco.languages.registerCodeActionProvider(
                language,
                {
                    provideCodeActions: (model, range, context, token) => {
                        const code = model.getValue();
                        const regex =
                            /(?<!\w)(\\[a-zA-Z_][a-zA-Z0-9_]*(?:\\[a-zA-Z_][a-zA-Z0-9_]*)*)(?=::|\(|\s|$)/g;
                        let match;
                        const codeActions = [];

                        while ((match = regex.exec(code)) !== null) {
                            const importLine = match[0];
                            const startIndex = match.index;
                            const endIndex = startIndex + importLine.length;

                            const startPosition = model.getPositionAt(startIndex);
                            const endPosition = model.getPositionAt(endIndex);

                            // Verifica se a posição do cursor está sobre a expressão detectada
                            if (
                                range.startLineNumber === startPosition.lineNumber &&
                                range.startColumn >= startPosition.column &&
                                range.endColumn <= endPosition.column
                            ) {
                                // Encontra a posição ideal para inserção (após <?php, namespace ou último use)
                                const afterHeaderRegex = /(?:<\?php\s*|namespace\s+.*?;|use\s+.*?;)/g;
                                let topMatchIndex = 0;
                                let m;
                                while ((m = afterHeaderRegex.exec(code)) !== null) {
                                    topMatchIndex = m.index + m[0].length;
                                }

                                const posTop = model.getPositionAt(topMatchIndex);
                                const rangeTop = new monaco.Range(posTop.lineNumber, posTop.column, posTop.lineNumber, posTop.column);

                                const matchRange = new monaco.Range(
                                    startPosition.lineNumber,
                                    startPosition.column,
                                    endPosition.lineNumber,
                                    endPosition.column
                                );

                                const className = importLine.split("\\").pop();
                                const fullNamespace = importLine.startsWith('\\') ? importLine.slice(1) : importLine;

                                // Encontrar TODAS as ocorrências do namespace completo no código
                                let edits = [];
                                const escapedNamespace = fullNamespace.replace(/\\/g, '\\\\');
                                const allOccurrencesRegex = new RegExp(
                                    `(?<!\\w)(\\\\?${escapedNamespace})(?=::|\\(|\\s|$)`,
                                    'g'
                                );

                                let occurrenceMatch;
                                while ((occurrenceMatch = allOccurrencesRegex.exec(code)) !== null) {
                                    const occStartIndex = occurrenceMatch.index;
                                    const occEndIndex = occStartIndex + occurrenceMatch[1].length;
                                    const occStartPos = model.getPositionAt(occStartIndex);
                                    const occEndPos = model.getPositionAt(occEndIndex);

                                    edits.push({
                                        resource: model.uri,
                                        textEdit: {
                                            range: new monaco.Range(
                                                occStartPos.lineNumber,
                                                occStartPos.column,
                                                occEndPos.lineNumber,
                                                occEndPos.column,
                                            ),
                                            text: className,
                                        },
                                        versionId: model.getVersionId(),
                                    });
                                }

                                if (!code.includes(`use ${fullNamespace};`)) {
                                    edits.push({
                                        resource: model.uri,
                                        textEdit: {
                                            range: rangeTop,
                                            text: `\nuse ${fullNamespace};`,
                                        },
                                        versionId: model.getVersionId(),
                                    });

                                }

                                codeActions.push({
                                    title: `Add use statement for ${fullNamespace}`,
                                    kind: "quickfix",
                                    diagnostics: [],
                                    isPreferred: true,
                                    edit: {
                                        edits: edits,
                                    },
                                    command: {
                                        id: 'revalidateModel',
                                        title: 'Revalidate',
                                        arguments: [model]
                                    }
                                });


                            }
                        }

                        // Melhoria: Oferecer import para classes sem prefixo \ que estão no catálogo de sugestões
                        const wordAt = model.getWordAtPosition(range.getStartPosition());
                        if (wordAt && codeActions.length === 0) {
                            const word = wordAt.word;
                            const candidates = sug.filter(s =>
                                (s.kind === monaco.languages.CompletionItemKind.Class || s.kind === 6) &&
                                (s.label === word || (s.label && s.label.startsWith(word + '::')))
                            );

                            candidates.forEach(candidate => {
                                const fullNamespace = candidate.detail;
                                if (fullNamespace && fullNamespace.includes('\\') && !code.includes(`use ${fullNamespace};`)) {
                                    const afterHeaderRegex = /(?:<\?php\s*|namespace\s+.*?;|use\s+.*?;)/g;
                                    let topMatchIndex = 0;
                                    let m;
                                    while ((m = afterHeaderRegex.exec(code)) !== null) {
                                        topMatchIndex = m.index + m[0].length;
                                    }
                                    const posTop = model.getPositionAt(topMatchIndex);

                                    codeActions.push({
                                        title: `Add use statement for ${fullNamespace}`,
                                        kind: "quickfix",
                                        diagnostics: [],
                                        edit: {
                                            edits: [{
                                                resource: model.uri,
                                                textEdit: {
                                                    range: new monaco.Range(posTop.lineNumber, posTop.column, posTop.lineNumber, posTop.column),
                                                    text: `\nuse ${fullNamespace};`,
                                                },
                                                versionId: model.getVersionId(),
                                            }]
                                        }
                                    });
                                }
                            });
                        }
                        return {
                            actions: codeActions,
                            dispose: () => {
                            },
                        };
                    },
                },
            );
        };

        // Coleta todas as variáveis ($algo) declaradas/usadas no documento e as
        // devolve como sugestões de autocomplete. É o fallback usado quando o
        // Language Server não é dono do modelo: sem ele, ao digitar "$" o
        // provider legado só sabia sugerir MEMBROS de objetos já rastreados
        // ($obj->metodo) e não listava as variáveis locais, fazendo o editor
        // ficar sem "sugestão de variável".
        function getDocumentVariableSuggestions(model, position) {
            const text = model.getValue();
            const re = /\$[A-Za-z_\u0080-\uFFFF][A-Za-z0-9_\u0080-\uFFFF]*/g;
            const names = new Set();
            let m;
            while ((m = re.exec(text)) !== null) {
                names.add(m[0]);
            }

            // Descobre a coluna do "$" imediatamente antes do cursor para que o
            // range de substituição cubra o "$" e o trecho já digitado.
            const lineContent = model.getLineContent(position.lineNumber);
            let idx = position.column - 2; // índice (0-based) do char antes do cursor
            while (idx >= 0 && /[A-Za-z0-9_\u0080-\uFFFF]/.test(lineContent[idx])) {
                idx--;
            }
            const dollarCol =
                idx >= 0 && lineContent[idx] === "$" ? idx + 1 : position.column;
            const range = new monaco.Range(
                position.lineNumber,
                dollarCol,
                position.lineNumber,
                position.column,
            );

            const suggestions = [];
            names.forEach((name) => {
                suggestions.push({
                    label: name,
                    kind: monaco.languages.CompletionItemKind.Variable,
                    insertText: name,
                    range: range,
                    filterText: name,
                    sortText: name,
                    detail: "variável",
                });
            });
            return suggestions;
        }

        async function registerCompletionProvider() {
            completionProvider =
                monaco.languages.registerCompletionItemProvider(language, {
                    triggerCharacters: ["$", ":", '::', ">"],
                    provideCompletionItems: async function (model, position) {
                        // Quando o Language Server (Intelephense) está no
                        // comando DESTE modelo, ele é a única fonte de sugestões
                        // — aposentamos aqui a abordagem antiga baseada em
                        // stubs-generated.json. Mas se o LSP ainda não rastreia
                        // este modelo (não é "dono"), voltamos a servir como
                        // fallback: sem isto, com o word-based desligado, o
                        // autocomplete ficaria totalmente vazio.
                        if (window.PhpLSP && window.PhpLSP.ownsModel(model)) {
                            return {suggestions: []};
                        }
                        await updateImports(model);
                        let word = model.getWordUntilPosition(position);

                        // checa se tem <?php na linha
                        let lineContent = model.getLineContent(position.lineNumber);
                        if (lineContent.includes("<?")) {
                            return {suggestions: []};
                        }


                        if (!word.word) {
                            word = model.getWordAtPosition({
                                lineNumber: position.lineNumber,
                                column: position.column - 2,
                            });
                        }
                        if (!word) {
                            let suggestions = [];
                            let lineContent = model.getLineContent(
                                position.lineNumber,
                            );
                            sug.forEach((item) => {
                                let label = item.label.split("::")[1];
                                if (
                                    lineContent
                                        .toUpperCase()
                                        .includes(
                                            item.label
                                                .split("::")[0]
                                                .toUpperCase(),
                                        ) &&
                                    label
                                ) {
                                    let insertText = item.insertText
                                        .split("::")
                                        .pop();
                                    if (insertText) {
                                        suggestions.push({
                                            label: label,
                                            kind: item.kind,
                                            insertText: insertText,
                                            insertTextRules:
                                            item.insertTextRules,
                                            documentation: item.documentation,
                                            detail: item.detail,
                                            parameters: item.parameters,
                                        });
                                        functionSignatures[label] =
                                            item.parameters.map(
                                                (param) => param.name,
                                            );
                                    }
                                }
                            });
                            return {suggestions};
                        }


                        let variable = word.word.slice(1);
                        if (word.word.startsWith("$")) {
                            let variableNameBackup = word.word.slice(1);

                            // Sem nome após o "$" (ex.: acabou de digitar "$"):
                            // lista as variáveis do documento em vez de nada.
                            if (!variableNameBackup) {
                                return {suggestions: getDocumentVariableSuggestions(model, position)};
                            }


                            if (variableNameBackup.includes('this')) {
                                let codeContainer = model.getValue(); // código completo


                                // Procurar a última declaração de classe antes do "this"
                                const classRegex = /class\s+([A-Za-z0-9_]+)\s*/g;
                                let match, lastMatch;
                                while ((match = classRegex.exec(codeContainer)) !== null) {
                                    lastMatch = match;
                                }

                                if (lastMatch) {
                                    const className = lastMatch[1];
                                    codeInfo[variableNameBackup] = {
                                        variable: 'this',
                                        class: className
                                    };
                                    importedClasses[className] = sug.find((item) => item.detail.endsWith(className)).detail;
                                    variable = codeInfo[variableNameBackup];


                                } else {
                                    console.log('Nenhuma classe encontrada.');
                                }
                            } else {
                                console.log('nao tem this');
                                console.log(variable)
                            }

                            if (importedClasses[variable?.class]) variable.class = importedClasses[variable.class];

                            if (Object.keys(codeInfo).includes(variableNameBackup)) {
                                let nameClasse = codeInfo[variableNameBackup]['class'];
                                if (Object.keys(importedClasses).includes(nameClasse)) nameClasse = importedClasses[nameClasse];
                                variable = {
                                    class: nameClasse,
                                    variable: codeInfo[variableNameBackup]['variable']
                                };
                            }


                            let suggestions = sug.filter((item) => variable && variable.class && item.detail && item.detail.includes(variable.class)).map((item) => ({

                                label: item.label.split("::").pop(),
                                kind: item.kind,
                                insertText: item.insertText
                                    .split("::")
                                    .pop(),
                                insertTextRules: item.insertTextRules,
                                documentation: item.documentation,
                                detail: item.detail,
                                parameters: item.parameters,
                            }));
                            const dedupMembers = suggestions.filter(
                                (s, i, self) =>
                                    i ===
                                    self.findIndex(
                                        (t) => t.label === s.label,
                                    ),
                            );
                            // Não é um objeto rastreado ($obj->): então o usuário
                            // quer o NOME de uma variável — devolve as do documento.
                            if (dedupMembers.length === 0) {
                                return {suggestions: getDocumentVariableSuggestions(model, position)};
                            }
                            return {suggestions: dedupMembers};
                        } else if (word.word.startsWith('self')) {

                            let variableNameBackup = word.word;


                            if (!variableNameBackup) return {suggestions: []};
                            let className;

                            if (variableNameBackup.includes('self')) {
                                let codeContainer = model.getValue(); // código completo


                                let namespace = null;

// Captura o último namespace (se houver)
                                const nsRegex = /namespace\s+([A-Za-z0-9_\\]+)\s*;/g;
                                let nsMatch, lastNsMatch;
                                while ((nsMatch = nsRegex.exec(codeContainer)) !== null) {
                                    lastNsMatch = nsMatch;
                                }
                                if (lastNsMatch) {
                                    namespace = lastNsMatch[1];
                                }

// Captura a última classe antes de "this"
                                const classRegex = /class\s+([A-Za-z0-9_]+)\s*/g;
                                let match, lastMatch;
                                while ((match = classRegex.exec(codeContainer)) !== null) {
                                    lastMatch = match;
                                }
                                if (lastMatch) {
                                    className = lastMatch[1];
                                }

                                if (className) {
                                    const fullClassName = namespace ? `${namespace}\\${className}` : className;

                                    variable = {
                                        class: fullClassName,
                                        variable: 'self'
                                    };
                                }


                            }


                            if (importedClasses[variable?.class]) variable.class = importedClasses[variable.class];


                            let suggestions = sug.filter((item) => item.detail.includes(variable.class)).map((item) => {


                                return {

                                    label: item.label.split("::").pop(),
                                    kind: item.kind,
                                    insertText: item.insertText
                                        .split("::")
                                        .pop(),
                                    insertTextRules: item.insertTextRules,
                                    documentation: item.documentation,
                                    detail: item.detail,
                                    parameters: item.parameters,
                                }
                            });
                            return {
                                suggestions: suggestions.filter(
                                    (s, i, self) =>
                                        i ===
                                        self.findIndex(
                                            (t) => t.label === s.label,
                                        ),
                                ),
                            };
                        } else {
                            console.log(word.word, 'else')
                            let suggestions = [];
                            let filter = sug.filter(
                                (item) =>
                                    item.label
                                        .split("::")
                                        .pop()
                                        .includes(word.word) ||
                                    item.label.includes(word.word),
                            );

                            let range;
                            const textBeforeCursor = model.getValueInRange({
                                startLineNumber: position.lineNumber,
                                startColumn: 1,
                                endLineNumber: position.lineNumber,
                                endColumn: position.column,
                            });
                            const lastBackslashIndex =
                                textBeforeCursor.lastIndexOf("\\");
                            if (lastBackslashIndex !== -1) {
                                const namespacePart =
                                    textBeforeCursor.substring(
                                        lastBackslashIndex + 1,
                                    );
                                const fullNamespace = textBeforeCursor
                                    .substring(0, lastBackslashIndex)
                                    .trim();
                                const lastNamespacePart = fullNamespace
                                    .split(" ")
                                    .pop();

                                const lastNamespaceStart =
                                    fullNamespace.lastIndexOf(
                                        lastNamespacePart,
                                    ) + 1;
                                const lastNamespaceEnd =
                                    lastNamespaceStart +
                                    lastNamespacePart.length;
                                range = new monaco.Range(
                                    position.lineNumber,
                                    lastNamespaceStart,
                                    position.lineNumber,
                                    lastNamespaceEnd,
                                );
                            } else {

                                const word = model.getWordAtPosition(position);


                                range = new monaco.Range(
                                    position.lineNumber,
                                    word.startColumn,
                                    position.lineNumber,
                                    word.endColumn,
                                );
                            }
                            let filterImported = filter.filter(
                                (item) =>
                                    importedClasses[
                                        item.label.split("\\").pop()
                                        ],
                            );
                            filter = filterImported.concat(
                                filter.filter(
                                    (item) =>
                                        !importedClasses[
                                            item.label.split("\\").pop()
                                            ],
                                ),
                            );
                            filter.forEach((item) => {
                                if (
                                    importedClasses[
                                        item.label.split("\\").pop()
                                        ]
                                )
                                    item.label = item.label.split("\\").pop();
                                suggestions.push({
                                    label: item.label,
                                    kind: item.kind,
                                    insertText: item.insertText,
                                    insertTextRules: item.insertTextRules,
                                    documentation: item.documentation,
                                    detail: item.detail,
                                    parameters: item.parameters,
                                    range: range,
                                    sortText: completionRank(item.label, word.word, false),
                                    filterText: item.label,
                                });
                            });

                            // Inclui palavras-chave/language constructs do PHP
                            // (if, print, echo, foreach, function, ...), que o
                            // provider remoto não fornece.
                            getPhpKeywordSuggestions(word.word, range).forEach(
                                (kw) => suggestions.push(kw),
                            );

                            return {
                                suggestions: suggestions.filter(
                                    (s, i, self) =>
                                        i ===
                                        self.findIndex(
                                            (t) => t.label === s.label,
                                        ),
                                ),
                            };
                        }
                    },
                });
        }

// Captura o último namespace (se houver)

// Captura a última classe antes de "this"

                method: 'POST',

                    code: content,
                    fullPath: $('#hiddenFileEdit').text(),
                }),
                headers: {
                    'Content-Type': 'application/json',

                mode: 'cors',
            });
            let dataObj = await response.json();
            if (dataObj.error) {
                toastLotus(dataObj.error, 'error', 1000, 'error');
                return;
            }
            let data = dataObj.prettyCode;

            console.log(data);
            model.setValue(data);
            inlayHintsProvider.dispose();
            await registerInlayHints();
            // posicionar o cursor na posição original

                editor.setPosition(cursorPosition);
                editor.revealPosition(cursorPosition);

        async function fetchSuggestions(contextMain, stopChars) {
            // Gera chave de cache baseada no contexto
            const cacheKey = `${contextMain.textBeforeCursor.slice(-100)}_${contextMain.textAfterCursor.slice(0, 50)}`;

            // Verifica cache (válido por 5 minutos)
            if (suggestionCache.has(cacheKey)) {
                const cached = suggestionCache.get(cacheKey);
                if (Date.now() - cached.timestamp < 300000) {
                    return cached.suggestions;
                }
                suggestionCache.delete(cacheKey);
            }

            // Cancela requisição anterior se existir
            if (lastSuggestionRequest) {
                lastSuggestionRequest.abort?.();
            }

            const controller = new AbortController();
            lastSuggestionRequest = controller;

            try {
                const response = await fetch(`/codex?tokenBrowser=${$("#fp").text()}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    mode: "cors",
                    signal: controller.signal,
                    body: JSON.stringify({
                        prompt: `// Path: ${contextMain.namefile}\n${contextMain.textBeforeCursor}`,
                        suffix: contextMain.textAfterCursor,
                        max_tokens: 1000,
                        temperature: 0.2,
                        language: language,
                        top_p: 0.95,
                        n: 3,
                        stop: stopChars,
                        fullPath: $("#hiddenFileEdit").text(),
                    })
                });

                const contentType = response.headers.get("content-type");
                let suggestions = [];

                if (contentType?.includes("application/json")) {
                    const data = await response.json();
                    suggestions = data.suggestions || [];
                } else {
                    suggestions = [await response.text()];
                }

                // Salva no cache
                suggestionCache.set(cacheKey, {
                    suggestions,
                    timestamp: Date.now()
                });

                // Limpa cache antigo (mantém apenas 50 entradas)
                if (suggestionCache.size > 50) {
                    const firstKey = suggestionCache.keys().next().value;
                    suggestionCache.delete(firstKey);
                }

                return suggestions;
            } catch (error) {
                if (error.name === 'AbortError') {
                    console.log('Requisição cancelada');
                    return [];
                }
                throw error;
            }
        }

        async function showSuggestion(contextMain) {
            const lineIndex = getCurrentLineIndex();
            if (lineIndex === null) return;

            const childNodes = getLineChildNodes(lineIndex);
            if (!childNodes) return;

            let stringMount = "";
            const position = editor.getPosition();
            const stopChars = ["\n```", contextMain.stopChar].filter(Boolean);

            for (let i = 0; i < childNodes.length; i++) {
                stringMount += childNodes[i].textContent;

                if (stringMount.length === position.column ||
                    stringMount.length + 1 === position.column) {

                    await sleep(100);
                    const suggestions = await fetchSuggestions(contextMain, stopChars);

                    if (suggestions.length === 0) break;

                    suggestionText = suggestions[0];
                    currentSuggestions = suggestions;
                    currentSuggestionIndex = 0;

                    try {
                        clearSuggestions();
                        const pkn = getHtmlElementFromLine(position.lineNumber)
                            .childNodes[0].childNodes[i];

                        pkn.appendChild(createSuggestionElement(suggestionText));

                        if (suggestions.length > 1) {
                            pkn.appendChild(createIndicatorElement(1, suggestions.length));
                        }

                        currentLine = position.lineNumber;
                        addLineBreaks(currentLine, suggestionText.split("\n").length);
                    } catch (e) {
                        console.error("Erro ao exibir sugestão:", e);
                    }
                    break;
                }
            }
        }

        function cycleSuggestion(direction) {
            if (!currentSuggestions || currentSuggestions.length <= 1) return;

            currentSuggestionIndex += direction;
            if (currentSuggestionIndex < 0) {
                currentSuggestionIndex = currentSuggestions.length - 1;
            } else if (currentSuggestionIndex >= currentSuggestions.length) {
                currentSuggestionIndex = 0;
            }

            suggestionText = currentSuggestions[currentSuggestionIndex];
            updateSuggestionDisplay();
        }

        function updateSuggestionDisplay() {
            clearSuggestions();
            const lineIndex = getCurrentLineIndex();
            if (lineIndex === null) return;

            const childNodes = getLineChildNodes(lineIndex);
            if (!childNodes) return;

            const position = editor.getPosition();

            for (let i = 0; i < childNodes.length; i++) {
                let stringMount = "";
                for (let j = 0; j <= i; j++) {
                    stringMount += childNodes[j].textContent;
                }

                if (stringMount.length === position.column ||
                    stringMount.length + 1 === position.column) {
                    try {
                        const pkn = getHtmlElementFromLine(position.lineNumber)
                            .childNodes[0].childNodes[i];

                        pkn.appendChild(createSuggestionElement(suggestionText));

                        if (currentSuggestions.length > 1) {
                            pkn.appendChild(createIndicatorElement(
                                currentSuggestionIndex + 1,
                                currentSuggestions.length
                            ));
                        }

                        addLineBreaks(currentLine, suggestionText.split("\n").length);
                    } catch (e) {
                        console.error("Erro ao atualizar sugestão:", e);
                    }
                    break;
                }
            }
        }

        // Executa análise estática (PHPStan) no backend e converte os
        // diagnósticos em marcadores do editor (owner "phpstan").
        async function runPhpStanDiagnostics() {
            try {
                const model = editor.getModel();
                if (!model) return;
                // Com o Language Server (Intelephense) no comando do arquivo,
                // ele já é a AUTORIDADE de diagnósticos e resolve corretamente
                // as classes/funções indexadas no workspace — inclusive as de
                // subprojetos dentro de files/ (ex.: libspech\Sip\trunkController).
                // O PHPStan deste endpoint roda com o autoload do projeto raiz
                // e, para arquivos fora desse autoload, produz falsos positivos
                // do tipo "Instantiated class ... not found" ao mesmo tempo em
                // que o hover mostra a definição encontrada pelo LSP. Nesse
                // caso não executamos o PHPStan e limpamos marcadores antigos.
                if (lspOwnsCurrentFile()) {
                    monaco.editor.setModelMarkers(model, "phpstan", []);
                    return;
                }
                const res = await fetch(
                    "/phpstanCheck?tokenBrowser=" + $("#fp").text(),
                    {
                        method: "POST",
                        body: JSON.stringify({
                            code: model.getValue(),
                            nameFile: $("#hiddenFileEdit").text(),
                        }),
                        headers: {"Content-Type": "application/json"},
                        mode: "cors",
                    },
                ).then((r) => r.json());

                if (!res || !res.success || !Array.isArray(res.diagnostics)) {
                    return;
                }

                const markers = res.diagnostics.map((d) => {
                    const line = Math.max(1, d.line || 1);
                    const maxCol = model.getLineMaxColumn(line);
                    return {
                        startLineNumber: line,
                        startColumn: 1,
                        endLineNumber: line,
                        endColumn: maxCol,
                        message: d.message,
                        severity: monaco.MarkerSeverity.Error,
                        source: d.source || "phpstan",
                    };
                });
                monaco.editor.setModelMarkers(model, "phpstan", markers);
            } catch (e) {
                console.log("phpstanCheck indisponível:", e);
            }
        }

        // Verdadeiro quando o Language Server (Intelephense) está no comando
        // do arquivo atual (PHP). Nesse caso, todo o autocomplete/hover/
        // assinatura/diagnóstico vem do LSP e o pipeline legado de stubs é
        // dispensável.
        function lspOwnsCurrentFile() {
            try {
                const model = editor.getModel();
                return !!(
                    window.PhpLSP &&
                    model &&
                    model.getLanguageId() === "php" &&
                    window.PhpLSP.ownsModel(model)
                );
            } catch (e) {
                return false;
            }
        }

        // Reinicializa os providers legados baseados em stubs. Quando o LSP
        // está ativo, apenas re-registra os providers leves (que já retornam
        // vazio) e PULA o trabalho pesado e síncrono — fetch em /codeGenerate,
        // montagem de 1200+ assinaturas e re-scan de inlay hints — que
        // bloqueava a main thread a cada abertura/salvamento e congelava a
        // barra de progresso do toast. Sem LSP, mantém o comportamento antigo.
        async function refreshLegacyProviders() {
            try { inlayHintsProvider && inlayHintsProvider.dispose(); } catch (e) {}
            try { codeActionsProvider && codeActionsProvider.dispose(); } catch (e) {}
            try { completionProvider && completionProvider.dispose(); } catch (e) {}

            if (lspOwnsCurrentFile()) {
                await registerInlayHints();
                await registerCodeActions();
                await registerCompletionProvider();
                return;
            }

            await registerInlayHints();
            await updateImports(editor.getModel());
            await registerCodeActions();
            await registerCompletionProvider();
            await updateProviders();
            inlayHintsProvider.dispose();
            await registerInlayHints();
        }

        async function updateImports(model) {
            const lines = model.getLinesContent();
            for (const line of lines) {
                const useMatch = line.match(/use\s+([^\s;]+);/);
                if (useMatch) {
                    const fullClassPath = useMatch[1];
                    const className = fullClassPath.split("\\").pop();
                    importedClasses[className] = fullClassPath;
