                                    <script>
                                        async function findLocationAddress(path) {
                                            const timeout = 30000;
                                            const interval = 300;
                                            const start = Date.now();

                                            const waitUntil = async (conditionFn) => {
                                                return new Promise((resolve, reject) => {
                                                    const timer = setInterval(() => {
                                                        if (conditionFn()) {
                                                            clearInterval(timer);
                                                            resolve(true);
                                                        } else if (Date.now() - start > timeout) {
                                                            clearInterval(timer);
                                                            reject("Tempo limite ao localizar: " + path);
                                                        }
                                                    }, interval);
                                                });
                                            };

                                            // Caminhos intermediários (pastas)
                                            const segments = path.split('/').filter(Boolean);
                                            let current = '';

                                            for (let i = 0; i < segments.length - 1; i++) {
                                                current += '/' + segments[i];

                                                const selector = `.folder[data-path="${current}/"]`;
                                                const folderElement = document.querySelector(selector);

                                                if (!folderElement) {
                                                    console.log(`Aguardando pasta: ${current}/`);
                                                    try {
                                                        await waitUntil(() => document.querySelector(selector));
                                                    } catch (e) {
                                                        return console.warn(e);
                                                    }
                                                }

                                                const folder = document.querySelector(selector);
                                                const subUl = folder?.nextElementSibling;
                                                const isHidden = subUl?.classList.contains('hidden');

                                                if (isHidden) {
                                                    folder.click(); // simula clique pra abrir a pasta
                                                    await new Promise(r => setTimeout(r, 300)); // aguarda animação abrir
                                                }
                                            }

                                            // Finalmente, tenta localizar o arquivo
                                            const fileSelector = `.file[file-path="${path}"]`;

                                            try {
                                                await waitUntil(() => document.querySelector(fileSelector));
                                                const fileElement = document.querySelector(fileSelector);
                                                fileElement.scrollIntoView({behavior: "smooth", block: "center"});

                                                // aplica um fundo amarelo temporário para destacar
                                                fileElement.style.backgroundColor = "#ffe082";
                                                fileElement.style.color = 'black';
                                                setTimeout(() => {
                                                    fileElement.style.transition = "background-color 1s";
                                                    fileElement.style.backgroundColor = "";
                                                    fileElement.style.color = '';
                                                }, 2000);

                                                // Opcional: clicar automaticamente
                                                // fileElement.click();

                                                console.log('Localizado:', path);
                                            } catch (e) {
                                                console.warn(e);
                                            }
                                        }

                                        function closeAllTabs() {
                                            const tabs = document.querySelectorAll('.tab-header-item');
                                            tabs.forEach(tab => {
                                                tab.remove();
                                            });
                                            models = {}; // Limpa os modelos
                                            editor.setModel(null); // Limpa o modelo do editor
                                            tabsCache = {}; // Limpa o cache de abas
                                        }

                                    </script>

                <script>
                    let terminals = {};

                    // ---- Token helper ----
                    function getToken() {
                        return localStorage.tokenBrowser || document.getElementById('fp')?.innerText?.trim() || '';
                    }

                    async function waitForToken() {
                        return new Promise((resolve) => {
                            const check = setInterval(() => {
                                const t = getToken();
                                if (t && t.length > 3) {
                                    clearInterval(check);
                                    resolve(t);
                                }
                            }, 100);
                        });
                    }

                    // ---- API helpers ----
                    async function apiSaveTerminal(session) {
                        const token = getToken();
                        return fetch(`/saveTerminal?tokenBrowser=${token}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                id: session.id,
                                name: session.name,
                            }),
                        }).then(r => r.json()).catch(() => ({}));
                    }

                    async function apiDeleteTerminal(terminalId) {
                        const token = getToken();
                        return fetch(`/deleteTerminal?tokenBrowser=${token}&id=${terminalId}`)
                            .then(r => r.json()).catch(() => ({}));
                    }

                    async function apiGetTerminals() {
                        const token = getToken();
                        return fetch(`/getTerminals?tokenBrowser=${token}`)
                            .then(r => r.json()).catch(() => []);
                    }

                    // ---- LocalStorage helpers ----
                    function getStoredTerminals() {
                        try {
                            const raw = localStorage.getItem('storageTerminals');
                            return raw ? JSON.parse(raw) : [];
                        } catch { return []; }
                    }

                    function setStoredTerminals(sessions) {
                        localStorage.setItem('storageTerminals', JSON.stringify(sessions));
                    }

                    function getXtermDimensions() {
                        try {
                            const raw = localStorage.getItem('xtermDimensions');
                            return raw ? JSON.parse(raw) : null;
                        } catch { return null; }
                    }

                    // ---- Tab & terminal creation ----
                    function createTerminalTab(options) {
                        const { id: terminalId, name } = options;

                        let container = document.getElementById(terminalId);
                        if (!container) {
                            container = document.createElement('div');
                            container.id = terminalId;
                            container.className = 'xterm-container';
                            container.style.display = 'none';
                            document.getElementById('terms').appendChild(container);
                        }

                        const li = document.createElement('li');
                        li.classList.add('nav-item');
                        li.dataset.terminalId = terminalId;

                        const link = document.createElement('a');
                        link.classList.add('nav-link');
                        link.href = '#';

                        const icon = document.createElement('i');
                        icon.className = 'fa-duotone fa-solid fa-terminal me-1';

                        const label = document.createElement('span');
                        label.className = 'terminal-tab-label';
                        label.textContent = name;
                        label.title = 'Clique duplo para renomear';

                        const closeBtn = document.createElement('span');
                        closeBtn.className = 'close-tab';
                        closeBtn.innerHTML = '&times;';

                        link.appendChild(icon);
                        link.appendChild(label);
                        link.appendChild(closeBtn);
                        li.appendChild(link);
                        document.getElementById('new-terminal').before(li);

                        label.addEventListener('dblclick', (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            startRename(label, options);
                        });

                        link.addEventListener('click', (e) => {
                            if (e.target === closeBtn || e.target.closest('.close-tab')) return;
                            selectTerminalTab(terminalId);
                        });

                        closeBtn.addEventListener('click', (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            closeTerminalTab(terminalId);
                        });

                        link.addEventListener('contextmenu', (e) => {
                            e.preventDefault();
                            e.stopPropagation();
                            showTerminalCtxMenu(e.clientX, e.clientY, terminalId, label, options);
                        });

                        const dims = getXtermDimensions();
                        const term = new window.Terminal({
                            cursorBlink: true,
                            cols: dims?.cols ?? 100,
                            rows: dims?.rows ?? 30,
                            scrollback: 5000,
                            allowProposedApi: true,
                            theme: {
                                background: '#000000',
                                foreground: '#f0f0f0',
                                cursor: '#00bfff',
                            },
                        });
                        term.open(container);
                        terminals[terminalId] = { terminal: term, socket: null, options };

                        term.onResize((size) => {
                            const sock = terminals[terminalId]?.socket;
                            if (sock?.readyState === WebSocket.OPEN) {
                                sock.send(JSON.stringify({
                                    command: 'resizeXtermHandlerCommand',
                                    token: sock.url.split('/').pop(),
                                    cols: size.cols,
                                    rows: size.rows,
                                    isCodex: true,
                                }));
                            }
                        });

                        // onData captura teclado + sequências de mouse geradas pelo xterm
                        // quando apps como htop habilitam mouse reporting (ex: \x1b[?1000h)
                        term.onData((data) => {
                            const sock = terminals[terminalId]?.socket;
                            if (!sock || sock.readyState !== WebSocket.OPEN) return;
                            try {
                                // Ctrl+C com texto selecionado = copiar (não envia sinal)
                                if (data === '\x03') {
                                    const sel = term.getSelection();
                                    if (sel) {
                                        navigator.clipboard.writeText(sel).catch(() => {});
                                        term.clearSelection();
                                        return;
                                    }
                                }
                                // Ctrl+V = colar da área de transferência
                                if (data === '\x16') {
                                    navigator.clipboard.readText().then((text) => {
                                        runCommand(sock, text);
                                    }).catch(() => {});
                                    return;
                                }
                                runCommand(sock, data);
                            } catch (e) {
                                console.error('Erro ao processar entrada:', e);
                            }
                        });

                        initWebSocket(term, options);
                        selectTerminalTab(terminalId);
                        return { term, container };
                    }

                    // ---- Context menu ----
                    (function () {
                        const ctxMenu = document.getElementById('terminal-ctx-menu');
                        let ctxTarget = null; // { terminalId, labelEl, options }

                        function hideCtxMenu() {
                            ctxMenu.style.display = 'none';
                            ctxTarget = null;
                        }

                        window.showTerminalCtxMenu = function (x, y, terminalId, labelEl, options) {
                            ctxTarget = { terminalId, labelEl, options };
                            // Keep menu inside the viewport
                            const menuW = 180, menuH = 180;
                            const left = Math.min(x, window.innerWidth - menuW - 8);
                            const top = Math.min(y, window.innerHeight - menuH - 8);
                            ctxMenu.style.left = left + 'px';
                            ctxMenu.style.top = top + 'px';
                            ctxMenu.style.display = 'block';
                        };

                        ctxMenu.addEventListener('click', async (e) => {
                            const item = e.target.closest('[data-action]');
                            if (!item || !ctxTarget) return;
                            const { terminalId, labelEl, options } = ctxTarget;
                            hideCtxMenu();

                            switch (item.dataset.action) {
                                case 'rename':
                                    startRename(labelEl, options);
                                    break;

                                case 'duplicate': {
                                    const sessions = getStoredTerminals();
                                    const newId = Math.random().toString(36).substring(2, 15)
                                               + Math.random().toString(36).substring(2, 15);
                                    const srcName = options.name || 'Terminal';
                                    const newName = srcName + ' (cópia)';
                                    const token = await waitForToken();
                                    sessions.push({ id: newId, name: newName });
                                    setStoredTerminals(sessions);
                                    createTerminalTab({ id: newId, name: newName, token });
                                    await apiSaveTerminal({ id: newId, name: newName });
                                    break;
                                }

                                case 'new':
                                    document.getElementById('new-terminal').click();
                                    break;

                                case 'close-others': {
                                    const allIds = [...document.querySelectorAll('#tabsTerm li[data-terminal-id]')]
                                        .map(li => li.dataset.terminalId)
                                        .filter(id => id !== terminalId);
                                    for (const id of allIds) await closeTerminalTab(id);
                                    selectTerminalTab(terminalId);
                                    break;
                                }

                                case 'close':
                                    await closeTerminalTab(terminalId);
                                    break;
                            }
                        });

                        // Close on outside click or Escape
                        document.addEventListener('click', (e) => {
                            if (!ctxMenu.contains(e.target)) hideCtxMenu();
                        });
                        document.addEventListener('keydown', (e) => {
                            if (e.key === 'Escape') hideCtxMenu();
                        });
                    })();

                    // ---- Rename (double-click on tab label) ----
                    function startRename(labelEl, options) {
                        const terminalId = options.id;
                        const currentName = labelEl.textContent;
                        labelEl.classList.add('editing');

                        const input = document.createElement('input');
                        input.type = 'text';
                        input.value = currentName;
                        input.className = 'terminal-rename-input';
                        labelEl.textContent = '';
                        labelEl.appendChild(input);
                        input.focus();
                        input.select();

                        const finishRename = async () => {
                            const newName = input.value.trim() || currentName;
                            labelEl.classList.remove('editing');
                            labelEl.textContent = newName;
                            options.name = newName;

                            const sessions = getStoredTerminals();
                            const idx = sessions.findIndex(s => s.id === terminalId);
                            if (idx !== -1) sessions[idx].name = newName;
                            setStoredTerminals(sessions);
                            await apiSaveTerminal({ id: terminalId, name: newName });
                        };

                        input.addEventListener('blur', finishRename);
                        input.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter') input.blur();
                            if (e.key === 'Escape') { input.value = currentName; input.blur(); }
                        });
                    }

                    // ---- Select/show tab ----
                    function selectTerminalTab(terminalId) {
                        document.querySelectorAll('#tabsTerm .nav-link').forEach(l => l.classList.remove('active'));
                        document.querySelectorAll('#terms .xterm-container').forEach(c => { c.style.display = 'none'; });
                        const li = document.querySelector(`#tabsTerm [data-terminal-id="${terminalId}"]`);
                        if (li) li.querySelector('.nav-link').classList.add('active');
                        const container = document.getElementById(terminalId);
                        if (container) container.style.display = 'block';
                        adjustTerminalSizeFromStorage(terminalId);
                    }

                    // ---- Close tab ----
                    async function closeTerminalTab(terminalId) {
                        const termInfo = terminals[terminalId];
                        if (termInfo?.socket?.readyState === WebSocket.OPEN) {
                            try {
                                termInfo.socket.send(JSON.stringify({
                                    command: 'closeXtermHandlerCommand',
                                    token: termInfo.socket.url.split('/').pop(),
                                    isCodex: true,
                                }));
                            } catch {}
                            termInfo.socket.onclose = null;
                            termInfo.socket.close();
                        }

                        document.querySelector(`#tabsTerm [data-terminal-id="${terminalId}"]`)?.remove();
                        document.getElementById(terminalId)?.remove();
                        delete terminals[terminalId];

                        const sessions = getStoredTerminals().filter(s => s.id !== terminalId);
                        setStoredTerminals(sessions);
                        await apiDeleteTerminal(terminalId);

                        const remaining = document.querySelectorAll('#tabsTerm li[data-terminal-id]');
                        if (remaining.length > 0) {
                            selectTerminalTab(remaining[remaining.length - 1].dataset.terminalId);
                        }
                    }

                    // ---- Vertical resizer ----
                    document.getElementById('resizer').addEventListener('mousedown', (e) => {
                        e.preventDefault();
                        window.addEventListener('mousemove', onResizerMove);
                        window.addEventListener('mouseup', () => window.removeEventListener('mousemove', onResizerMove));
                    });

                    function onResizerMove(e) {
                        const footerTerminal = document.getElementById('footer-terminal');
                        const editorEl = document.getElementById('editor');
                        const fArch = document.getElementById('fArch');
                        const filesArchitecture = document.getElementById('filesArchitecture');
                        const newWidth = document.getElementById('terms').clientWidth;
                        const newHeight = window.innerHeight - e.clientY;

                        const editorHeight = footerTerminal.getBoundingClientRect().top;
                        if (editorEl) editorEl.style.height = `${editorHeight - 80}px`;
                        if (fArch) fArch.style.height = `${editorHeight - 70}px`;
                        if (filesArchitecture) filesArchitecture.style.height = `${editorHeight - 130}px`;

                        const calcCols = Math.floor(newWidth / 9) - 2;
                        const calcRows = Math.floor(document.getElementById('terms').getBoundingClientRect().height / 17);

                        Object.keys(terminals).forEach((id) => {
                            const el = document.getElementById(id);
                            if (el) {
                                el.style.width = `${newWidth}px`;
                                el.style.height = `${newHeight - 42}px`;

                            const info = terminals[id];
                            if (info?.terminal) info.terminal.resize(calcCols, calcRows);
                        });

                        localStorage.setItem('xtermDimensions', JSON.stringify({
                            cols: calcCols,
                            rows: calcRows,
                            width: newWidth,
                            height: newHeight - 42,
                            editor: { width: editorEl?.clientWidth, height: editorEl?.clientHeight },

                        }));
                    }

                        const el = document.getElementById(terminalId);

                        const dims = getXtermDimensions();
                        if (!dims) return;
                        el.style.width = `${dims.width}px`;
                        el.style.height = `${dims.height}px`;
                        const info = terminals[terminalId];
                        if (info?.terminal) {
                            const calcCols = Math.floor(dims.width / 9) - 2;
                            const calcRows = Math.floor(dims.height / 17);
                            info.terminal.resize(calcCols, calcRows);
                        }
                    }

                    // ---- WebSocket ----
                    async function initWebSocket(terminal, options) {
                        const token = await waitForToken();
                        options.token = token;

                        const terminalId = options.id;
                        const hostname = window.location.port
                            ? `${window.location.hostname}:${window.location.port}`
                            : window.location.hostname;
                        const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
                        const wsToken = `${token}-${terminalId}`;
                        const socket = new WebSocket(`${protocol}://${hostname}/${wsToken}`);

                        if (terminals[terminalId]) terminals[terminalId].socket = socket;

                        socket.onopen = () => {
                            socket.send(JSON.stringify({
                                command: 'startXtermHandlerCommand',
                                token: wsToken,
                                isCodex: true,
                            }));
                        };

                        socket.onmessage = (event) => {
                            if (event.data) {
                                if (event.data.includes('\x1b[H') && event.data.includes('\x1b[2J')) {
                                    terminal.clear();
                                }
                                terminal.write(event.data);
                            }
                        };

                        socket.onclose = () => {
                            if (terminals[terminalId]) {
                                console.warn(`Terminal "${terminalId}" desconectado, reconectando em 3s...`);
                                setTimeout(() => initWebSocket(terminal, options), 3000);
                            }
                        };

                        socket.onerror = (err) => {
                            console.error(`Erro no WebSocket do terminal "${terminalId}":`, err);
                        };
                    }

                    window.runCommand = (socket, command) => {
                        if (socket?.readyState === WebSocket.OPEN) {
                            try {
                                socket.send(JSON.stringify({
                                    command,
                                    token: socket.url.split('/').pop(),
                                    isCodex: true,
                                }));
                            } catch (e) {
                                console.error('Erro ao enviar comando:', e);
                            }
                        }
                    };

                    document.getElementById('new-terminal').addEventListener('click', async () => {
                        const sessions = getStoredTerminals();
                        const id = Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
                        const name = `Terminal ${sessions.length + 1}`;
                        const token = await waitForToken();
                        const session = { id, name, token };
                        sessions.push({ id, name });
                        setStoredTerminals(sessions);
                        createTerminalTab(session);
                        await apiSaveTerminal({ id, name });
                    });

                    // Legacy alias
                    window.createTabTerminal = async () => document.getElementById('new-terminal').click();

                    // ---- Page load: restore saved terminals ----
                    document.onreadystatechange = async function () {
                        if (document.readyState !== 'complete') return;

                        const dims = getXtermDimensions();
                        const editorEl = document.getElementById('editor');
                        const filesArchitecture = document.getElementById('filesArchitecture');
                        if (editorEl && dims?.editor?.height) editorEl.style.height = `${dims.editor.height}px`;
                        if (filesArchitecture && dims?.filesArchitecture?.height) filesArchitecture.style.height = `${dims.filesArchitecture.height}px`;

                        const token = await waitForToken();

                        if (Array.isArray(serverSessions) && serverSessions.length > 0) {
                            setStoredTerminals(serverSessions);
                            for (const session of serverSessions) {
                                createTerminalTab({ ...session, token });
                            }
                        }
                    };

        async function registerInlayHints() {
            inlayHintsProvider = await monaco.languages.registerInlayHintsProvider(language, {
                async provideInlayHints(model, range) {
                    let hints = [];
                    const code = editor.getValue();

                    for (let [functionName, args] of Object.entries(functionSignatures)) {
                        const regex = new RegExp(
                                `\\b${functionName.replaceAll("\\", "\\\\").replaceAll("$", "")}\\((.*?)\\)`,
                            "gs"
                        );
                        let match;
                        while ((match = regex.exec(code)) !== null) {
                            let functionArgs = match[1]
                                .split(",")
                                .map((arg) => arg.trim());
                            let startIndex = match.index + match[0].indexOf("(") + 1;

                            functionArgs.forEach((arg, i) => {
                                if (i < args.length) {
                                    let argStartIndex = code.indexOf(arg, startIndex);
                                    let argPosition = model.getPositionAt(argStartIndex);

                                    // Verifica se o argumento está dentro do range visível
                                    if (
                                        argPosition.lineNumber >= range.startLineNumber &&
                                        argPosition.lineNumber <= range.endLineNumber
                                    ) {
                                        if (
                                            !hints.some(
                                                (hint) =>
                                                    hint.position.lineNumber === argPosition.lineNumber &&
                                                    hint.position.column === argPosition.column
                                            )
                                        ) {
                                            hints.push({
                                                label: `${args[i]}: `,
                                                position: argPosition,
                                            });
                                        }
                                    }

                                    startIndex = argStartIndex + arg.length;
                                } else {
                                    let argStartIndex = code.indexOf(arg, startIndex);
                                    let argPosition = model.getPositionAt(argStartIndex);

                                    // Remove dicas que não estão no range visível
                                    hints = hints.filter(
                                        (hint) =>
                                            !(
                                                hint.position.lineNumber === argPosition.lineNumber &&
                                                hint.position.column === argPosition.column
                                            )
                                    );
                                }
                            });
                        }
                    }

                    // Filtra duplicações
                    hints = hints
                        .filter(
                            (hint, index, self) =>
                                index ===
                                self.findIndex(
                                    (t) =>
                                        t.position.lineNumber === hint.position.lineNumber &&
                                        t.position.column === hint.position.column
                                )
                        )
                        // Filtra linhas que começam com comentário "//"
                        .filter(
                            (hint) =>
                                !model
                                    .getLineContent(hint.position.lineNumber)
                                    .trim()
                                    .startsWith("//")
                        );

                    return {
                        dispose: () => {
                        },
                        hints,
                    };
                },
            });
        }

                        let match;
                        const codeActions = [];

                        while ((match = regex.exec(code)) !== null) {
                            const importLine = match[0];
                            const startIndex = match.index;
                            const endIndex = startIndex + importLine.length;

                            const startPosition = model.getPositionAt(startIndex);
                            const endPosition = model.getPositionAt(endIndex);

                            // Verifica se a posição do cursor está sobre a expressão detectada
                            if (
                                range.startLineNumber === startPosition.lineNumber &&
                                range.startColumn >= startPosition.column &&
                                range.endColumn <= endPosition.column
                            ) {
                                // Encontra a posição ideal para inserção (após <?php, namespace ou último use)
                                const afterHeaderRegex = /(?:<\?php\s*|namespace\s+.*?;|use\s+.*?;)/g;
                                let topMatchIndex = 0;
                                let m;
                                while ((m = afterHeaderRegex.exec(code)) !== null) {

                                let edits = [];
                                const escapedNamespace = fullNamespace.replace(/\\/g, '\\\\');

                                    edits.push({
                                        resource: model.uri,

                                            range: new monaco.Range(
                                                occStartPos.lineNumber,
                                                occStartPos.column,
                                                occEndPos.lineNumber,

                                            text: className,
                                        },
                                        versionId: model.getVersionId(),
                                    });
                                }

                                if (!code.includes(`use ${fullNamespace};`)) {
                                    edits.push({
                                        resource: model.uri,
                                        textEdit: {
                                            range: rangeTop,
                                            text: `\nuse ${fullNamespace};`,
                                        },
                                        versionId: model.getVersionId(),
                                    });

                                }

                                codeActions.push({
                                    title: `Add use statement for ${fullNamespace}`,
                                    kind: "quickfix",
                                    diagnostics: [],
                                    isPreferred: true,
                                    edit: {
                                        edits: edits,
                                    },
                                    command: {
                                        id: 'revalidateModel',
                                        title: 'Revalidate',
                                        arguments: [model]
                                    }
                                });


                            }
                        }

                        // Melhoria: Oferecer import para classes sem prefixo \ que estão no catálogo de sugestões
                        const wordAt = model.getWordAtPosition(range.getStartPosition());
                        if (wordAt && codeActions.length === 0) {
                            const word = wordAt.word;
                            const candidates = sug.filter(s =>
                                (s.kind === monaco.languages.CompletionItemKind.Class || s.kind === 6) &&
                                (s.label === word || (s.label && s.label.startsWith(word + '::')))
                            );

            lastSuggestionRequest = controller;

            try {
                const response = await fetch(`/codex?tokenBrowser=${$("#fp").text()}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    mode: "cors",
                    signal: controller.signal,
                    body: JSON.stringify({
                        prompt: `// Path: ${contextMain.namefile}\n${contextMain.textBeforeCursor}`,
                        suffix: contextMain.textAfterCursor,
                        max_tokens: 1000,
                        temperature: 0.2,
                        language: language,
                        top_p: 0.95,
                        n: 3,
                        stop: stopChars,
                        fullPath: $("#hiddenFileEdit").text(),
                    })
                });

                const contentType = response.headers.get("content-type");
                let suggestions = [];

                if (contentType?.includes("application/json")) {
                    const data = await response.json();
                    suggestions = data.suggestions || [];
                } else {
                    suggestions = [await response.text()];
                }

                // Salva no cache
                suggestionCache.set(cacheKey, {
                    suggestions,
                    timestamp: Date.now()
                });

                // Limpa cache antigo (mantém apenas 50 entradas)
                if (suggestionCache.size > 50) {
                    const firstKey = suggestionCache.keys().next().value;
                    suggestionCache.delete(firstKey);
                }

                return suggestions;
            } catch (error) {
                if (error.name === 'AbortError') {
                    console.log('Requisição cancelada');
                    return [];
                }
                throw error;
            }
        }

        async function showSuggestion(contextMain) {
            const lineIndex = getCurrentLineIndex();
            if (lineIndex === null) return;

            const childNodes = getLineChildNodes(lineIndex);
            if (!childNodes) return;

            let stringMount = "";
            const position = editor.getPosition();
            const stopChars = ["\n```", contextMain.stopChar].filter(Boolean);

            for (let i = 0; i < childNodes.length; i++) {
                stringMount += childNodes[i].textContent;

                if (stringMount.length === position.column ||
                    stringMount.length + 1 === position.column) {

                    await sleep(100);
                    const suggestions = await fetchSuggestions(contextMain, stopChars);

                    if (suggestions.length === 0) break;

                    suggestionText = suggestions[0];
                    currentSuggestions = suggestions;
                    currentSuggestionIndex = 0;

                    try {
                        clearSuggestions();
                        const pkn = getHtmlElementFromLine(position.lineNumber)
                            .childNodes[0].childNodes[i];

                        pkn.appendChild(createSuggestionElement(suggestionText));

                        if (suggestions.length > 1) {
                            pkn.appendChild(createIndicatorElement(1, suggestions.length));
                        }

                        currentLine = position.lineNumber;
                        addLineBreaks(currentLine, suggestionText.split("\n").length);
                    } catch (e) {
                        console.error("Erro ao exibir sugestão:", e);
                    }
                    break;
                }
            }
        }

        function cycleSuggestion(direction) {
            if (!currentSuggestions || currentSuggestions.length <= 1) return;

            currentSuggestionIndex += direction;
            if (currentSuggestionIndex < 0) {
                currentSuggestionIndex = currentSuggestions.length - 1;
            } else if (currentSuggestionIndex >= currentSuggestions.length) {
                currentSuggestionIndex = 0;
            }

            suggestionText = currentSuggestions[currentSuggestionIndex];
            updateSuggestionDisplay();
        }

        function updateSuggestionDisplay() {
            clearSuggestions();
            const lineIndex = getCurrentLineIndex();
            if (lineIndex === null) return;

            const childNodes = getLineChildNodes(lineIndex);
            if (!childNodes) return;

            const position = editor.getPosition();

            for (let i = 0; i < childNodes.length; i++) {
                let stringMount = "";
                for (let j = 0; j <= i; j++) {
                    stringMount += childNodes[j].textContent;
                }

                if (stringMount.length === position.column ||
                    stringMount.length + 1 === position.column) {
                    try {
                        const pkn = getHtmlElementFromLine(position.lineNumber)
                            .childNodes[0].childNodes[i];

                        pkn.appendChild(createSuggestionElement(suggestionText));

                        if (currentSuggestions.length > 1) {
                            pkn.appendChild(createIndicatorElement(
                                currentSuggestionIndex + 1,
                                currentSuggestions.length
                            ));
                        }

                        addLineBreaks(currentLine, suggestionText.split("\n").length);
                    } catch (e) {
                        console.error("Erro ao atualizar sugestão:", e);
                    }
                    break;
                }
            }
        }

        function recoverSuggestion() {
            clearSuggestions();
            let vLines = document.querySelectorAll(".view-lines");
            let currentRow = editor.getPosition().lineNumber;
            let currentOuterHtml;
            document
                .querySelectorAll(".margin-view-overlays")[0]
                .childNodes.forEach((element, key) => {
                if (Number(element.innerText) === currentRow)
                    currentOuterHtml = key;
            });
            let stringMount = "";
            let emb =
                document.getElementsByClassName("view-lines")[0].childNodes[
                    currentOuterHtml
                    ].childNodes;
            emb = emb[0].childNodes;
            for (let i = 0; i < emb.length; i++) {
                let tc = emb[i].textContent;
                stringMount += tc;
                let stop = ["\n\n\n", "\n```"];
                if (contextMain.stopChar) {
                    stop.push(contextMain.stopChar);
                }

                if (
                    stringMount.length === editor.getPosition().column ||
                    stringMount.length + 1 === editor.getPosition().column
                ) {
                    setTimeout(async () => {
                        try {
                            clearSuggestions();
                            let pkn =
                                document.getElementsByClassName("view-lines")[0]
                                    .childNodes[currentOuterHtml].childNodes[0]
                                    .childNodes[i];
                            let suggestionSpan = document.createElement("span");
                            suggestionSpan.style.opacity = 0.5;
                            suggestionSpan.className = "suggestion";
                            suggestionSpan.innerHTML = suggestionText
                                .replaceAll(`\n`, '<br-class="brs">')
                                .replaceAll(" ", "&nbsp;")
                                .replaceAll(
                                    '<br-class="brs">',
                                    '<br class="brs">',
                                );
                            pkn.appendChild(suggestionSpan);
                            let totalLinesNeeded =
                                suggestionText.split("\n").length;
                            let brs = "";
                            let ib;
                            for (ib = 0; ib < totalLinesNeeded; ib++) {
                                brs += '<br class="brs">';
                            }
                            let docTotalLines =
                                editor.getModel().getLineCount() + 1;
                            for (
                                let pi = currentLine + 1;
                                pi <= docTotalLines;
                                pi++
                            ) {
                                let line = getHtmlElementFromLine(pi);
                                if (line) {
                                    if (ib > 1)
                                        line.innerHTML = brs + line.innerHTML;
                                }
                            }
                        } catch (e) {
                        }
                    }, 1);
                    break;
                }
            }
        }

        async function updateMarkersImport() {
            await updateImports(editor.getModel());
            const code = editor.getModel().getValue();
            const markers = [];
            const regex =
                /(?<!\w)(\\[a-zA-Z_][a-zA-Z0-9_]*(?:\\[a-zA-Z_][a-zA-Z0-9_]*)*)(?=::|\(|\s|$)/g;
            let match;
            while ((match = regex.exec(code)) !== null) {
                const importLine = match[0];
                const startIndex = match.index;
                const endIndex = startIndex + importLine.length;

                const startPosition = editor
                    .getModel()
                    .getPositionAt(startIndex);
                const endPosition = editor.getModel().getPositionAt(endIndex);

                markers.push({
                    startLineNumber: startPosition.lineNumber,
                    startColumn: startPosition.column,
                    endLineNumber: endPosition.lineNumber,
                    endColumn: endPosition.column,
                    message: "Import " + importLine,
                    severity: monaco.MarkerSeverity.Warning,
                });
            }
            monaco.editor.setModelMarkers(editor.getModel(), "test", markers);
            for (let x = 0; x < sug.length; x++) {
                try {
                    functionSignatures[sug[x].label] = sug[x].parameters.map(
                        (param, index) => param.name,
                    );
                } catch (e) {
                }
            }
            // filter empty signatures
            for (let [key, value] of Object.entries(functionSignatures)) {
                if (value.length === 0) {
                    delete functionSignatures[key];
                }
            }
        }

        async function updateImports(model) {
            const lines = model.getLinesContent();
            for (const line of lines) {
                const useMatch = line.match(/use\s+([^\s;]+);/);
                if (useMatch) {
                    const fullClassPath = useMatch[1];
                    const className = fullClassPath.split("\\").pop();
                    importedClasses[className] = fullClassPath;
                }
            }
        }

        function formatParameters(parameters) {
            return parameters.map((param, index) => {
                return param.type === "callable" ? "function(){}" : `$${"${" + (index + 1) + ":" + param.name + "}"}`;
            }).join(", ");
        }


        function createCompletionItem(item, insertText, kind) {
            const paramList = Array.isArray(item.parameters) ? item.parameters : [];
            const returnType = item.returnType || "mixed";

            const signature = `${item.name}(\n${paramList.map(param => {
                const type = param.type || 'mixed';
                const name = param.name || 'arg';
                return `    ${type} $${name}, \n`;
            }).join('')})`;

            const markdownDoc = {
                value:
                    '```php\n' +
                    `${item.static ? 'static ' : ''}function ${signature}\n` +
                    '```\n' +
                    (paramList.length > 0
                        ? '\n**Parameters:**\n' +
                        paramList
                            .map(param => `- \`$${param.name}: ${param.type || 'mixed'}\``)
                            .join('\n') +
                        '\n'
                        : '') +
                    `\n**Returns:** \`${returnType}\``
            };



            return {
                label: kind === "Class"
                    ? item.class
                    : `${item.class}::${item.name}`,
                kind: kind === "Class"
                    ? monaco.languages.CompletionItemKind.Class
                    : monaco.languages.CompletionItemKind.Method,
                insertText: insertText,
                insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                documentation: markdownDoc,
                detail: item.class,
                parameters: paramList,
            };
        }


        async function updateProviders() {
            await updateImports(editor.getModel());
            await updateMarkersImport();

            let provider = await fetch(
                "/codeGenerate?tokenBrowser=" + $("#fp").text(),
                {
                    method: "POST",
                    body: JSON.stringify({
                        search: "",
                        lastDid: "",
                        lineContent: "",
                        nameFile: "",
                    }),
                    headers: {
                        "Content-Type": "application/json",
                    },
                    mode: "cors",
                },
            )
                .then(async (response) => await response.text())
                .then((data) => JSON.parse(data).list);
            sug = [];
            functionSignatures = {};
            codeInfo = {};
            hints = [];
            if (!provider || !provider["functions"]) {
                provider = {
                    functions: [],
                    classes: [],
                    constants: [],
                };
            }

            for (let i = 0; i < provider["functions"].length; i++) {
                const item = provider["functions"][i];
                const paramList = Array.isArray(item.parameters) ? item.parameters : [];
                const returnType = item.returnType || "void";

                let insertText = item.name;
                let docParams = [];
                let snippetParams = [];

                if (paramList.length > 0) {
                    paramList.forEach((param, index) => {
                        if (param.type === "callable") {
                            snippetParams.push("function(){}");
                            docParams.push(`function`);
                        } else {
                            snippetParams.push('$${' + (index + 1) + `:${param.name}` + '}');
                            docParams.push(`$${param.name}`);
                        }
                    });
                }
                let argsInsert = snippetParams.join(", ");
                insertText = insertText + '(' + argsInsert + ')';
                const functionItem = {
                    label: item.name,
                    kind: monaco.languages.CompletionItemKind.Function,
                    insertText: insertText,
                    insertTextRules: monaco.languages.CompletionItemInsertTextRule.InsertAsSnippet,
                    parameters: item.parameters,
                    return: returnType,
                    type: "function",
                    documentation: (docParams.length > 0 ? `Parameters: ${docParams.join(', ')}\n` : '') + `Return: ${returnType}`,
                    detail: item.name,
                };


                if (!sug.some(s => s.label === functionItem.label)) {
                    sug.push(functionItem);
                }
            }
            updateImports(editor.getModel());
            for (let x = 0; x < sug.length; x++) {
                functionSignatures[sug[x].label] = sug[x].parameters.map((param, index) => param.name);
            }
            // filter empty signatures
            for (let [key, value] of Object.entries(functionSignatures)) {
                if (value.length === 0) {
                    delete functionSignatures[key];
                }
            }

            let classNamesSet = new Set();  // Usado para verificar duplicatas

            for (let i = 0; i < provider["classes"].length; i++) {
                let item = provider["classes"][i];
                let insertText = item["class"];

                if (item["name"] === "__construct") {
                    if (item["parameters"].length > 0) {
                        insertText += "(" + formatParameters(item.parameters) + ")";
                    } else {
                        insertText += "()";
                    }

                    if (!classNamesSet.has(insertText)) {
                        sug.push(createCompletionItem(item, insertText, "Class"));
                        classNamesSet.add(insertText);
                    }
                } else {

                    if (item['type'] !== 'property') {

                        insertText += "::" + item["name"];
                        if (item["parameters"].length > 0) {
                            insertText += "(" + formatParameters(item.parameters) + ")";
                        } else {
                            insertText += "()";
                        }


                        if (!classNamesSet.has(insertText)) {
                            sug.push(createCompletionItem(item, insertText, "Method"));
                            classNamesSet.add(insertText);
                        }
                    } else {


                        let propertyItem = {
                            label: item["class"] + "::" + item["name"],
                            kind: monaco.languages.CompletionItemKind.Property,
                            insertText: item["name"],
                            insertTextRules:
                            monaco.languages.CompletionItemInsertTextRule
                                .InsertAsSnippet,
                            documentation: '$' + item["name"] + ': ' + item['returnType'],

                            detail: item["class"],
                        };
                        if (!sug.some(s => s.label === propertyItem.label)) {
                            sug.push(propertyItem);
                        }

                    }
                }
            }


            for (let i = 0; i < provider["constants"].length; i++) {
                let item = provider["constants"][i];
                let constantItem = {
                    label: item["name"],
                    kind: monaco.languages.CompletionItemKind.Constant,
                    insertText: item["name"],
                    insertTextRules:
                    monaco.languages.CompletionItemInsertTextRule
                        .InsertAsSnippet,
                    documentation: "",
                    detail: item["name"],
                };
                let check = false;
                for (let x = 0; x < sug.length; x++) {
                    if (sug[x].label === constantItem.label) {
                        check = true;
                    }
                }
                if (!check) sug.push(constantItem);
            }


            for (let x = 0; x < sug.length; x++) {
                for (let [key, value] of Object.entries(importedClasses)) {
                    if (sug[x].label.split("\\").pop().includes(key)) {
                        try {
                            functionSignatures[sug[x].label.split("\\").pop()] =
                                sug[x].parameters.map(
                                    (param, index) => param.name,
                                );
                        } catch (e) {
                        }
                    }
                }

                if (importedClasses[sug[x].label.split("\\").pop()]) {
                    try {
                        functionSignatures[sug[x].label.split("\\").pop()] =
                            sug[x].parameters.map((param, index) => param.name);
                    } catch (e) {
                    }
                }
                try {
                    functionSignatures[sug[x].label] = sug[x].parameters.map(
                        (param, index) => param.name,
                    );
                } catch (e) {
                }
            }

            for (let [key, value] of Object.entries(functionSignatures)) {
                if (value.length === 0) {
                    delete functionSignatures[key];
                }
            }
            codeInfo = {};
            try {
                codeInfo = await fetch(
                    "/phpParser?tokenBrowser=" + $("#fp").text(),
                    {
                        method: "POST",
                        body: JSON.stringify({
                            search: "all",
                            lineContent: "",
                            nameFile: $("#hiddenFileEdit").text(),
                        }),
                    },
                ).then(async (response) => await response.json());
            } catch (e) {
                console.log(e);
                sug = [];
                functionSignatures = {};
                codeInfo = {};
                hints = [];
                return;
            }
            let classKeys = Object.keys(codeInfo);
            for (let i = 0; i < classKeys.length; i++) {
                let classKey = classKeys[i];
                let className = codeInfo[classKey]["class"];
                if (className === "") continue;
                let filter = sug.filter((item) => {
                    if (item.detail)
                        if (item.detail.includes(className)) return true;
                });
                if (filter.length > 0) {
                    filter.map((item) => {
                        functionSignatures[
                            `$${classKey}->${item.label.split("::").pop()}`
                            ] = item.parameters.map((param, index) => param.name);
                    });
                }
            }
        }

        function debounce(func, wait) {
            return function (...args) {
                clearTimeout(debounceTimeout);
                debounceTimeout = setTimeout(
                    () => func.apply(this, args),
                    wait,
                );
            };
        }

        function getHtmlElementFromLine(lineNumber) {
            const marginViewOverlays = document.querySelectorAll(
                ".monaco-editor .margin-view-overlays .line-numbers",
            );
            const viewLines = document.querySelectorAll(
                ".monaco-editor .view-lines .view-line",
            );
            for (let i = 0; i < marginViewOverlays.length; i++) {
                const lineNumberElement = marginViewOverlays[i];
                if (parseInt(lineNumberElement.textContent) === lineNumber) {
                    return viewLines[i];
                }
            }
            return null;
        }

                            if (tabsCache[nameFile]) {
                                delete tabsCache[nameFile]; // remove a aba do cache
                            }
                            if (positions[nameFile]) {
                                delete positions[nameFile]; // remove a posição do cursor do cache
                            }
                        };

                        newTab.appendChild(closeBtn);

// ação ao clicar na aba
                        newTab.onclick = function () {
                            $('#nameFileForEdit').text(nameFile);
                            $('#hiddenFileEdit').text(nameFile);
                            $('#namefilemodaledit').text(nameFile);

                            let tabs = document.getElementsByClassName("tab-header-item");
                            for (let i = 0; i < tabs.length; i++) {
                                tabs[i].classList.remove("active");
                            }
                            newTab.classList.add("active");
                            $('#searchFiles').text(nameFile);
                            
                            // Atualizar título do modal com o nome do arquivo atual (estilo PhpStorm)
                            document.querySelector('.modal-title').innerHTML = `Editor - <span style="color: #A1A8B3">${getFilename(nameFile)}</span>`;

                            if (positions[nameFile]) {
                                editor.setPosition(positions[nameFile]);
                                editor.revealPosition(positions[nameFile]);
                            } else {
                                editor.setPosition({lineNumber: 1, column: 1});
                            }
                        };

                        document.getElementById('tabsFilesEditor').appendChild(newTab);

                        let tabs = document.getElementsByClassName("tab-header-item");
                        for (let i = 0; i < tabs.length; i++) {
                            tabs[i].classList.remove("active");
                        }

                        tabsForFiles.before(newTab);
                        tabsCache[nameFile] = newTab;
                        window.blockingMonitor = true;
                        newTab.click(); // Selecionar a nova aba automaticamente
                        window.blockingMonitor = false;
                        // posicionar o cursor na posição salva
                        if (positions[nameFile]) {
                            editor.setPosition(positions[nameFile]);
                            editor.revealPosition(positions[nameFile]);
                        } else {
                            editor.setPosition({lineNumber: 1, column: 1});
                        }

                    }


                    //else models[nameFile].setValue(fileContent);
                    editor.setModel(models[nameFile]);
                    editor.focus();
                    if (positions[nameFile]) {
                        editor.setPosition(positions[nameFile]);
                        editor.revealPosition(positions[nameFile]);
                    } else {
                        editor.setPosition({lineNumber: 1, column: 1});
                    }

                    // tabsCache[nameFile].click();

                    inlayHintsProvider.dispose();
                    codeActionsProvider.dispose();
                    completionProvider.dispose();
                    registerInlayHints().then(async () => {
                        await updateImports(editor.getModel());
                        await registerCodeActions();
                        await registerCompletionProvider();
                        await updateProviders();
                        inlayHintsProvider.dispose();
                        await registerInlayHints();
                    });


                    /** <div class="tab-header-item active">
                     utilsFunction.php
                     <span class="close-tab" onclick="closeTab(this)">×</span>
                     </div>
                     <div class="tab-header-item">
                     modalEditCode.html
                     <span class="close-tab" onclick="closeTab(this)">×</span>
                     </div>*/


                }
            }
        });

        const config = {attributes: false, childList: true, subtree: false};
        observer.observe(target, config);
    });
</script>
