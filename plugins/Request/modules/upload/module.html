<div class="modal fade" id="modalFileUpload" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-xl" role="document">
        <div class="modal-content headerModal" style="border-bottom: none; border-radius: 13px !important;">
            <div class="modal-header" style="border: none !important;" onclick="$('#modalFileUpload').modal('hide')">
                <i class="fa-duotone fa-circle-xmark fa-2xl mt-2"></i>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col col-sm-12">
                        <div class="card" style="background: transparent !important; border: none !important;">
                            <div id="drop-area"
                                 style="border: 2px dashed #007bff;border-radius: 20px;width: 400px;margin: 50px auto;padding: 20px;position: relative;text-align: center;">
                                <i class="fa-duotone fa-upload fa-2x text-blue"></i>
                                <h3 class="text-blue mt-2">Arraste ou clique</h3>
                                <code>Limite máximo de upload: 2GB*</code>
                                <input type="file" id="file-input" name="files[]"
                                       style="opacity: 0;position: absolute;width: 100%;height: 100%;cursor: pointer;top: 0;left: 0;display: none;"
                                       multiple/>
                            </div>

                            <div>
                                <p class="text-center text-white">
                                <h4>
                                    <span class="text-white">Progresso atual: </span>
                                    <span class="text-info text-decoration-underline link-underline-opacity-25"
                                          id="valueUploadProgress">0%</span>
                                </h4>
                                </p>
                                <div class="progress mb-5" style="height: 20px; margin-top: -10px;">
                                    <div class="progress-bar progress-bar-striped progress-bar-animated bg-success"
                                         role="progressbar"
                                         id="progressBarUpload"
                                         aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"
                                         style="width: 0%"></div>
                                </div>
                            </div>


                            <script>

                                const dropArea = document.getElementById('drop-area');
                                const fileInput = document.getElementById('file-input');

                                dropArea.addEventListener('dragover', (event) => {
                                    event.stopPropagation();
                                    event.preventDefault();
                                    event.dataTransfer.dropEffect = 'copy';
                                });

                                dropArea.addEventListener('drop', handleFiles, false);
                                fileInput.addEventListener('change', handleFiles, false);

                                function handleFiles(event) {
                                    let files;
                                    if (event.type === "drop") {
                                        event.stopPropagation();
                                        event.preventDefault();
                                        files = event.dataTransfer.files;
                                    } else {
                                        files = event.target.files;
                                    }

                                    if (!files.length) return;
                                    const list = document.createDocumentFragment();
                                    const formData = new FormData();
                                    for (const file of files) {
                                        const item = document.createElement('li');
                                        item.textContent = file.name;
                                        list.appendChild(item);
                                        formData.append('files[]', file);
                                    }
                                    document.getElementById('file-list').appendChild(list);
                                    $('#progressBarUpload').css('width', '0%').text('0%');
                                    $('#valueUploadProgress').text('0%');
                                    const tokenBrowser = document.getElementById('fp').textContent.trim();
                                    const pathUsing = document.getElementById('pathInvisible').textContent;
                                    $.ajax({
                                        url: `/uploadFile?tokenBrowser=${encodeURIComponent(tokenBrowser)}&path=${encodeURIComponent(pathUsing)}`,
                                        type: 'POST',
                                        data: formData,
                                        processData: false,
                                        contentType: false,
                                        dataType: 'json',
                                        xhr: function () {
                                            var xhr = new window.XMLHttpRequest();
                                            xhr.upload.addEventListener("progress", function (evt) {
                                                if (evt.lengthComputable) {
                                                    var percentComplete = evt.loaded / evt.total;
                                                    percentComplete = parseInt(percentComplete * 100);
                                                    $('#progressBarUpload').css('width', percentComplete + '%').attr('aria-valuenow', percentComplete);
                                                    $('#progressBarUpload').html(percentComplete + '%');
                                                    $('#valueUploadProgress').html(percentComplete + '%');
                                                    if (percentComplete === 100) {
                                                        Swal.fire({
                                                            background: '#1c2f48',
                                                            title: `<img src="https://i.gifer.com/47tj.gif" width="200px">`,
                                                            color: '#fff',
                                                            html: `<h3 class="text-white">Enviando arquivos...</h3>`,
                                                            showConfirmButton: false,
                                                            allowOutsideClick: false,
                                                            allowEscapeKey: false,
                                                            allowEnterKey: false,
                                                            onBeforeOpen: () => {
                                                                Swal.showLoading();
                                                            },
                                                        });
                                                    }
                                                }
                                            }, false);
                                            return xhr;
                                        },
                                        error: function () {
                                            Swal.fire({icon: 'error', title: 'Falha no upload', text: 'Não foi possível concluir o envio. Verifique a conexão e tente novamente.', background: '#1c2f48', color: '#fff'});
                                        },
                                        success: async function (data) {
                                            if (!data || data.success !== true) {
                                                this.error();
                                                return;
                                            }
                                            Swal.close();
                                            Swal.fire({
                                                icon: 'success',
                                                title: 'Sucesso',
                                                background: '#1c2f48',
                                                color: '#fff',
                                                text: 'Arquivos enviados com sucesso!',
                                                showConfirmButton: false,
                                                allowOutsideClick: false,
                                                allowEscapeKey: false,
                                                allowEnterKey: false,
                                                timer: 2000,
                                                timerProgressBar: true,
                                                onBeforeOpen: () => {
                                                    Swal.showLoading();
                                                },
                                            });
                                            const fopenDynamicToken = $('#fp').text();
                                            const pathUsing = $('#pathInvisible').text();
                                            (async () => {
                                                setItemsInTbody(await (await asyncGet(`/syncPath?tokenBrowser=${encodeURIComponent(fopenDynamicToken)}&path=${encodeURIComponent(pathUsing)}`))['information'], 'filesList')
                                            })().then(r => {});
                                            $('#modalFileUpload').modal('hide');
                                            $('#file-list').html('');
                                        }
                                    });


                                }

                                dropArea.addEventListener('click', () => fileInput.click());
                            </script>
                        </div>

                    </div>

                    <center>


                        <p class="d-inline-flex gap-1">
                            <button class="btn btn-midnight text-white" type="button" data-bs-toggle="collapse"
                                    data-bs-target="#collapseExample" aria-expanded="false"
                                    aria-controls="collapseExample">
                                exibir/ocultar lista de arquivos
                            </button>
                        </p>


                        <div class="collapse show" id="collapseExample">
                            <div class="card card-body card-distak">
                                <ul id="file-list"></ul>
                            </div>
                        </div>
                    </center>
                </div>


            </div>
        </div>
    </div>
</div>

<script>

</script>
