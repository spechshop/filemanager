    async function asyncGet(url) {
        try {
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`Request failed with status: ${response.status}`);
            }
            const data = await response.json();
            if (data.success && typeof data.currentPath === 'string') {
                const current = document.getElementById('pathInvisible');
                if (current && current.textContent !== data.currentPath) {
                    current.textContent = data.currentPath;
                    localStorage.setItem('pathInvisible', data.currentPath);
                    FMUI.breadcrumbs(document.getElementById('visualPath'), data.currentPath, setPath);
                }
            }
            return data;
        } catch (error) {
            console.error('Error during GET request:', error);
            throw error;
        }
    }

    let metricsSocket = null;
    let metricsConnecting = false;
    let metricsRequestTimer = null;
    let metricsReconnectTimer = null;

    async function wsConnect() {
        if (metricsConnecting || (metricsSocket && metricsSocket.readyState < WebSocket.CLOSING)) return;
        clearTimeout(metricsReconnectTimer);
        const hostname = window.location.port ? `${window.location.hostname}:${parseInt(window.location.port)}` : window.location.hostname;
        const token = ($('#fp').text() || '').trim();
        // The ticket service exchanges this identity before the external handshake.
        const wsPath = token ? `/${encodeURIComponent(token)}` : '/';
        const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
        let ws;
        metricsConnecting = true;
        try { ws = new WebSocket(await FMAuth.socketUrl(`${protocol}://${hostname}${wsPath}`)); }
        catch (error) { if (FMAuth.shouldRetry(error)) metricsReconnectTimer = setTimeout(wsConnect, 3000); return; }
        finally { metricsConnecting = false; }
        metricsSocket = ws;
        ws.onopen = function (event) {
            toast('Conectado ao servidor', 'Bem vindo', 3000, 'success');

            ws.send(JSON.stringify({
                token: token || $('#fp').text()
            }));
        };
        ws.onmessage = function (event) {
            let data;
            try {
                data = JSON.parse(event.data);
            } catch (e) {
                return;
            }
            if (data.success && data.disk && data.memory && data.cpu) {
                clearTimeout(metricsRequestTimer);
                metricsRequestTimer = setTimeout(() => {
                    if (metricsSocket === ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({token: token || $('#fp').text()}));
                    }
                }, 1000);
                $('#totalDisk').text(`${data['disk']['total_space']} ${data['disk']['unit']}`);
                $('#diskUsed').text(`${data['disk']['used_space']} ${data['disk']['unit']}`);
                $('#freeDisk').text(`${data['disk']['free_space']} ${data['disk']['unit']}`);
                $('#progressDisk').css('width', `${data['disk']['used_percentage']}%`);
                $('#progressDisk').attr('class', `progress-bar ${data['disk']['background']}`);

                $('#totalMem').text(`${data['memory']['total_mem']} ${data['memory']['unit']}`);
                $('#memUsed').text(`${data['memory']['used_mem']} ${data['memory']['unit']}`);
                $('#memFree').text(`${data['memory']['free_mem']} ${data['memory']['unit']}`);
                $('#progressMem').css('width', `${data['memory']['used_percentage']}%`);
                $('#progressMem').attr('class', `progress-bar ${data['memory']['background']}`);

                $('#cpuName').text(data['cpu']['name']);
                $('#cpuUsed').text(`${data['cpu']['usage']} %`);
                $('#progressCpu').css('width', `${data['cpu']['usage']}%`);
                $('#freeCpu').text(`${parseFloat(100 - data['cpu']['usage'])} %`);
                $('#progressCpu').attr('class', `progress-bar ${data['cpu']['background']}`);
            }
        };
        ws.onclose = function () {
            if (metricsSocket !== ws) return;
            metricsSocket = null;
            clearTimeout(metricsRequestTimer);
            if (FMAuth.shouldRetry()) metricsReconnectTimer = setTimeout(wsConnect, 3000);
        };
        ws.onerror = function (error) {
            return bootstrap.showToast({
                header: 'Erro',
                body: 'Não foi possível conectar ao servidor',
                toastClass: "bg-danger text-white",
                colorHeader: 'text-white',
            });
        };
    }

    // Funções para sortable na tabela de arquivos
    window.parseSizeToBytes = function(sizeStr) {
        if (!sizeStr) return 0;
        const match = sizeStr.match(/([\d.,]+)\s*([A-Za-z]+)/);
        if (!match) return 0;
        let num = parseFloat(match[1].replace(',', '.'));
        const unit = match[2].toUpperCase();
        const multipliers = {
            'B': 1,
            'KB': 1024,
            'MB': 1024 * 1024,
            'GB': 1024 * 1024 * 1024,
            'TB': 1024 * 1024 * 1024 * 1024
        };
        return num * (multipliers[unit] || 1);
    };

    window.parseDateToTimestamp = function(dateStr) {
        if (!dateStr) return 0;
        const parts = dateStr.match(/(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2}):(\d{2})/);
        if (!parts) return 0;
        const [_, d, m, y, h, min, s] = parts;
        return new Date(y, m - 1, d, h, min, s).getTime();
    };

    window.currentSortState = { column: null, direction: 'asc' };

    window.sortFileTable = function(column, direction = null) {
        if (!window.currentFileItems || !Array.isArray(window.currentFileItems)) {
            console.warn('Nenhum dado de arquivos para ordenar');
            return;
        }
        let asc;
        if (direction !== null) {
            asc = direction === 'asc';
        } else {
            if (window.currentSortState && window.currentSortState.column === column) {
                asc = !(window.currentSortState.direction === 'asc');
            } else {
                asc = true;
            }
        }
        window.currentSortState = { column: column, direction: asc ? 'asc' : 'desc' };
        const sortedItems = [...window.currentFileItems].sort((a, b) => {
            let valA, valB;
            let compareResult = 0;
            if (column === 'name') {
                valA = a.name || '';
                valB = b.name || '';
                compareResult = valA.localeCompare(valB, 'pt', {sensitivity: 'base'});
            } else if (column === 'size') {
                valA = window.parseSizeToBytes(a.size);
                valB = window.parseSizeToBytes(b.size);
                compareResult = valA - valB;
            } else if (column === 'lastModified') {
                valA = window.parseDateToTimestamp(a.lastModified);
                valB = window.parseDateToTimestamp(b.lastModified);
                compareResult = valA - valB;
            } else if (column === 'type') {
                valA = (a.typeFile === 'folder' ? 'Pasta' : (a.typeFile || '').toUpperCase());
                valB = (b.typeFile === 'folder' ? 'Pasta' : (b.typeFile || '').toUpperCase());
                compareResult = valA.localeCompare(valB, 'pt', {sensitivity: 'base'});
            } else if (column === 'permissions') {
                valA = a.permissions || '';
                valB = b.permissions || '';
                compareResult = valA.localeCompare(valB);
            } else {
                return 0;
            }
            return asc ? compareResult : -compareResult;
        });
        setItemsInTbody(sortedItems, 'filesList');
    };

    async function renameItem(path) {
        var splp = path;
        let replacer;
        const nameforRenamed = splp.split('/')[splp.split('/').length - 1];
        return (await Swal.fire({
            title: 'Renomear item',
            input: 'text',
            inputLabel: `Renomeando: (${nameforRenamed})`,
            color: '#fff',
            inputPlaceholder: 'Digite o novo nome',
            inputValue: nameforRenamed,
            showCancelButton: true,
            confirmButtonText: 'Renomear',
            cancelButtonText: 'Cancelar',
            confirmButtonColor: '#7367f0',
            cancelButtonColor: '#424659',
            background: '#24283b',
            inputValidator: (value) => {
                if (!value) {
                    return 'Você precisa digitar um nome';
                }
            }
        }).then((result) => {
            if (result.isConfirmed) {
                const renameStatusFunction = (path, newName) => {
                    const toke = $('#fp').text();
                    replacer = path.replace(nameforRenamed, newName);





                    fetch(`renameItem?tokenBrowser=${toke}&path=${encodeURIComponent(path)}&newName=${encodeURIComponent(replacer)}`)
                        .then(async response => await response.json())
                        .then(async data => {
                            if (data.success) {
                                Swal.fire({
                                    icon: 'success',
                                    title: 'Sucesso!',
                                    text: 'Seu arquivo foi renomeado com sucesso!',
                                    showConfirmButton: false,
                                    color: '#fff',
                                    confirmButtonColor: '#7367f0',
                                    cancelButtonColor: '#424659',
                                    background: '#24283b',
                                    timer: 2000
                                });
                            }
                            console.log(data)
                            const fopenDynamicToken = $('#fp').text();
                            const pathUsing = $('#pathInvisible').text();
                            setItemsInTbody(
                                (await asyncGet(`/syncPath?tokenBrowser=${fopenDynamicToken}&path=${pathUsing}`))['information'],
                                'filesList'
                            );
                        });
                }
                renameStatusFunction(path, result.value);
            }
            return replacer;
        }));
    }

    let mediaViewerRequest = 0;
    const imageZoom = {scale: 1, x: 0, y: 0, drag: null};

    function resetBoxMedias() {
        document.querySelectorAll('#modalMedia video, #modalMedia audio').forEach(media => {
            media.pause();
            media.removeAttribute('src');
            media.querySelectorAll('source').forEach(source => source.removeAttribute('src'));
            media.load();
        });
        document.getElementById('modalMedia').innerHTML = '';
        document.getElementById('modalAudio').innerHTML = '';
        resetImageZoom();
        document.getElementById('imageZoomControls').hidden = true;
    }

    function applyImageZoom() {
        const image = document.getElementById('viewerImage');
        if (!image) return;
        const maxX = image.clientWidth * (imageZoom.scale - 1) / 2;
        const maxY = image.clientHeight * (imageZoom.scale - 1) / 2;
        imageZoom.x = Math.max(-maxX, Math.min(maxX, imageZoom.x));
        imageZoom.y = Math.max(-maxY, Math.min(maxY, imageZoom.y));
        image.style.transform = `translate(${imageZoom.x}px, ${imageZoom.y}px) scale(${imageZoom.scale})`;
        image.style.cursor = imageZoom.scale === 1 ? 'zoom-in' : imageZoom.drag ? 'grabbing' : 'grab';
        document.getElementById('imageZoomLevel').textContent = `${Math.round(imageZoom.scale * 100)}%`;
        document.getElementById('imageZoomOut').disabled = imageZoom.scale <= 1;
        document.getElementById('imageZoomIn').disabled = imageZoom.scale >= 8;
    }

    function changeImageZoom(delta) {
        imageZoom.scale = Math.max(1, Math.min(8, imageZoom.scale + delta));
        applyImageZoom();
    }

    function resetImageZoom() {
        imageZoom.scale = 1;
        imageZoom.x = imageZoom.y = 0;
        imageZoom.drag = null;
        applyImageZoom();
    }

    function enableImageZoom(image) {
        document.getElementById('imageZoomControls').hidden = false;
        applyImageZoom();
        image.onload = () => {
            if (!image.isConnected || image !== document.getElementById('viewerImage')) return;
            applyImageZoom();
            document.getElementById('mediaFileDetails').textContent = `${image.alt.split('.').pop().toUpperCase()} · ${image.naturalWidth} × ${image.naturalHeight} px`;
        };
        image.ondblclick = () => imageZoom.scale > 1 ? resetImageZoom() : changeImageZoom(1);
        image.onpointerdown = event => {
            if (imageZoom.scale <= 1 || event.button !== 0) return;
            event.preventDefault();
            imageZoom.drag = {id: event.pointerId, x: event.clientX, y: event.clientY};
            image.setPointerCapture(event.pointerId);
            applyImageZoom();
        };
        image.onpointermove = event => {
            const drag = imageZoom.drag;
            if (!drag || drag.id !== event.pointerId) return;
            imageZoom.x += event.clientX - drag.x;
            imageZoom.y += event.clientY - drag.y;
            drag.x = event.clientX;
            drag.y = event.clientY;
            applyImageZoom();
        };
        image.onpointerup = image.onpointercancel = image.onlostpointercapture = () => {
            imageZoom.drag = null;
            applyImageZoom();
        };
    }

    function handleImageViewerWheel(event) {
        if (!document.getElementById('viewerImage') || !event.deltaY) return;
        event.preventDefault();
        changeImageZoom(event.deltaY < 0 ? 0.25 : -0.25);
    }

    function handleImageViewerKey(event) {
        if (event.key === 'Escape') {
            event.preventDefault();
            event.stopPropagation();
            closeImageViewer();
            return;
        }
        if (event.key === 'Tab') {
            const viewer = document.getElementById('customImageViewer');
            const controls = [...viewer.querySelectorAll('button:not(:disabled), input, video[controls], audio[controls]')]
                .filter(node => node.getClientRects().length > 0 && !node.closest('[hidden]'));
            const first = controls[0];
            const last = controls[controls.length - 1];
            if (first && ((event.shiftKey ? document.activeElement === first : document.activeElement === last)
                || !viewer.contains(document.activeElement))) {
                event.preventDefault();
                (event.shiftKey ? last : first).focus();
            }
            return;
        }
        if (event.ctrlKey || event.metaKey || event.altKey
            || (event.target instanceof Element && event.target.closest('input, textarea, select, [contenteditable], audio, video'))) return;
        if (document.getElementById('customImageViewer').classList.contains('gallery-expanded')) return;
        const actions = {
            ArrowLeft: navPrev, ArrowRight: navNext,
            '+': () => changeImageZoom(0.25), '=': () => changeImageZoom(0.25),
            '-': () => changeImageZoom(-0.25), '0': resetImageZoom,
        };
        if (!Object.hasOwn(actions, event.key)) return;
        event.preventDefault();
        event.stopPropagation();
        actions[event.key]();
    }

    let mediaGallerySession = null;
    let mediaViewerFocus = null;
    let mediaViewerBodyOverflow = '';

    function getMediaKind(file) {
        const ext = file.split('.').pop().toLowerCase();
        return ['mp4', 'webm', 'ogg'].includes(ext) ? 'video' : ['mp3', 'wav'].includes(ext) ? 'audio' : 'image';
    }

    function disposeMediaGallery() {
        if (!mediaGallerySession) return;
        mediaGallerySession.cancelled = true;
        mediaGallerySession.observer?.disconnect();
        mediaGallerySession.queue.length = 0;
        mediaGallerySession = null;
    }

    function renderMediaThumbnails(mediaFileList) {
        disposeMediaGallery();
        const thumbNav = document.getElementById('thumbNav');
        thumbNav.replaceChildren();
        const session = {cancelled: false, queue: [], active: 0, observer: null, buttons: []};
        mediaGallerySession = session;
        const pump = () => {
            while (!session.cancelled && session.active < 4 && session.queue.length) {
                const {file, preview, kind} = session.queue.shift();
                ++session.active;
                FMAuth.mediaUrl(file, kind === 'video' ? 'getPreview' : 'imageBase64').then(url => {
                    if (session.cancelled || !preview.isConnected) return;
                    const image = document.createElement('img');
                    image.alt = '';
                    image.decoding = 'async';
                    image.onload = () => {
                        if (!session.cancelled && preview.isConnected) preview.replaceChildren(image);
                    };
                    image.src = url;
                }).catch(() => {}).finally(() => {
                    --session.active;
                    pump();
                });
            }
        };
        const enqueue = button => {
            if (session.cancelled || button.dataset.queued || button.dataset.kind === 'audio') return;
            button.dataset.queued = 'true';
            session.queue.push({file: button.dataset.path, kind: button.dataset.kind, preview: button.querySelector('.media-thumbnail-preview')});
            pump();
        };
        if (typeof IntersectionObserver === 'function') {
            session.observer = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    if (!entry.isIntersecting) return;
                    enqueue(entry.target);
                    session.observer.unobserve(entry.target);
                });
            }, {root: thumbNav, rootMargin: '200px'});
        }
        const fragment = document.createDocumentFragment();
        mediaFileList.forEach(file => {
            const kind = getMediaKind(file);
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'media-thumbnail';
            button.dataset.path = file;
            button.dataset.kind = kind;
            button.title = getFilename(file);
            button.setAttribute('aria-label', `Abrir ${getFilename(file)}`);
            button.setAttribute('aria-current', 'false');
            const preview = document.createElement('span');
            preview.className = 'media-thumbnail-preview';
            preview.textContent = kind === 'audio' ? '♫' : kind === 'video' ? '▶' : '▧';
            const name = document.createElement('span');
            name.className = 'media-thumbnail-name';
            name.textContent = getFilename(file);
            const type = document.createElement('span');
            type.className = 'media-thumbnail-type';
            type.textContent = file.split('.').pop().toUpperCase();
            button.append(preview, name, type);
            button.onclick = () => showImage(file);
            fragment.appendChild(button);
            session.buttons.push(button);
        });
        thumbNav.appendChild(fragment);
        session.buttons.forEach(button => session.observer ? session.observer.observe(button) : enqueue(button));
        document.getElementById('mediaGallerySearch').value = '';
        filterMediaGallery('all');
    }

    function filterMediaGallery(kind) {
        const gallery = document.getElementById('mediaGallery');
        if (kind) gallery.dataset.filter = kind;
        const query = document.getElementById('mediaGallerySearch').value.trim().toLocaleLowerCase();
        let count = 0;
        for (const button of mediaGallerySession?.buttons || []) {
            button.hidden = !((gallery.dataset.filter === 'all' || button.dataset.kind === gallery.dataset.filter)
                && getFilename(button.dataset.path).toLocaleLowerCase().includes(query));
            if (!button.hidden) ++count;
        }
        gallery.querySelectorAll('[data-media-filter]').forEach(button => {
            button.setAttribute('aria-pressed', String(button.dataset.mediaFilter === gallery.dataset.filter));
        });
        document.getElementById('mediaGalleryCount').textContent = `${count} ${count === 1 ? 'arquivo' : 'arquivos'}`;
        document.getElementById('mediaGalleryEmpty').hidden = count !== 0;
    }

    function setMediaGalleryMode(expanded) {
        const viewer = document.getElementById('customImageViewer');
        viewer.classList.toggle('gallery-expanded', expanded);
        const button = document.getElementById('mediaGalleryToggle');
        button.setAttribute('aria-pressed', String(expanded));
        button.textContent = expanded ? 'Ver mídia' : 'Ver galeria';
        if (expanded) document.getElementById('mediaGallerySearch').focus({preventScroll: true});
    }

    function updateMediaGallerySelection(path) {
        let selected;
        for (const button of mediaGallerySession?.buttons || []) {
            const active = button.dataset.path === path;
            button.setAttribute('aria-current', String(active));
            if (active) selected = button;
        }
        if (selected && !selected.hidden && typeof selected.scrollIntoView === 'function') {
            selected.scrollIntoView({block: 'nearest'});
        }
    }

    async function toggleMediaFullscreen() {
        const viewer = document.getElementById('customImageViewer');
        try {
            if (document.fullscreenElement === viewer) await document.exitFullscreen();
            else if (viewer.requestFullscreen) await viewer.requestFullscreen();
        } catch (error) {
            // The viewer still fills the browser viewport if fullscreen is unavailable.
        }
    }

    async function showImage(path) {
        const request = ++mediaViewerRequest;
        const viewer = document.getElementById('customImageViewer');
        const modalMedia = document.getElementById('modalMedia');
        const wasOpen = viewer.style.display !== 'none';
        if (!wasOpen) {
            mediaViewerFocus = document.activeElement;
            mediaViewerBodyOverflow = document.body.style.overflow;
            document.body.style.overflow = 'hidden';
        }
        const wasGallery = viewer.classList.contains('gallery-expanded');
        setMediaGalleryMode(false);
        resetBoxMedias();
        $('#nameFileModalMedia').text(path);
        const ext = path.split('.').pop().toLowerCase();
        const mediaFileList = wasOpen && Array.isArray(window.__fileList)
            ? window.__fileList : Array.isArray(window.fileList) ? window.fileList.slice() : [];
        if (!mediaFileList.includes(path)) mediaFileList.push(path);
        const currentIndex = mediaFileList.indexOf(path);
        window.__fileList = mediaFileList;
        window.__currentIndex = currentIndex;
        toggleArrowButtons();
        viewer.style.display = 'block';
        document.getElementById('mediaFolderPath').textContent = path.slice(0, path.lastIndexOf('/')) || '/';
        document.getElementById('mediaFilePosition').textContent = `${currentIndex + 1} de ${mediaFileList.length}`;
        document.getElementById('mediaFileDetails').textContent = ext.toUpperCase();
        document.getElementById('mediaFullscreenButton').hidden = !document.fullscreenEnabled;
        if (!wasOpen || wasGallery) document.getElementById('mediaViewerClose').focus({preventScroll: true});
        modalMedia.innerHTML = '<p role="status">Carregando mídia…</p>';
        modalMedia.addEventListener('wheel', handleImageViewerWheel, {passive: false});
        window.addEventListener('keydown', handleImageViewerKey, true);

        let url;
        try {
            const mediaUrl = FMAuth.mediaUrl(path);
            if (!wasOpen) renderMediaThumbnails(mediaFileList);
            updateMediaGallerySelection(path);
            url = await mediaUrl;
        } catch (error) {
            if (request === mediaViewerRequest) {
                modalMedia.innerHTML = '<p role="alert">Não foi possível carregar a mídia. Tente abrir o arquivo novamente.</p>';
            }
            return;
        }
        // Navigation and closing invalidate pending authorization requests.
        if (request !== mediaViewerRequest) return;

        let media = '';
        if (['mp4', 'webm', 'ogg'].includes(ext)) {
            media = `<video src="${FMUI.html(url)}" controls autoplay style="max-width:100%;max-height:100%;border-radius:15px;box-shadow:0 20px 40px rgba(0,0,0,0.4);background:#000;outline:none;"></video>`;
        } else if (['mp3', 'wav'].includes(ext)) {
            document.querySelector('title').innerText = getFilename(path);
            media = `
<div class="modern-audio-container">
<dotlottie-player class="modern-audio-artwork" src="https://lottie.host/ca316c43-00ba-458e-9070-f94fb0a10c1a/yBA3TkFfHx.json" background="transparent" speed="1" loop autoplay></dotlottie-player>
<div class="modern-audio-details">
<p class="modern-audio-filename">${FMUI.html(getFilename(path))}</p>
<div class="native-audio-player-frame">
<audio class="native-audio-player" controls preload="metadata">
<source src="${FMUI.html(url)}" type="audio/${ext}">
Seu navegador não oferece suporte ao player de áudio.
</audio>
</div>
</div>
</div>
`;
        } else if (['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp', 'svg'].includes(ext)) {
            media = `<img id="viewerImage" src="${FMUI.html(url)}" alt="${FMUI.html(getFilename(path))}" draggable="false">`;
        } else {
            media = '<p>Formato não suportado</p>';
        }
        modalMedia.innerHTML = media;
        const image = document.getElementById('viewerImage');
        if (image) enableImageZoom(image);
        const mediaElement = modalMedia.querySelector('img, video, audio');
        if (mediaElement) mediaElement.onerror = () => {
            if (request !== mediaViewerRequest) return;
            resetBoxMedias();
            modalMedia.innerHTML = '<p role="alert">Não foi possível exibir este arquivo.</p>';
        };
    }

    function navPrev() {
        if (Array.isArray(window.__fileList) && window.__currentIndex > 0) {
            return showImage(window.__fileList[window.__currentIndex - 1]);
        }
    }

    function navNext() {
        if (Array.isArray(window.__fileList)
            && window.__currentIndex >= 0
            && window.__currentIndex < window.__fileList.length - 1) {
            return showImage(window.__fileList[window.__currentIndex + 1]);
        }
    }

    function toggleArrowButtons() {
        const hasMediaList = Array.isArray(window.__fileList);
        const canNavigate = hasMediaList && window.__currentIndex >= 0;
        const leftArrow = document.getElementById('leftArrow');
        const rightArrow = document.getElementById('rightArrow');

        leftArrow.disabled = !canNavigate || window.__currentIndex === 0;
        rightArrow.disabled = !canNavigate || window.__currentIndex === window.__fileList.length - 1;
        leftArrow.style.opacity = leftArrow.disabled ? '0.4' : '1';
        rightArrow.style.opacity = rightArrow.disabled ? '0.4' : '1';
    }

    function closeImageViewer() {
        ++mediaViewerRequest;
        const viewer = document.getElementById('customImageViewer');
        viewer.style.display = 'none';
        if (document.fullscreenElement === viewer) document.exitFullscreen().catch(() => {});
        resetBoxMedias();
        disposeMediaGallery();
        document.getElementById('thumbNav').replaceChildren();
        window.removeEventListener('keydown', handleImageViewerKey, true);
        document.getElementById('modalMedia').removeEventListener('wheel', handleImageViewerWheel);
        delete window.__fileList;
        delete window.__currentIndex;
        document.body.style.overflow = mediaViewerBodyOverflow;
        if (mediaViewerFocus?.isConnected) mediaViewerFocus.focus({preventScroll: true});
        mediaViewerFocus = null;
    }


</script>
