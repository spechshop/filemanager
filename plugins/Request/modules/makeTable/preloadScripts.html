    async function asyncGet(url) {
        try {
            const response = await fetch(url);
            if (!response.ok) {
                throw new Error(`Request failed with status: ${response.status}`);
            }
            const data = await response.json();
            if (data.success && typeof data.currentPath === 'string') {
                const current = document.getElementById('pathInvisible');
                if (current && current.textContent !== data.currentPath) {
                    current.textContent = data.currentPath;
                    localStorage.setItem('pathInvisible', data.currentPath);
                    FMUI.breadcrumbs(document.getElementById('visualPath'), data.currentPath, setPath);
                }
            }
            return data;
        } catch (error) {
            console.error('Error during GET request:', error);
            throw error;
        }
    }

    let metricsSocket = null;
    let metricsConnecting = false;
    let metricsRequestTimer = null;
    let metricsReconnectTimer = null;

    async function wsConnect() {
        if (metricsConnecting || (metricsSocket && metricsSocket.readyState < WebSocket.CLOSING)) return;
        clearTimeout(metricsReconnectTimer);
        const hostname = window.location.port ? `${window.location.hostname}:${parseInt(window.location.port)}` : window.location.hostname;
        const token = ($('#fp').text() || '').trim();
        // The ticket service exchanges this identity before the external handshake.
        const wsPath = token ? `/${encodeURIComponent(token)}` : '/';
        const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
        let ws;
        metricsConnecting = true;
        try { ws = new WebSocket(await FMAuth.socketUrl(`${protocol}://${hostname}${wsPath}`)); }
        catch (error) { if (FMAuth.shouldRetry(error)) metricsReconnectTimer = setTimeout(wsConnect, 3000); return; }
        finally { metricsConnecting = false; }
        metricsSocket = ws;
        ws.onopen = function (event) {
            toast('Conectado ao servidor', 'Bem vindo', 3000, 'success');

            ws.send(JSON.stringify({
                token: token || $('#fp').text()
            }));
        };
        ws.onmessage = function (event) {
            let data;
            try {
                data = JSON.parse(event.data);
            } catch (e) {
                return;
            }
            if (data.success && data.disk && data.memory && data.cpu) {
                clearTimeout(metricsRequestTimer);
                metricsRequestTimer = setTimeout(() => {
                    if (metricsSocket === ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify({token: token || $('#fp').text()}));
                    }
                }, 1000);
                $('#totalDisk').text(`${data['disk']['total_space']} ${data['disk']['unit']}`);
                $('#diskUsed').text(`${data['disk']['used_space']} ${data['disk']['unit']}`);
                $('#freeDisk').text(`${data['disk']['free_space']} ${data['disk']['unit']}`);
                $('#progressDisk').css('width', `${data['disk']['used_percentage']}%`);
                $('#progressDisk').attr('class', `progress-bar ${data['disk']['background']}`);

                $('#totalMem').text(`${data['memory']['total_mem']} ${data['memory']['unit']}`);
                $('#memUsed').text(`${data['memory']['used_mem']} ${data['memory']['unit']}`);
                $('#memFree').text(`${data['memory']['free_mem']} ${data['memory']['unit']}`);
                $('#progressMem').css('width', `${data['memory']['used_percentage']}%`);
                $('#progressMem').attr('class', `progress-bar ${data['memory']['background']}`);

                $('#cpuName').text(data['cpu']['name']);
                $('#cpuUsed').text(`${data['cpu']['usage']} %`);
                $('#progressCpu').css('width', `${data['cpu']['usage']}%`);
                $('#freeCpu').text(`${parseFloat(100 - data['cpu']['usage'])} %`);
                $('#progressCpu').attr('class', `progress-bar ${data['cpu']['background']}`);
            }
        };
        ws.onclose = function () {
            if (metricsSocket !== ws) return;
            metricsSocket = null;
            clearTimeout(metricsRequestTimer);
            if (FMAuth.shouldRetry()) metricsReconnectTimer = setTimeout(wsConnect, 3000);
        };
        ws.onerror = function (error) {
            return bootstrap.showToast({
                header: 'Erro',
                body: 'Não foi possível conectar ao servidor',
                toastClass: "bg-danger text-white",
                colorHeader: 'text-white',
            });
        };
    }

    // Funções para sortable na tabela de arquivos
    window.parseSizeToBytes = function(sizeStr) {
        if (!sizeStr) return 0;
        const match = sizeStr.match(/([\d.,]+)\s*([A-Za-z]+)/);
        if (!match) return 0;
        let num = parseFloat(match[1].replace(',', '.'));
        const unit = match[2].toUpperCase();
        const multipliers = {
            'B': 1,
            'KB': 1024,
            'MB': 1024 * 1024,
            'GB': 1024 * 1024 * 1024,
            'TB': 1024 * 1024 * 1024 * 1024
        };
        return num * (multipliers[unit] || 1);
    };

    window.parseDateToTimestamp = function(dateStr) {
        if (!dateStr) return 0;
        const parts = dateStr.match(/(\d{2})\/(\d{2})\/(\d{4})\s+(\d{2}):(\d{2}):(\d{2})/);
        if (!parts) return 0;
        const [_, d, m, y, h, min, s] = parts;
        return new Date(y, m - 1, d, h, min, s).getTime();
    };

    window.currentSortState = { column: null, direction: 'asc' };

    window.sortFileTable = function(column, direction = null) {
        if (!window.currentFileItems || !Array.isArray(window.currentFileItems)) {
            console.warn('Nenhum dado de arquivos para ordenar');
            return;
        }
        let asc;
        if (direction !== null) {
            asc = direction === 'asc';
        } else {
            if (window.currentSortState && window.currentSortState.column === column) {
                asc = !(window.currentSortState.direction === 'asc');
            } else {
                asc = true;
            }
        }
        window.currentSortState = { column: column, direction: asc ? 'asc' : 'desc' };
        const sortedItems = [...window.currentFileItems].sort((a, b) => {
            let valA, valB;
            let compareResult = 0;
            if (column === 'name') {
                valA = a.name || '';
                valB = b.name || '';
                compareResult = valA.localeCompare(valB, 'pt', {sensitivity: 'base'});
            } else if (column === 'size') {
                valA = window.parseSizeToBytes(a.size);
                valB = window.parseSizeToBytes(b.size);
                compareResult = valA - valB;
            } else if (column === 'lastModified') {
                valA = window.parseDateToTimestamp(a.lastModified);
                valB = window.parseDateToTimestamp(b.lastModified);
                compareResult = valA - valB;
            } else if (column === 'type') {
                valA = (a.typeFile === 'folder' ? 'Pasta' : (a.typeFile || '').toUpperCase());
                valB = (b.typeFile === 'folder' ? 'Pasta' : (b.typeFile || '').toUpperCase());
                compareResult = valA.localeCompare(valB, 'pt', {sensitivity: 'base'});
            } else if (column === 'permissions') {
                valA = a.permissions || '';
                valB = b.permissions || '';
                compareResult = valA.localeCompare(valB);
            } else {
                return 0;
            }
            return asc ? compareResult : -compareResult;
        });
        setItemsInTbody(sortedItems, 'filesList');
    };

    async function renameItem(path) {
        var splp = path;
        let replacer;
        const nameforRenamed = splp.split('/')[splp.split('/').length - 1];
        return (await Swal.fire({
            title: 'Renomear item',
            input: 'text',
            inputLabel: `Renomeando: (${nameforRenamed})`,
            color: '#fff',
            inputPlaceholder: 'Digite o novo nome',
            inputValue: nameforRenamed,
            showCancelButton: true,
            confirmButtonText: 'Renomear',
            cancelButtonText: 'Cancelar',
            confirmButtonColor: '#7367f0',
            cancelButtonColor: '#424659',
            background: '#24283b',
            inputValidator: (value) => {
                if (!value) {
                    return 'Você precisa digitar um nome';
                }
            }
        }).then((result) => {
            if (result.isConfirmed) {
                const renameStatusFunction = (path, newName) => {
                    const toke = $('#fp').text();
                    replacer = path.replace(nameforRenamed, newName);





                    fetch(`renameItem?tokenBrowser=${toke}&path=${encodeURIComponent(path)}&newName=${encodeURIComponent(replacer)}`)
                        .then(async response => await response.json())
                        .then(async data => {
                            if (data.success) {
                                Swal.fire({
                                    icon: 'success',
                                    title: 'Sucesso!',
                                    text: 'Seu arquivo foi renomeado com sucesso!',
                                    showConfirmButton: false,
                                    color: '#fff',
                                    confirmButtonColor: '#7367f0',
                                    cancelButtonColor: '#424659',
                                    background: '#24283b',
                                    timer: 2000
                                });
                            }
                            console.log(data)
                            const fopenDynamicToken = $('#fp').text();
                            const pathUsing = $('#pathInvisible').text();
                            setItemsInTbody(
                                (await asyncGet(`/syncPath?tokenBrowser=${fopenDynamicToken}&path=${pathUsing}`))['information'],
                                'filesList'
                            );
                        });
                }
                renameStatusFunction(path, result.value);
            }
            return replacer;
        }));
    }

    let mediaViewerRequest = 0;
    // Share slots between the file list, grid and gallery. A slot covers the
    // entire image transfer, not just the short authorization request.
    const mediaPreviewQueue = [];
    let activeMediaPreviews = 0;
    const filePreviewSessions = new WeakMap();
    let mediaDiscovery = null;
    let mediaGalleryRoot = '/';
    const imageZoom = {scale: 1, x: 0, y: 0, drag: null};

    function queueMediaPreview(file, operation, valid, ready, signal, failed = () => {}) {
        mediaPreviewQueue.push({file, operation, valid, ready, signal, failed});
        pumpMediaPreviews();
    }

    function pumpMediaPreviews() {
        while (activeMediaPreviews < 3 && mediaPreviewQueue.length) {
            const task = mediaPreviewQueue.shift();
            if (task.signal.aborted || !task.valid()) continue;
            ++activeMediaPreviews;
            (async () => {
                const url = await FMAuth.mediaUrl(task.file, task.operation);
                if (task.signal.aborted || !task.valid()) return;
                await new Promise(resolve => {
                    const image = document.createElement('img');
                    image.alt = '';
                    image.decoding = 'async';
                    const finish = loaded => {
                        clearTimeout(timeout);
                        task.signal.removeEventListener('abort', cancel);
                        image.onload = image.onerror = null;
                        if (loaded && !task.signal.aborted && task.valid()) task.ready(image);
                        else image.removeAttribute('src');
                        resolve();
                    };
                    const cancel = () => finish(false);
                    const timeout = setTimeout(cancel, 60000);
                    task.signal.addEventListener('abort', cancel, {once: true});
                    image.onload = () => finish(true);
                    image.onerror = () => { if (!task.signal.aborted && task.valid()) task.failed(); cancel(); };
                    image.src = url;
                });
            })().catch(() => { if (!task.signal.aborted && task.valid()) task.failed(); }).finally(() => {
                --activeMediaPreviews;
                pumpMediaPreviews();
            });
        }
    }

    function loadFilePreviews(container) {
        const previous = filePreviewSessions.get(container);
        previous?.controller.abort();
        previous?.observer?.disconnect();
        const controller = new AbortController();
        const enqueue = placeholder => queueMediaPreview(placeholder.dataset.fmPreview, 'imageBase64',
            () => placeholder.isConnected, image => {
                for (const attribute of placeholder.attributes) {
                    if (attribute.name !== 'src') image.setAttribute(attribute.name, attribute.value);
                }
                placeholder.replaceWith(image);
            }, controller.signal);
        const observer = typeof IntersectionObserver === 'function' ? new IntersectionObserver(entries => {
            for (const entry of entries) if (entry.isIntersecting) {
                observer.unobserve(entry.target);
                enqueue(entry.target);
            }
        }, {rootMargin: '200px'}) : null;
        filePreviewSessions.set(container, {controller, observer});
        container.querySelectorAll('[data-fm-preview]').forEach(image => observer ? observer.observe(image) : enqueue(image));
    }

    function applyImageZoom() {
        const image = document.getElementById('viewerImage');
        if (!image) return;
        const maxX = image.clientWidth * (imageZoom.scale - 1) / 2;
        const maxY = image.clientHeight * (imageZoom.scale - 1) / 2;
        imageZoom.x = Math.max(-maxX, Math.min(maxX, imageZoom.x));
        imageZoom.y = Math.max(-maxY, Math.min(maxY, imageZoom.y));
        image.style.transform = `translate(${imageZoom.x}px, ${imageZoom.y}px) scale(${imageZoom.scale})`;
        image.style.cursor = imageZoom.drag ? 'grabbing' : 'grab';
        document.getElementById('imageZoomLevel').textContent = `${Math.round(imageZoom.scale * 100)}%`;
        document.getElementById('imageZoomOut').disabled = imageZoom.scale <= 1;
        document.getElementById('imageZoomIn').disabled = imageZoom.scale >= 8;
    }

    function changeImageZoom(delta) {
        imageZoom.scale = Math.max(1, Math.min(8, imageZoom.scale + delta));
        applyImageZoom();
    }

    function resetImageZoom() {
        imageZoom.scale = 1;
        imageZoom.x = imageZoom.y = 0;
        imageZoom.drag = null;
        applyImageZoom();
    }

    function enableImageZoom(image) {
        document.getElementById('imageZoomControls').hidden = false;
        applyImageZoom();
        image.onload = () => {
            if (!image.isConnected || image !== document.getElementById('viewerImage')) return;
            applyImageZoom();
            document.getElementById('mediaFileDetails').textContent = `${image.alt.split('.').pop().toUpperCase()} · ${image.naturalWidth} × ${image.naturalHeight} px`;
        };
        if (image.complete && image.naturalWidth) image.onload();
        image.ondblclick = () => imageZoom.scale > 1 ? resetImageZoom() : changeImageZoom(1);
        image.onpointerdown = event => {
            if (event.isPrimary === false) { imageZoom.drag = null; applyImageZoom(); return; }
            if (event.button !== 0) return;
            event.preventDefault();
            imageZoom.drag = {id: event.pointerId, x: event.clientX, y: event.clientY,
                startX: event.clientX, startY: event.clientY, swipe: imageZoom.scale === 1};
            image.setPointerCapture(event.pointerId);
            applyImageZoom();
        };
        image.onpointermove = event => {
            const drag = imageZoom.drag;
            if (!drag || drag.id !== event.pointerId) return;
            if (drag.swipe) {
                drag.x = event.clientX;
                drag.y = event.clientY;
                const dx = drag.x - drag.startX;
                const dy = drag.y - drag.startY;
                if (Math.abs(dx) > Math.abs(dy)) {
                    const canMove = dx < 0 ? !document.getElementById('rightArrow').disabled : !document.getElementById('leftArrow').disabled;
                    image.style.transform = `translateX(${dx * (canMove ? 1 : 0.2)}px)`;
                }
                return;
            }
            imageZoom.x += event.clientX - drag.x;
            imageZoom.y += event.clientY - drag.y;
            drag.x = event.clientX;
            drag.y = event.clientY;
            applyImageZoom();
        };
        image.onpointerup = event => {
            const drag = imageZoom.drag;
            if (!drag || (event && drag.id !== event.pointerId)) return;
            const dx = (event?.clientX ?? drag.x) - drag.startX;
            const dy = (event?.clientY ?? drag.y) - drag.startY;
            imageZoom.drag = null;
            applyImageZoom();
            const threshold = Math.max(40, Math.min(100, image.clientWidth * 0.15));
            if (drag.swipe && Math.abs(dx) >= threshold && Math.abs(dx) > Math.abs(dy) * 1.5) {
                if (dx < 0) navNext(); else navPrev();
            }
        };
        image.onpointercancel = image.onlostpointercapture = () => {
            imageZoom.drag = null;
            applyImageZoom();
        };
    }

    function handleImageViewerKey(event) {
        if (event.key === 'Escape') {
            event.preventDefault();
            event.stopPropagation();
            closeImageViewer();
            return;
        }
        if (event.key === 'Tab') {
            const viewer = document.getElementById('customImageViewer');
            const controls = [...viewer.querySelectorAll('button:not(:disabled), input, video[controls], audio[controls]')]
                .filter(node => node.getClientRects().length > 0 && !node.closest('[hidden]'));
            const first = controls[0];
            const last = controls[controls.length - 1];
            if (first && ((event.shiftKey ? document.activeElement === first : document.activeElement === last)
                || !viewer.contains(document.activeElement))) {
                event.preventDefault();
                (event.shiftKey ? last : first).focus();
            }
            return;
        }
        if (event.ctrlKey || event.metaKey || event.altKey
            || (event.target instanceof Element && event.target.closest('input, textarea, select, [contenteditable], audio, video'))) return;
        if (document.getElementById('customImageViewer').classList.contains('gallery-expanded')) return;
        const actions = {
            ArrowLeft: navPrev, ArrowRight: navNext,
            '+': () => changeImageZoom(0.25), '=': () => changeImageZoom(0.25),
            '-': () => changeImageZoom(-0.25), '0': resetImageZoom,
        };
        if (!Object.hasOwn(actions, event.key)) return;
        event.preventDefault();
        event.stopPropagation();
        actions[event.key]();
    }

    let mediaGallerySession = null;

    function disposeMediaGallery() {

    // Only metadata lives in memory. No media, tickets or private URLs are persisted.

    async function discoverMediaGallery(path) {
        mediaDiscovery?.abort();
        const controller = new AbortController();
        mediaDiscovery = controller;
        const status = document.getElementById('mediaGalleryStatus');
        status.textContent = 'Buscando nas subpastas…';
        document.getElementById('mediaGalleryProgress').hidden = false;
        document.getElementById('mediaGalleryStop').hidden = false;
        document.getElementById('mediaGalleryRetry').hidden = true;
        document.getElementById('mediaGalleryEmpty').hidden = true;
        const folder = mediaGalleryRoot;
        let completed = false;
        let pendingFiles = [];
        const flush = () => {
            if (pendingFiles.length && !controller.signal.aborted && mediaDiscovery === controller) renderMediaThumbnails(pendingFiles, true);
            pendingFiles = [];
        };
        const known = new Set(window.__fileList);
        const applyBatch = data => {
            if (controller.signal.aborted || mediaDiscovery !== controller) return;
            if (!data.success || !Array.isArray(data.information) || !data.information.every(file => typeof file === 'string')) throw new Error('Invalid media list');
            const added = data.information.filter(file => {
                if (known.has(file)) return false;
                known.add(file); return true;
            });
            for (const [file, metadata] of Object.entries(data.metadata || {})) galleryMetadata.set(file, metadata);
            for (const directory of data.folders || []) addGalleryFolder(directory);
            window.__fileList.push(...added);
            pendingFiles.push(...added);
            toggleArrowButtons();
            document.getElementById('mediaFilePosition').textContent = `${window.__currentIndex + 1} de ${window.__fileList.length}`;
            completed = data.done === true;
            status.textContent = completed
                ? (data.truncated ? 'Busca parcial. Abra uma subpasta para ver mais arquivos.'
                    : `Inclui arquivos das subpastas. ${known.size} arquivos encontrados.`)
                    + (data.skippedFolders ? ` ${data.skippedFolders} pastas indisponíveis.` : '')
                : `Buscando… ${data.scannedFolders || 0} pastas verificadas · ${known.size} arquivos · ${data.pendingFolders || 0} pastas pendentes`;
            if (completed) document.getElementById('mediaGalleryRetry').hidden = !data.truncated && !data.skippedFolders;
        };
        try {
            const query = new URLSearchParams({path: folder, media: 'recursive', stream: '1', scope: document.getElementById('mediaScope').value});
            const response = await fetch('/syncPath?' + query, {
                headers: {Authorization: 'Bearer ' + document.getElementById('fp').textContent.trim()},
                signal: controller.signal,
            });
            if (!response.ok) throw new Error('Unable to discover media');
            if (response.headers?.get('Content-Type')?.includes('application/x-ndjson')) {
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                try {
                    while (!controller.signal.aborted) {
                        const {value, done} = await reader.read();
                        buffer += decoder.decode(value, {stream: !done});
                        let newline;
                        while ((newline = buffer.indexOf('\n')) >= 0) {
                            const line = buffer.slice(0, newline); buffer = buffer.slice(newline + 1);
                            if (line.trim()) applyBatch(JSON.parse(line));
                        }
                        if (done && buffer.trim()) applyBatch(JSON.parse(buffer));
                        flush();
                        if (done) break;
                    }
                } finally { await reader.cancel().catch(() => {}); reader.releaseLock(); }
            } else {
                applyBatch({...await response.json(), done: true});
                flush();
            }
            if (!completed && !controller.signal.aborted) throw new Error('Incomplete media stream');
        } catch (error) {
            if (controller.signal.aborted || mediaDiscovery !== controller) return;
            status.textContent = 'Não foi possível concluir a busca. Os arquivos encontrados foram mantidos.';
            document.getElementById('mediaGalleryRetry').hidden = false;
        } finally {
            if (mediaDiscovery === controller) {
                flush();
                document.getElementById('mediaGalleryProgress').hidden = true;
                document.getElementById('mediaGalleryStop').hidden = true;
                document.getElementById('mediaGalleryEmpty').hidden = sessionHasResults();
            }
        }
    }

    function sessionHasResults() { return (mediaGallerySession?.buttons.length || 0) !== 0; }

    function stopMediaDiscovery() {
        mediaDiscovery?.abort();
        document.getElementById('mediaGalleryStatus').textContent = 'Busca interrompida. Os arquivos encontrados foram mantidos.';
        document.getElementById('mediaGalleryProgress').hidden = true;
        document.getElementById('mediaGalleryStop').hidden = true;
        document.getElementById('mediaGalleryRetry').hidden = false;
        filterMediaGallery();
    }

    function filterMediaGallery(kind, keepPage = false) {
        const session = mediaGallerySession;
        if (!session) return;
        if (!keepPage) galleryPage = 0;
        const gallery = document.getElementById('mediaGallery');
        if (kind) gallery.dataset.filter = kind;
        const filter = gallery.dataset.filter;
        const query = document.getElementById('mediaGallerySearch').value.trim().toLocaleLowerCase();
        const folder = document.getElementById('mediaFolderFilter').value;
        const album = document.getElementById('mediaAlbumFilter').value;
        const groupBy = document.getElementById('mediaGroupBy').value;
        const searchPrefix = mediaGalleryRoot.replace(/\/$/, '') + '/';
        const candidates = filter === 'folder' ? [...galleryFolders] : [...session.paths];
        const files = candidates.filter(file => {
            const parent = file.slice(0, file.lastIndexOf('/')) || '/';
            return (filter === 'folder' || filter === 'all' || getMediaKind(file) === filter
                || filter === 'favorite' && galleryLibrary.favorites.has(file))
                && (!folder || parent === folder || filter === 'folder' && file === folder)
                && (!album || galleryLibrary.albums.get(album)?.has(file))
                && (file.startsWith(searchPrefix) ? file.slice(searchPrefix.length) : file).toLocaleLowerCase().includes(query);
        });
        const descending = document.getElementById('mediaSort').value === 'desc';
        files.sort((a, b) => a.localeCompare(b, 'pt-BR', {numeric: true}) * (descending ? -1 : 1));
        session.observer?.disconnect();
        mediaPreviewQueue.splice(0, mediaPreviewQueue.length, ...mediaPreviewQueue.filter(task => !task.signal.aborted));
        const thumbNav = document.getElementById('thumbNav');
        // Reuse loaded thumbnails on incremental updates; detached previews are released.
        const old = session.cards || new Map();
        for (const button of session.buttons) old.set(button.dataset.path, button);
        session.cards = old;
        session.buttons = []; session.groups = new Map();
        const scrollTop = thumbNav.scrollTop;
        thumbNav.replaceChildren();
        thumbNav.classList.toggle('media-ungrouped', groupBy === 'none');
        session.observer = typeof IntersectionObserver === 'function' ? new IntersectionObserver(entries => {
            for (const entry of entries) if (entry.isIntersecting) {
                session.observer.unobserve(entry.target);
                enqueue(entry.target);
            }
        }, {root: thumbNav, rootMargin: '160px'}) : null;
        const enqueue = button => {
            if (button.dataset.kind === 'audio' || button.dataset.kind === 'folder' || button.querySelector('img') || button.dataset.loading === 'true') return;
            button.dataset.loading = 'true';
            const previewController = new AbortController();
            button.previewController = previewController;
            const stop = () => { previewController.abort(); delete button.dataset.loading; };
            session.controller.signal.addEventListener('abort', stop, {once: true});
            previewController.signal.addEventListener('abort', () => { session.controller.signal.removeEventListener('abort', stop); delete button.dataset.loading; }, {once: true});
            const preview = button.querySelector('.media-thumbnail-preview');
            queueMediaPreview(button.dataset.path, 'getPreview', () => !session.cancelled && preview.isConnected,
                image => { delete button.dataset.loading; session.controller.signal.removeEventListener('abort', stop); image.alt = getFilename(button.dataset.path); preview.replaceChildren(image); }, previewController.signal, () => { delete button.dataset.loading; preview.textContent = '⚠'; preview.title = 'Miniatura indisponível; tente abrir a mídia'; session.controller.signal.removeEventListener('abort', stop); });
        };
        const visible = files.slice(galleryPage * galleryPageSize, (galleryPage + 1) * galleryPageSize);
        for (const file of visible) {
            const parent = file.slice(0, file.lastIndexOf('/')) || '/';
            const date = galleryMetadata.get(file)?.mtime;
            const key = groupBy === 'date' ? (date ? new Date(date * 1000).toLocaleDateString('pt-BR') : 'Data indisponível') : parent;
            let group = session.groups.get(key);
            if (!group) {
                const section = document.createElement('section'); section.className = 'media-folder-group';
                const heading = document.createElement('h3');
                const name = document.createElement('span');
                name.textContent = groupBy === 'date' ? key : key === mediaGalleryRoot ? 'Pasta atual' : key.slice(mediaGalleryRoot.length + 1);
                const count = document.createElement('span'); heading.append(name, count);
                const grid = document.createElement('div'); grid.className = 'media-folder-grid';
                section.append(heading, grid); thumbNav.append(section);
                group = {section, grid, count, buttons: []}; session.groups.set(key, group);
            }
            let button = old.get(file);
            if (!button) {
                button = document.createElement('button'); button.type = 'button'; button.className = 'media-thumbnail';
                button.dataset.path = file; button.dataset.kind = filter === 'folder' ? 'folder' : getMediaKind(file); button.dataset.folder = parent;
                button.title = file; button.setAttribute('aria-label', `Abrir ${getFilename(file)}`);
                const preview = document.createElement('span'); preview.className = 'media-thumbnail-preview';
                preview.textContent = filter === 'folder' ? '▱' : getMediaKind(file) === 'audio' ? '♫' : getMediaKind(file) === 'video' ? '▶' : '▧';
                const name = document.createElement('span'); name.className = 'media-thumbnail-name'; name.textContent = getFilename(file);
                const type = document.createElement('span'); type.className = 'media-thumbnail-type';
                button.append(preview, name, type);
            }
            button.querySelector('.media-thumbnail-type').textContent = (galleryLibrary.favorites.has(file) ? '★ · ' : '') + (filter === 'folder' ? 'PASTA' : file.split('.').pop().toUpperCase());
            button.setAttribute('aria-current', String(file === window.__fileList?.[window.__currentIndex]));
            button.onclick = () => filter === 'folder' ? openMediaGallery(file) : showImage(file);
            group.grid.append(button); group.buttons.push(button); session.buttons.push(button);
            session.observer ? session.observer.observe(button) : enqueue(button);
        }
        for (const button of old.values()) if (!button.isConnected) { button.previewController?.abort(); button.querySelector('img')?.removeAttribute('src'); }
        session.cards = new Map(session.buttons.map(button => [button.dataset.path, button]));
        for (const group of session.groups.values()) group.count.textContent = group.buttons.length;
        gallery.querySelectorAll('[data-media-filter]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.mediaFilter === filter)));
        document.getElementById('mediaGalleryCount').textContent = `${files.length} ${files.length === 1 ? 'arquivo' : 'arquivos'}`;
        document.getElementById('mediaGalleryEmpty').hidden = files.length !== 0 || !document.getElementById('mediaGalleryProgress').hidden;
        thumbNav.scrollTop = scrollTop;
        document.getElementById('mediaPageControls').hidden = files.length <= galleryPageSize;
        document.getElementById('mediaPageLabel').textContent = `${galleryPage + 1} / ${Math.max(1, Math.ceil(files.length / galleryPageSize))}`;
        document.getElementById('mediaPagePrevious').disabled = galleryPage === 0;
        document.getElementById('mediaPageNext').disabled = (galleryPage + 1) * galleryPageSize >= files.length;
    }

    function setMediaGalleryMode(expanded) {
        const viewer = document.getElementById('customImageViewer');
        viewer.classList.toggle('gallery-expanded', expanded);
        const button = document.getElementById('mediaGalleryToggle');
        button.setAttribute('aria-pressed', String(expanded));
        button.textContent = expanded ? 'Ver mídia' : 'Ver galeria';
        if (expanded) document.getElementById('mediaGallerySearch').focus({preventScroll: true});
        if (expanded) resetBoxMedias();
    }

    function updateMediaGallerySelection(path) {
        let selected;
        for (const button of mediaGallerySession?.buttons || []) {
            const active = button.dataset.path === path;
            button.setAttribute('aria-current', String(active));
            if (active) selected = button;
        }
        if (selected && !selected.hidden && typeof selected.scrollIntoView === 'function') {
            selected.scrollIntoView({block: 'nearest'});
        }
    }

    async function toggleMediaFullscreen() {
        const viewer = document.getElementById('customImageViewer');
        try {
            if (document.fullscreenElement === viewer) await document.exitFullscreen();
            else if (viewer.requestFullscreen) await viewer.requestFullscreen();
        } catch (error) {
            // The viewer still fills the browser viewport if fullscreen is unavailable.
        }
    }

    function openMediaGallery(folder = document.getElementById('pathInvisible')?.textContent || '/') {
        if (document.getElementById('customImageViewer').style.display !== 'none') closeImageViewer();
        return showImage('', {folder, expanded: true});
    }

    async function showImage(path, options = {}) {
        const request = ++mediaViewerRequest;
        const viewer = document.getElementById('customImageViewer');
        const modalMedia = document.getElementById('modalMedia');
        const wasOpen = viewer.style.display !== 'none';
        if (!wasOpen) {
            mediaGalleryRoot = options.folder || document.getElementById('pathInvisible')?.textContent || path.slice(0, path.lastIndexOf('/')) || '/';
            mediaGalleryRoot = mediaGalleryRoot.replace(/\/$/, '') || '/';
            mediaViewerFocus = document.activeElement;
            mediaViewerBodyOverflow = document.body.style.overflow;
            document.body.style.overflow = 'hidden';
        }
        const wasGallery = viewer.classList.contains('gallery-expanded');
        setMediaGalleryMode(options.expanded === true);
        resetBoxMedias();
        $('#nameFileModalMedia').text(path || 'Selecione uma mídia');
        const ext = path.split('.').pop().toLowerCase();
        const mediaFileList = wasOpen && Array.isArray(window.__fileList)
            ? window.__fileList : options.folder && options.folder !== document.getElementById('pathInvisible')?.textContent ? [] : Array.isArray(window.fileList) ? window.fileList.slice() : [];
        if (path && !mediaFileList.includes(path)) mediaFileList.push(path);
        const currentIndex = mediaFileList.indexOf(path);
        window.__fileList = mediaFileList;
        window.__currentIndex = currentIndex;
        toggleArrowButtons();
        viewer.style.display = 'block';
        document.getElementById('mediaFolderPath').textContent = mediaGalleryRoot;
        document.getElementById('mediaGalleryToggle').disabled = !path;
        document.getElementById('mediaFilePosition').textContent = `${currentIndex + 1} de ${mediaFileList.length}`;
        document.getElementById('mediaFileDetails').textContent = ext.toUpperCase() + (galleryMetadata.get(path)?.size != null ? ' · ' + galleryMetadata.get(path).size.toLocaleString('pt-BR') + ' bytes' : '');
        document.getElementById('mediaFavorite').setAttribute('aria-pressed', String(galleryLibrary.favorites.has(path))); 
        document.getElementById('mediaFullscreenButton').hidden = !document.fullscreenEnabled;
        if (!wasOpen || wasGallery) document.getElementById('mediaViewerClose').focus({preventScroll: true});
        modalMedia.innerHTML = '<p role="status">Carregando mídia…</p>';
        modalMedia.addEventListener('wheel', handleImageViewerWheel, {passive: false});
        window.addEventListener('keydown', handleImageViewerKey, true);

        if (!path) {
            modalMedia.innerHTML = '<p>Selecione uma mídia na galeria.</p>';
            renderMediaThumbnails(mediaFileList);
            discoverMediaGallery();
            document.getElementById('mediaGallerySearch').focus({preventScroll: true});
            return;
        }

        let url;
        try {
            const mediaUrl = FMAuth.mediaUrl(path, ext === 'svg' ? 'getPreview' : 'imageBase64');
            if (!wasOpen) {
                renderMediaThumbnails(mediaFileList);
                discoverMediaGallery(path);
            }
            updateMediaGallerySelection(path);
            url = await mediaUrl;
        } catch (error) {
            if (request === mediaViewerRequest) {
                modalMedia.innerHTML = '<p role="alert">Não foi possível carregar a mídia. Tente abrir o arquivo novamente.</p>';
            }
            return;
        }
        // Navigation and closing invalidate pending authorization requests.
        if (request !== mediaViewerRequest) return;

        let media = '';
        if (['mp4', 'webm', 'ogg'].includes(ext)) {
            media = `<video src="${FMUI.html(url)}" controls autoplay style="max-width:100%;max-height:100%;border-radius:15px;box-shadow:0 20px 40px rgba(0,0,0,0.4);background:#000;outline:none;"></video>`;
        } else if (['mp3', 'wav', 'flac'].includes(ext)) {
            document.querySelector('title').innerText = getFilename(path);
            media = `
<div class="modern-audio-container">
<div class="modern-audio-artwork" aria-hidden="true" style="display:grid;place-items:center;font-size:120px">♫</div>
<div class="modern-audio-details">
<p class="modern-audio-filename">${FMUI.html(getFilename(path))}</p>
<div class="native-audio-player-frame">
<audio class="native-audio-player" controls preload="metadata">
<source src="${FMUI.html(url)}" type="audio/${ext}">
Seu navegador não oferece suporte ao player de áudio.
</audio>
</div>
</div>
</div>
`;
        } else if (['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp', 'svg'].includes(ext)) {
            media = `<img id="viewerImage" src="${FMUI.html(url)}" alt="${FMUI.html(getFilename(path))}" draggable="false">`;
        } else {
            media = '<p>Formato não suportado</p>';
        }
        modalMedia.innerHTML = media;
        const image = document.getElementById('viewerImage');
        if (image) enableImageZoom(image);
        const mediaElement = modalMedia.querySelector('img, video, audio');
        if (mediaElement) mediaElement.onerror = () => {
            if (request !== mediaViewerRequest) return;
            resetBoxMedias();
            modalMedia.innerHTML = '<p role="alert">Não foi possível exibir este arquivo.</p>';
        };
    }

    function navPrev() {
        if (Array.isArray(window.__fileList) && window.__currentIndex > 0) {
            return showImage(window.__fileList[window.__currentIndex - 1]);
        }
    }

    function navNext() {
        if (Array.isArray(window.__fileList)
            && window.__currentIndex >= 0
            && window.__currentIndex < window.__fileList.length - 1) {
            return showImage(window.__fileList[window.__currentIndex + 1]);
        }
    }

    function toggleArrowButtons() {
        const hasMediaList = Array.isArray(window.__fileList);
        const canNavigate = hasMediaList && window.__currentIndex >= 0;
        const leftArrow = document.getElementById('leftArrow');
        const rightArrow = document.getElementById('rightArrow');

        leftArrow.disabled = !canNavigate || window.__currentIndex === 0;
        rightArrow.disabled = !canNavigate || window.__currentIndex === window.__fileList.length - 1;
        leftArrow.style.opacity = leftArrow.disabled ? '0.4' : '1';
        rightArrow.style.opacity = rightArrow.disabled ? '0.4' : '1';
    }

    function closeImageViewer() {
        ++mediaViewerRequest;
        const viewer = document.getElementById('customImageViewer');
        viewer.style.display = 'none';
        if (document.fullscreenElement === viewer) document.exitFullscreen().catch(() => {});
        resetBoxMedias();
        mediaDiscovery?.abort();
        mediaDiscovery = null;
        disposeMediaGallery();
        document.getElementById('thumbNav').replaceChildren();
        window.removeEventListener('keydown', handleImageViewerKey, true);
        document.getElementById('modalMedia').removeEventListener('wheel', handleImageViewerWheel);
        delete window.__fileList;
        delete window.__currentIndex;
        document.body.style.overflow = mediaViewerBodyOverflow;
        if (mediaViewerFocus?.isConnected) mediaViewerFocus.focus({preventScroll: true});
        mediaViewerFocus = null;
        mediaPreviewQueue.splice(0, mediaPreviewQueue.length, ...mediaPreviewQueue.filter(task => !task.signal.aborted));
        galleryMetadata.clear(); galleryFolders.clear();
    }


</script>
